<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>关键词去重 - 卖家工具箱</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-blue: #0066cc;
            --apple-card: #ffffff;
            --apple-text: #1d1d1f;
            --apple-secondary: #86868b;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--apple-bg);
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
            color: var(--apple-text);
        }

        /* 统一导航栏 */
        .nav-header {
            height: 52px; background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; border-bottom: 1px solid rgba(0,0,0,0.05); z-index: 100;
        }

        .home-logo {
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; background: #fff; border: 1px solid #e5e5e7;
            color: #1d1d1f; text-decoration: none; transition: 0.2s;
        }
        .home-logo:hover { transform: scale(1.05); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

        /* 系统配置按钮（保持视觉统一） */
        .api-status-btn {
            padding: 6px 14px; border-radius: 18px; font-size: 13px; font-weight: 500;
            background: rgba(52, 199, 89, 0.1); color: #34c759; border: none;
        }

        .container { max-width: 1200px; margin: 0 auto; width: 95%; flex: 1; display: flex; flex-direction: column; padding: 24px 0; overflow: hidden; }

        /* 顶部的选项栏 */
        .options-bar {
            background: var(--apple-card); padding: 16px 24px; border-radius: 20px;
            margin-bottom: 20px; display: flex; gap: 30px; align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .option-item { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
        
        select {
            padding: 6px 12px; border-radius: 10px; border: 1px solid #d2d2d7;
            background: #fff; outline: none; font-size: 13px;
        }

        /* 主体布局 */
        .workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; flex: 1; overflow: hidden; }
        
        .panel { 
            background: var(--apple-card); border-radius: 24px; padding: 24px;
            display: flex; flex-direction: column; box-shadow: 0 8px 30px rgba(0,0,0,0.04);
        }

        .panel-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
        }
        .panel-title { font-size: 17px; font-weight: 600; }
        .stat-tag { font-size: 12px; background: #f5f5f7; color: var(--apple-secondary); padding: 4px 10px; border-radius: 12px; }

        textarea {
            flex: 1; width: 100%; padding: 16px; border-radius: 16px; border: 1px solid #d2d2d7;
            background: #fafafa; font-size: 14px; line-height: 1.6; resize: none;
            box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'SF Mono', Menlo, monospace;
        }
        textarea:focus {
            background: #fff; border-color: var(--apple-blue);
            box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.1); outline: none;
        }

        /* 底部操作 */
        .btn-group { display: flex; gap: 12px; margin-top: 20px; }
        
        .btn {
            padding: 10px 20px; border-radius: 22px; font-size: 14px; font-weight: 500;
            border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .btn-primary { background: var(--apple-blue); color: #fff; }
        .btn-primary:hover { background: #0077ed; }
        .btn-secondary { background: #f5f5f7; color: var(--apple-text); }
        .btn-secondary:hover { background: #e8e8ed; }
        .btn-danger { background: rgba(255, 59, 48, 0.1); color: #ff3b30; }

        /* 动画 */
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        .processing { animation: pulse 1s infinite; }
    </style>
</head>
<body>

<div class="nav-header">
    <a href="index.html" class="home-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </a>
    <div style="font-weight: 600;">文本去重 & 关键词优化</div>
    <button class="api-status-btn">本地处理模式</button>
</div>

<div class="container">
    <div class="options-bar">
        <div class="option-item">
            <span style="color:var(--apple-secondary)">识别分隔符</span>
            <select id="separator" onchange="handleProcess()">
                <option value="auto">自动智能识别</option>
                <option value="space">仅空格</option>
                <option value="line">仅换行</option>
                <option value="comma">仅逗号</option>
            </select>
        </div>
        <div class="option-item">
            <input type="checkbox" id="ignoreCase" checked onchange="handleProcess()" style="width:16px; height:16px; cursor:pointer;">
            <label for="ignoreCase" style="cursor:pointer">忽略大小写</label>
        </div>
    </div>

    <div class="workspace">
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">原始数据</div>
                <div class="stat-tag" id="beforeStat">数量: 0</div>
            </div>
            <textarea id="inputText" placeholder="在此粘贴关键词..." oninput="handleProcess()"></textarea>
            <div class="btn-group">
                <button class="btn btn-danger" onclick="clearAll()">🗑️ 清空</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">去重结果</div>
                <div class="stat-tag" id="afterStat">数量: 0 | 字符: 0</div>
            </div>
            <textarea id="outputText" readonly placeholder="清洗后的结果..."></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="copyResult()">📋 复制结果</button>
                <button class="btn btn-secondary" onclick="downloadTXT()">💾 导出 TXT</button>
            </div>
        </div>
    </div>
</div>

<script>
    function handleProcess() {
        const input = document.getElementById('inputText').value;
        const separatorType = document.getElementById('separator').value;
        const ignoreCase = document.getElementById('ignoreCase').checked;
        
        if (!input.trim()) {
            updateResult("", 0);
            document.getElementById('beforeStat').innerText = `数量: 0`;
            return;
        }

        let regex;
        if (separatorType === "space") regex = /[ ]+/;
        else if (separatorType === "line") regex = /[\n\r]+/;
        else if (separatorType === "comma") regex = /[,，]+/;
        else regex = /[ \n\r,，]+/;

        const words = input.split(regex).filter(w => w.trim() !== "");
        document.getElementById('beforeStat').innerText = `单词数: ${words.length}`;

        const seen = new Set();
        const result = [];

        words.forEach(word => {
            const compareWord = ignoreCase ? word.toLowerCase() : word;
            if (!seen.has(compareWord)) {
                seen.add(compareWord);
                result.push(word);
            }
        });

        const output = result.join(" ");
        updateResult(output, result.length);
    }

    function updateResult(text, count) {
        document.getElementById('outputText').value = text;
        document.getElementById('afterStat').innerText = `去重后: ${count} | 字符: ${text.length}`;
    }

    function copyResult() {
        const output = document.getElementById('outputText');
        output.select();
        document.execCommand('copy');
        
        const btn = event.currentTarget;
        const originalHtml = btn.innerHTML;
        btn.innerHTML = "✅ 已复制";
        btn.style.background = "#34c759";
        setTimeout(() => {
            btn.innerHTML = originalHtml;
            btn.style.background = "var(--apple-blue)";
        }, 1500);
    }

    function downloadTXT() {
        const text = document.getElementById('outputText').value;
        if(!text) return;
        const blob = new Blob([text], {type: "text/plain"});
        const anchor = document.createElement("a");
        anchor.download = "cleaned_keywords.txt";
        anchor.href = window.URL.createObjectURL(blob);
        anchor.click();
    }

    function clearAll() {
        document.getElementById('inputText').value = "";
        handleProcess();
    }
</script>

</body>
</html>
