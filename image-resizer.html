<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片批量缩放 - Amazon 运营工具箱</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --primary: #1890ff; --bg: #f5f7fa; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        .nav-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; background: white; padding: 12px 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .back-btn { text-decoration: none; color: var(--primary); font-weight: bold; display: flex; align-items: center; gap: 5px; }
        
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; }
        .upload-area { border: 2px dashed #d9d9d9; padding: 40px; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-bottom: 20px; }
        .upload-area:hover { border-color: var(--primary); background: #f0f7ff; }
        
        .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; margin-top: 20px; }
        .preview-item { position: relative; border: 1px solid #eee; border-radius: 4px; padding: 5px; }
        .preview-item img { width: 100%; height: 120px; object-fit: contain; }
        .preview-item .size-tag { font-size: 10px; color: #8c8c8c; }

        .btn-group { margin-top: 20px; display: flex; justify-content: center; gap: 15px; }
        .btn { padding: 12px 30px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: #52c41a; color: white; }
        .btn:disabled { background: #bfbfbf; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-header">
        <a href="index.html" class="back-btn"><span>🏠</span> 返回首页</a>
        <div style="font-weight: bold;">亚马逊主图批量缩放 (1600 × 1600)</div>
    </div>

    <div class="card">
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 40px;">📁</div>
            <p>点击或拖拽图片到这里批量上传</p>
            <p style="font-size: 12px; color: #8c8c8c;">支持 JPG, PNG, WebP 格式</p>
            <input type="file" id="fileInput" hidden multiple accept="image/*">
        </div>

        <div id="statusText" style="margin: 10px 0; color: #595959;">未选择文件</div>

        <div class="btn-group">
            <button class="btn btn-primary" id="processBtn" disabled onclick="processImages()">⚡ 开始转换</button>
            <button class="btn btn-success" id="downloadBtn" disabled onclick="downloadAll()">📥 导出全部 (ZIP)</button>
        </div>

        <div class="preview-grid" id="previewGrid"></div>
    </div>
</div>

<canvas id="canvas" width="1600" height="1600" style="display:none;"></canvas>

<script>
    let rawFiles = [];
    let processedImages = []; // 存储 base64 数据

    const fileInput = document.getElementById('fileInput');
    const previewGrid = document.getElementById('previewGrid');
    const processBtn = document.getElementById('processBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusText = document.getElementById('statusText');

    fileInput.onchange = (e) => {
        rawFiles = Array.from(e.target.files);
        if(rawFiles.length > 0) {
            statusText.innerText = `已选中 ${rawFiles.length} 张图片`;
            processBtn.disabled = false;
            renderPreviews();
        }
    };

    function renderPreviews() {
        previewGrid.innerHTML = '';
        rawFiles.forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                div.innerHTML = `<img src="${e.target.result}"><div class="size-tag">等待转换</div>`;
                previewGrid.appendChild(div);
            };
            reader.readAsDataURL(file);
        });
    }

    async function processImages() {
        processedImages = [];
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        statusText.innerText = "转换中，请稍候...";

        for (let i = 0; i < rawFiles.length; i++) {
            const img = await loadImage(rawFiles[i]);
            
            // 绘制逻辑：白色背景填充
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, 1600, 1600);

            // 计算比例，确保图片居中且不拉伸变形
            let width, height, x, y;
            const ratio = Math.min(1600 / img.width, 1600 / img.height);
            width = img.width * ratio;
            height = img.height * ratio;
            x = (1600 - width) / 2;
            y = (1600 - height) / 2;

            ctx.drawImage(img, x, y, width, height);
            
            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            processedImages.push({ name: rawFiles[i].name.split('.')[0] + '_1600.jpg', data: dataUrl });
            
            // 更新预览状态
            previewGrid.children[i].querySelector('.size-tag').innerText = "✅ 1600×1600";
            previewGrid.children[i].querySelector('.size-tag').style.color = "#52c41a";
        }

        statusText.innerText = "转换完成！";
        downloadBtn.disabled = false;
    }

    function loadImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    async function downloadAll() {
        const zip = new JSZip();
        processedImages.forEach(item => {
            // 去掉 base64 前缀
            const imgData = item.data.split(',')[1];
            zip.file(item.name, imgData, {base64: true});
        });

        const content = await zip.generateAsync({type:"blob"});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = `Amazon_Images_1600_${new Date().getTime()}.zip`;
        link.click();
    }
</script>

</body>
</html>
