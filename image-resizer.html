<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图像缩放专家 - 卖家工具箱</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-blue: #0066cc;
            --apple-green: #34c759;
            --apple-card: rgba(255, 255, 255, 0.8);
            --apple-text: #1d1d1f;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--apple-bg); margin: 0; color: var(--apple-text);
            -webkit-font-smoothing: antialiased;
        }

        /* 导航 */
        .nav-header {
            height: 52px; background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; border-bottom: 1px solid rgba(0,0,0,0.05);
            position: sticky; top: 0; z-index: 1000;
        }

        .home-logo {
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; background: #fff; border: 1px solid #e5e5e7;
            color: #1d1d1f; text-decoration: none;
        }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }

        /* 上传区 */
        .card { 
            background: #fff; border-radius: 24px; padding: 32px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
        }

        .drop-zone {
            border: 2px dashed #d2d2d7; border-radius: 20px; padding: 60px 20px;
            background: #fafafa; cursor: pointer; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }
        .drop-zone:hover { border-color: var(--apple-blue); background: #fff; }
        .drop-zone.drag-over { border-color: var(--apple-blue); transform: scale(1.02); background: rgba(0,102,204,0.05); }

        /* 按钮组 */
        .action-bar {
            display: flex; justify-content: center; gap: 12px; margin: 24px 0;
            opacity: 0; transform: translateY(10px); transition: 0.4s;
        }
        .action-bar.visible { opacity: 1; transform: translateY(0); }

        .btn {
            padding: 10px 24px; border-radius: 20px; font-size: 14px; font-weight: 500;
            border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .btn-primary { background: var(--apple-blue); color: white; }
        .btn-secondary { background: #f5f5f7; color: var(--apple-text); }
        .btn-success { background: var(--apple-green); color: white; }
        .btn:disabled { background: #e5e5e7; color: #86868b; cursor: not-allowed; }
        .btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.05); }

        /* 预览网格 */
        .preview-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px; margin-top: 32px;
        }
        .image-card {
            background: white; border-radius: 16px; padding: 12px;
            border: 1px solid #f2f2f2; transition: 0.3s;
            animation: fadeIn 0.5s ease backwards;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } }
        
        .image-card img {
            width: 100%; height: 160px; object-fit: contain;
            background: #f9f9f9; border-radius: 10px; margin-bottom: 10px;
        }
        .info-row { display: flex; justify-content: space-between; align-items: center; }
        .filename { font-size: 11px; color: #86868b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px; }
        .status-pill { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: #f2f2f2; font-weight: 600; }
        .status-ready { color: var(--apple-green); background: rgba(52, 199, 89, 0.1); }

        #statusText { text-align: center; font-size: 14px; color: #86868b; margin-top: 20px; }

        /* Canvas 隐藏 */
        #workerCanvas { display: none; }
    </style>
</head>
<body>

<div class="nav-header">
    <a href="index.html" class="home-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
    </a>
    <div style="font-weight: 600; font-size: 14px;">1600×1600 主图合规专家</div>
    <div style="width: 32px;"></div>
</div>

<div class="container">
    <div class="card">
        <div id="dropZone" class="drop-zone" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 48px; margin-bottom: 16px;">🖼️</div>
            <div style="font-size: 18px; font-weight: 600;">选择或拖拽产品图片</div>
            <div style="color: #86868b; font-size: 13px; margin-top: 8px;">自动补全纯白背景并缩放至 1600px</div>
            <input type="file" id="fileInput" hidden multiple accept="image/*">
        </div>

        <div id="statusText">等待文件导入...</div>

        <div class="action-bar" id="actionBar">
            <button class="btn btn-primary" id="processBtn" onclick="processImages()">⚡ 开始批量转换</button>
            <button class="btn btn-secondary" id="downloadIndividualBtn" disabled onclick="downloadIndividual()">🖼️ 逐个下载</button>
            <button class="btn btn-success" id="downloadZipBtn" disabled onclick="downloadZip()">📦 打包 ZIP</button>
        </div>

        <div class="preview-grid" id="previewGrid"></div>
    </div>
</div>

<canvas id="workerCanvas" width="1600" height="1600"></canvas>

<script>
    let rawFiles = [];
    let processedImages = [];
    
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const previewGrid = document.getElementById('previewGrid');
    const actionBar = document.getElementById('actionBar');
    const statusText = document.getElementById('statusText');

    // 拖拽逻辑
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); };
    dropZone.ondragleave = () => dropZone.classList.remove('drag-over');
    dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        handleFiles(e.dataTransfer.files);
    };

    fileInput.onchange = (e) => handleFiles(e.target.files);

    function handleFiles(files) {
        rawFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
        if (rawFiles.length > 0) {
            renderPreviews();
            actionBar.classList.add('visible');
            statusText.innerText = `已加载 ${rawFiles.length} 张图片`;
            document.getElementById('processBtn').disabled = false;
        }
    }

    function renderPreviews() {
        previewGrid.innerHTML = '';
        rawFiles.forEach((file, index) => {
            const card = document.createElement('div');
            card.className = 'image-card';
            card.style.animationDelay = `${index * 0.05}s`;
            const url = URL.createObjectURL(file);
            card.innerHTML = `
                <img src="${url}">
                <div class="info-row">
                    <span class="filename">${file.name}</span>
                    <span class="status-pill" id="status-${index}">等待处理</span>
                </div>
            `;
            previewGrid.appendChild(card);
        });
    }

    async function processImages() {
        const canvas = document.getElementById('workerCanvas');
        const ctx = canvas.getContext('2d');
        processedImages = [];
        
        statusText.innerText = "🚀 正在进行高性能图像重绘...";
        document.getElementById('processBtn').disabled = true;

        for (let i = 0; i < rawFiles.length; i++) {
            const img = await loadImage(rawFiles[i]);
            
            // 重置画布并填充纯白
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, 1600, 1600);

            // 计算等比缩放
            const scale = Math.min(1600 / img.width, 1600 / img.height);
            const w = img.width * scale;
            const h = img.height * scale;
            const x = (1600 - w) / 2;
            const y = (1600 - h) / 2;

            ctx.drawImage(img, x, y, w, h);
            
            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            const name = rawFiles[i].name.replace(/\.[^/.]+$/, "") + "_1600.jpg";
            processedImages.push({ name, data: dataUrl });

            // 更新 UI
            const pill = document.getElementById(`status-${i}`);
            pill.innerText = "已就绪";
            pill.classList.add('status-ready');
        }

        statusText.innerText = "✅ 转换完成，请选择导出方式";
        document.getElementById('downloadIndividualBtn').disabled = false;
        document.getElementById('downloadZipBtn').disabled = false;
        document.getElementById('processBtn').disabled = false;
    }

    function loadImage(file) {
        return new Promise(r => {
            const img = new Image();
            img.onload = () => r(img);
            img.src = URL.createObjectURL(file);
        });
    }

    function downloadIndividual() {
        processedImages.forEach((img, i) => {
            setTimeout(() => {
                const a = document.createElement('a');
                a.href = img.data;
                a.download = img.name;
                a.click();
            }, i * 250);
        });
    }

    async function downloadZip() {
        statusText.innerText = "📦 正在压缩资源包...";
        const zip = new JSZip();
        processedImages.forEach(img => {
            zip.file(img.name, img.data.split(',')[1], {base64: true});
        });
        const content = await zip.generateAsync({type: "blob"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(content);
        a.download = `Amazon_Images_${Date.now()}.zip`;
        a.click();
        statusText.innerText = "✅ ZIP 导出成功";
    }
</script>

</body>
</html>
