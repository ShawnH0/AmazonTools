<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Amazon A+ 尺寸专家 - 卖家工具箱</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --apple-bg: #f5f5f7; --apple-blue: #0066cc; --apple-green: #34c759;
            --apple-card: #ffffff; --apple-text: #1d1d1f; --apple-secondary: #86868b;
        }

        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--apple-bg); margin: 0; color: var(--apple-text); }
        .nav-header { height: 52px; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); display: flex; justify-content: space-between; align-items: center; padding: 0 24px; border-bottom: 1px solid rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000; }
        .home-logo { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #fff; border: 1px solid #e5e5e7; text-decoration: none; }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .card { background: var(--apple-card); border-radius: 24px; padding: 32px; box-shadow: 0 8px 30px rgba(0,0,0,0.04); }

        .config-section { background: #f9f9fb; padding: 20px; border-radius: 16px; margin-bottom: 24px; }
        .config-row { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; flex-wrap: wrap; }
        select { padding: 10px 14px; border-radius: 10px; border: 1px solid #d2d2d7; outline: none; font-size: 14px; background: white; cursor: pointer; min-width: 320px; }
        
        .drop-zone { border: 2px dashed #d2d2d7; border-radius: 20px; padding: 40px 20px; background: #fafafa; cursor: pointer; transition: 0.3s; text-align: center; }
        .drop-zone:hover { border-color: var(--apple-blue); background: #fff; }

        /* 进度条 */
        .progress-container { margin: 24px 0; display: none; }
        .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--apple-secondary); margin-bottom: 8px; }
        .progress-bar-bg { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; background: var(--apple-blue); transition: width 0.1s linear; }

        /* 按钮组 */
        .action-bar { display: flex; justify-content: center; gap: 12px; margin: 24px 0; display: none; }
        .btn { padding: 10px 24px; border-radius: 20px; font-size: 14px; font-weight: 500; border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--apple-blue); color: white; }
        .btn-ghost { background: #f5f5f7; color: var(--apple-text); }
        .btn-success { background: var(--apple-green); color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 预览网格与单张下载 */
        .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-top: 24px; }
        .image-card { background: white; border-radius: 16px; padding: 12px; border: 1px solid #f2f2f2; position: relative; transition: 0.3s; }
        .image-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .image-card img { width: 100%; height: 140px; object-fit: contain; background: #f9f9f9; border-radius: 10px; margin-bottom: 10px; }
        .img-name { font-size: 11px; color: var(--apple-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 8px; }
        
        .download-single-btn { 
            width: 100%; padding: 6px 0; font-size: 11px; border-radius: 8px; 
            border: 1px solid var(--apple-blue); color: var(--apple-blue); 
            background: white; cursor: pointer; display: none;
        }
        .image-card.ready .download-single-btn { display: block; }
        .download-single-btn:hover { background: var(--apple-blue); color: white; }

        #workerCanvas { display: none; }
    </style>
</head>
<body>

<div class="nav-header">
    <a href="#" class="home-logo">🖼️</a>
    <div style="font-weight: 600; font-size: 14px;">Amazon A+ 内容尺寸专家</div>
    <div style="width: 32px;"></div>
</div>

<div class="container">
    <div class="card">
        <div class="config-section">
            <div class="config-row">
                <span style="font-weight:600; font-size:14px;">选择目标规格:</span>
                <select id="sizeSpec">
                    <optgroup label="基础 A+ 页面 (Standard)">
                        <option value="1600,1600">Listing 主图 (1600x1600)</option>
                        <option value="600,180">企业Logo (600x180)</option>
                        <option value="970,600">标准横幅图 (970x600)</option>
                        <option value="300,650">标准单图/侧边栏 (300x650)</option>
                        <option value="300,300">标准三图文/侧栏 (300x300)</option>
                        <option value="220,220">标准四图文 (220x220)</option>
                        <option value="600,450">标准大图-左右 (600x450)</option>
                    </optgroup>
                    <optgroup label="高级 A+ / 品牌故事 (Premium)">
                        <option value="1464,600">全屏宽幅/轮播图 (1464x600)</option>
                        <option value="1464,600">品牌故事背景图 (1464x600)</option>
                    </optgroup>
                </select>
            </div>
        </div>

        <div id="dropZone" class="drop-zone" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 40px; margin-bottom: 12px;">📤</div>
            <div style="font-size: 16px; font-weight: 600;">选择或拖拽图片素材</div>
            <input type="file" id="fileInput" hidden multiple accept="image/*">
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-label">
                <span id="progressText">处理中...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <div class="action-bar" id="actionBar">
            <button class="btn btn-primary" id="processBtn" onclick="processBatch()">⚡ 开始批量处理</button>
            <button class="btn btn-success" id="downloadAllBtn" disabled onclick="downloadIndividualAll()">🖼️ 逐个导出全部</button>
            <button class="btn btn-ghost" id="zipBtn" disabled onclick="downloadZip()">📦 打包 ZIP</button>
        </div>

        <div class="preview-grid" id="previewGrid"></div>
    </div>
</div>

<canvas id="workerCanvas"></canvas>

<script>
    let files = [];
    let processedResults = []; // 存储处理后的数据: {name, data}

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const previewGrid = document.getElementById('previewGrid');
    const actionBar = document.getElementById('actionBar');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');

    fileInput.onchange = (e) => handleFiles(e.target.files);
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.style.borderColor = 'var(--apple-blue)'; };
    dropZone.ondrop = (e) => { e.preventDefault(); handleFiles(e.dataTransfer.files); };

    function handleFiles(incoming) {
        files = Array.from(incoming).filter(f => f.type.startsWith('image/'));
        if (files.length > 0) {
            renderInitialPreviews();
            actionBar.style.display = 'flex';
            document.getElementById('zipBtn').disabled = true;
            document.getElementById('downloadAllBtn').disabled = true;
            progressContainer.style.display = 'none';
        }
    }

    function renderInitialPreviews() {
        previewGrid.innerHTML = '';
        files.forEach((f, index) => {
            const div = document.createElement('div');
            div.className = 'image-card';
            div.id = `card-${index}`;
            div.innerHTML = `
                <img src="${URL.createObjectURL(f)}">
                <div class="img-name">${f.name}</div>
                <button class="download-single-btn" onclick="downloadSingle(${index})">下载此尺寸</button>
            `;
            previewGrid.appendChild(div);
        });
    }

    async function processBatch() {
        const [targetW, targetH] = document.getElementById('sizeSpec').value.split(',').map(Number);
        const canvas = document.getElementById('workerCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = targetW;
        canvas.height = targetH;

        processedResults = [];
        progressContainer.style.display = 'block';
        document.getElementById('processBtn').disabled = true;

        for (let i = 0; i < files.length; i++) {
            const percent = Math.round(((i + 1) / files.length) * 100);
            progressBar.style.width = percent + '%';
            document.getElementById('progressPercent').innerText = percent + '%';
            progressText.innerText = `重绘中 (${i + 1}/${files.length})`;

            const img = await loadImage(files[i]);
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, targetW, targetH);

            const scale = Math.min(targetW / img.width, targetH / img.height);
            const w = img.width * scale;
            const h = img.height * scale;
            const x = (targetW - w) / 2;
            const y = (targetH - h) / 2;

            ctx.drawImage(img, x, y, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            
            const fileName = files[i].name.split('.')[0] + `_${targetW}x${targetH}.jpg`;
            processedResults.push({ name: fileName, data: dataUrl });

            // 更新预览卡片状态
            document.getElementById(`card-${i}`).classList.add('ready');
            URL.revokeObjectURL(img.src);
            await new Promise(r => setTimeout(r, 30));
        }

        progressText.innerText = "✅ 处理完成";
        document.getElementById('zipBtn').disabled = false;
        document.getElementById('downloadAllBtn').disabled = false;
        document.getElementById('processBtn').disabled = false;
    }

    function loadImage(file) {
        return new Promise(r => {
            const img = new Image();
            img.onload = () => r(img);
            img.src = URL.createObjectURL(file);
        });
    }

    // 单张下载逻辑
    function downloadSingle(index) {
        const item = processedResults[index];
        if (!item) return;
        const a = document.createElement('a');
        a.href = item.data;
        a.download = item.name;
        a.click();
    }

    // 逐个导出全部 (模拟连续点击)
    function downloadIndividualAll() {
        processedResults.forEach((item, i) => {
            setTimeout(() => {
                const a = document.createElement('a');
                a.href = item.data;
                a.download = item.name;
                a.click();
            }, i * 300); // 间隔300ms防止浏览器拦截多文件下载
        });
    }

    async function downloadZip() {
        const zip = new JSZip();
        processedResults.forEach(item => {
            zip.file(item.name, item.data.split(',')[1], {base64: true});
        });
        const content = await zip.generateAsync({type: "blob"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(content);
        a.download = `Amazon_Aplus_Batch_${Date.now()}.zip`;
        a.click();
    }
</script>

</body>
</html>
