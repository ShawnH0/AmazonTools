<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SKU 销量聚合 - 卖家工具箱</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-blue: #0066cc;
            --apple-purple: #af52de;
            --apple-green: #34c759;
            --apple-card: #ffffff;
            --apple-text: #1d1d1f;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--apple-bg);
            margin: 0; padding: 0; min-height: 100vh;
            color: var(--apple-text); -webkit-font-smoothing: antialiased;
        }

        /* 统一导航 */
        .nav-header {
            height: 52px; background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; border-bottom: 1px solid rgba(0,0,0,0.05);
            position: sticky; top: 0; z-index: 100;
        }

        .home-logo {
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; background: #fff; border: 1px solid #e5e5e7;
            color: #1d1d1f; text-decoration: none; transition: 0.2s;
        }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }

        /* 上传卡片 */
        .card { 
            background: var(--apple-card); border-radius: 28px; padding: 40px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.04); transition: 0.3s;
        }

        .upload-area {
            border: 2px dashed #d2d2d7; border-radius: 20px; padding: 60px 20px;
            background: #fafafa; cursor: pointer; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }
        .upload-area:hover { border-color: var(--apple-blue); background: #fff; }
        .upload-area.drag-over { border-color: var(--apple-blue); background: rgba(0, 102, 204, 0.05); transform: scale(1.02); }

        .upload-icon { font-size: 48px; margin-bottom: 20px; display: block; }

        /* 汇总看板 */
        .stats-grid { 
            display: none; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 30px 0;
        }
        .stat-box { 
            background: #fbfbfd; padding: 20px; border-radius: 16px; border: 1px solid #f2f2f2;
            text-align: center;
        }
        .stat-value { font-size: 24px; font-weight: 700; display: block; margin-top: 5px; }
        .stat-label { font-size: 12px; color: #86868b; text-transform: uppercase; letter-spacing: 0.5px; }

        /* 按钮 */
        .btn-group { display: flex; justify-content: center; gap: 16px; margin-top: 30px; }
        .btn {
            padding: 14px 32px; border-radius: 24px; font-size: 15px; font-weight: 600;
            border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .btn-primary { background: var(--apple-purple); color: white; }
        .btn-success { background: var(--apple-green); color: white; }
        .btn:disabled { background: #e5e5e7; color: #86868b; cursor: not-allowed; }
        .btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }

        /* 表格样式 */
        .table-container { margin-top: 40px; border-radius: 16px; overflow: hidden; border: 1px solid #f2f2f2; display: none; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: #fafafa; padding: 16px; text-align: left; font-size: 12px; font-weight: 600; color: #86868b; border-bottom: 1px solid #f2f2f2; }
        td { padding: 16px; border-bottom: 1px solid #f2f2f2; font-size: 14px; }
        
        .rank-badge { 
            width: 24px; height: 24px; background: #f2f2f2; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
        }
        .rank-1 { background: #FFD700; color: #000; }
        .rank-2 { background: #C0C0C0; color: #000; }
        .rank-3 { background: #CD7F32; color: #fff; }

        .sku-pill { 
            font-family: 'SF Mono', 'Consolas', monospace; font-size: 13px;
            background: rgba(0, 102, 204, 0.05); color: var(--apple-blue);
            padding: 4px 10px; border-radius: 6px; font-weight: 500;
        }
    </style>
</head>
<body>

<div class="nav-header">
    <a href="index.html" class="home-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </a>
    <div style="font-weight: 600;">SKU 父体销量聚合大师</div>
    <div style="width: 36px;"></div>
</div>

<div class="container">
    <div class="card">
        <div id="dropZone" class="upload-area">
            <span class="upload-icon">📊</span>
            <div style="font-size: 20px; font-weight: 600;">投放或点击上传订单报告</div>
            <div style="color: #86868b; margin-top: 8px; font-size: 14px;">支持 .xlsx, .xls, .csv 批量处理</div>
            <input type="file" id="fileInput" hidden multiple accept=".xlsx, .xls, .csv">
        </div>

        <div id="statsGrid" class="stats-grid">
            <div class="stat-box">
                <span class="stat-label">原始记录数</span>
                <span class="stat-value" id="countRaw" style="color: var(--apple-text)">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">聚合父体数</span>
                <span class="stat-value" id="countParent" style="color: var(--apple-purple)">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">累计销售件数</span>
                <span class="stat-value" id="countTotalQty" style="color: var(--apple-green)">0</span>
            </div>
        </div>

        <div id="status" style="text-align:center; color: #86868b; font-size: 13px; margin-top: 15px;">等待文件导入...</div>

        <div class="btn-group">
            <button class="btn btn-primary" id="runBtn" onclick="doAggregating()" disabled>⚙️ 开始智能聚合</button>
            <button class="btn btn-success" id="exportBtn" onclick="exportExcel()" disabled>📥 导出 Excel</button>
        </div>

        <div class="table-container" id="tableContainer">
            <table>
                <thead>
                    <tr>
                        <th width="60">排名</th>
                        <th>父体 SKU 标识</th>
                        <th>记录行数</th>
                        <th>总销量</th>
                    </tr>
                </thead>
                <tbody id="resBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let rawRows = [];
    let processedData = [];
    const dropZone = document.getElementById('dropZone');
    const statusText = document.getElementById('status');
    const fileInput = document.getElementById('fileInput');

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => handleFiles(e.target.files);

    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); };
    dropZone.ondragleave = () => dropZone.classList.remove('drag-over');
    dropZone.ondrop = async (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        rawRows = [];
        const items = e.dataTransfer.items;
        statusText.innerText = "🔍 正在扫描文件...";
        for (let item of items) {
            const entry = item.webkitGetAsEntry();
            if (entry) await scanEntry(entry);
        }
        finishLoading();
    };

    async function scanEntry(entry) {
        if (entry.isFile) {
            const file = await new Promise(r => entry.file(r));
            if (file.name.match(/\.(xlsx|xls|csv)$/i)) await readExcel(file);
        } else if (entry.isDirectory) {
            const reader = entry.createReader();
            const entries = await new Promise(r => reader.readEntries(r));
            for (let e of entries) await scanEntry(e);
        }
    }

    function readExcel(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const workbook = XLSX.read(e.target.result, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const data = XLSX.utils.sheet_to_json(sheet);
                rawRows = rawRows.concat(data);
                resolve();
            };
            reader.readAsArrayBuffer(file);
        });
    }

    function handleFiles(files) {
        rawRows = [];
        const promises = Array.from(files).map(f => readExcel(f));
        Promise.all(promises).then(() => finishLoading());
    }

    function finishLoading() {
        statusText.innerText = `已准备好 ${rawRows.length} 条数据记录`;
        document.getElementById('runBtn').disabled = rawRows.length === 0;
    }

    function doAggregating() {
        const aggregator = new Map();
        let grandTotalQty = 0;

        rawRows.forEach(row => {
            const sku = (row['sku'] || row['SKU'] || "").toString().trim();
            // 兼容亚马逊多种报表的数量字段名
            const qty = parseInt(row['quantity-purchased'] || row['quantity'] || row['Quantity'] || 0);
            if (!sku) return;

            // 你的正则逻辑：非常精准的前两段识别
            let parent = sku;
            const skuPattern = /^([^-]+)-([A-Z0-9]*?\d+)/; 
            const match = sku.match(skuPattern);
            if (match) {
                parent = `${match[1]}-${match[2]}`;
            }

            if (!aggregator.has(parent)) {
                aggregator.set(parent, { parentSku: parent, rowCount: 0, totalQty: 0 });
            }
            const item = aggregator.get(parent);
            item.rowCount++;
            item.totalQty += qty;
            grandTotalQty += qty;
        });

        processedData = Array.from(aggregator.values()).sort((a, b) => b.totalQty - a.totalQty);
        
        const tbody = document.getElementById('resBody');
        tbody.innerHTML = processedData.map((item, i) => `
            <tr>
                <td><div class="rank-badge ${i < 3 ? 'rank-' + (i + 1) : ''}">${i + 1}</div></td>
                <td><span class="sku-pill">${item.parentSku}</span></td>
                <td style="color:#86868b">${item.rowCount}</td>
                <td style="font-weight:700">${item.totalQty}</td>
            </tr>
        `).join('');

        document.getElementById('tableContainer').style.display = 'block';
        document.getElementById('statsGrid').style.display = 'grid';
        document.getElementById('countRaw').innerText = rawRows.length.toLocaleString();
        document.getElementById('countParent').innerText = processedData.length.toLocaleString();
        document.getElementById('countTotalQty').innerText = grandTotalQty.toLocaleString();
        document.getElementById('exportBtn').disabled = false;
        statusText.innerText = "✨ 聚合处理已完成";
    }

    function exportExcel() {
        const exportData = processedData.map((item, i) => ({
            "聚合排名": i + 1,
            "父体标识": item.parentSku,
            "包含子体订单数": item.rowCount,
            "总销售件数": item.totalQty
        }));
        const ws = XLSX.utils.json_to_sheet(exportData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Aggregation");
        XLSX.writeFile(wb, `SKU_Aggregation_${new Date().toISOString().slice(0,10)}.xlsx`);
    }
</script>
</body>
</html>
