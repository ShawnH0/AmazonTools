<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>词频统计 - 卖家工具箱</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-blue: #0066cc;
            --apple-card: #ffffff;
            --apple-text: #1d1d1f;
            --apple-secondary: #86868b;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--apple-bg);
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* 导航 */
        .nav-header {
            height: 52px; background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; border-bottom: 1px solid rgba(0,0,0,0.05); z-index: 100;
        }
        .home-logo {
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; background: #fff; border: 1px solid #e5e5e7;
            color: #1d1d1f; text-decoration: none;
        }

        .container { flex: 1; display: grid; grid-template-columns: 1fr 400px; gap: 24px; padding: 24px; max-width: 1600px; margin: 0 auto; width: 100%; box-sizing: border-box; overflow: hidden; }

        .card { background: var(--apple-card); border-radius: 24px; display: flex; flex-direction: column; box-shadow: 0 8px 30px rgba(0,0,0,0.04); overflow: hidden; }

        /* 左侧输入区 */
        .input-area { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; }
        
        /* iOS 风格分段选择器 */
        .segmented-control {
            display: flex; background: #eee; padding: 2px; border-radius: 10px; width: fit-content;
        }
        .segment {
            padding: 6px 16px; font-size: 13px; font-weight: 500; border-radius: 8px;
            cursor: pointer; transition: 0.2s; border: none; background: none; color: var(--apple-secondary);
        }
        .segment.active { background: white; color: var(--apple-text); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }

        textarea {
            flex: 1; border: 1px solid #d2d2d7; border-radius: 16px; padding: 20px;
            background: #fafafa; font-size: 15px; line-height: 1.6; resize: none;
            outline: none; transition: 0.3s;
        }
        textarea:focus { background: white; border-color: var(--apple-blue); box-shadow: 0 0 0 4px rgba(0,102,204,0.1); }

        /* 右侧结果区 */
        .result-area { display: flex; flex-direction: column; height: 100%; }
        .result-header { padding: 20px 24px; border-bottom: 1px solid #f2f2f2; display: flex; justify-content: space-between; align-items: center; }
        
        .table-wrap { flex: 1; overflow-y: auto; padding: 0 12px; }
        table { width: 100%; border-collapse: collapse; }
        th { font-size: 11px; text-transform: uppercase; color: var(--apple-secondary); padding: 12px; text-align: left; }
        td { padding: 12px; font-size: 14px; border-bottom: 1px dotted #eee; }

        .count-badge {
            background: rgba(0, 102, 204, 0.1); color: var(--apple-blue);
            padding: 2px 10px; border-radius: 10px; font-weight: 600; font-size: 12px;
        }

        .btn {
            padding: 8px 16px; border-radius: 18px; border: none; font-size: 13px;
            font-weight: 500; cursor: pointer; transition: 0.2s;
        }
        .btn-primary { background: var(--apple-blue); color: white; }
        .btn-ghost { background: #f5f5f7; color: var(--apple-text); }
        .btn:hover { filter: brightness(1.1); }

        .tips { padding: 16px 24px; font-size: 12px; color: var(--apple-secondary); background: #fafafa; border-top: 1px solid #f2f2f2; }
    </style>
</head>
<body>

<div class="nav-header">
    <a href="index.html" class="home-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </a>
    <div style="font-weight: 600;">词频 N-Gram 分析专家</div>
    <div style="width: 36px;"></div>
</div>

<div class="container">
    <div class="card input-area">
        <div class="toolbar">
            <div class="segmented-control" id="ngramControl">
                <button class="segment active" onclick="setNgram(1, this)">1-Gram</button>
                <button class="segment" onclick="setNgram(2, this)">2-Gram</button>
                <button class="segment" onclick="setNgram(3, this)">3-Gram</button>
            </div>
            <div style="display: flex; gap: 15px; align-items: center; font-size: 13px; color: var(--apple-secondary);">
                <label><input type="checkbox" id="ignoreCase" checked onchange="analyze()"> 忽略大小写</label>
                <label><input type="checkbox" id="excludeCommon" checked onchange="analyze()"> 排除虚词</label>
                <button class="btn btn-ghost" onclick="clearAll()">🗑️ 清空</button>
            </div>
        </div>
        <textarea id="inputText" placeholder="请在此粘贴竞品的标题、描述或评论内容进行 N-Gram 词频挖掘..." oninput="analyze()"></textarea>
    </div>

    <div class="card result-area">
        <div class="result-header">
            <div style="font-weight: 600; font-size: 15px;">挖掘结果</div>
            <button class="btn btn-primary" onclick="exportData()">📥 导出</button>
        </div>
        <div class="table-wrap">
            <table id="resultTable">
                <thead>
                    <tr>
                        <th>关键词组</th>
                        <th style="width: 60px; text-align: center;">词频</th>
                    </tr>
                </thead>
                <tbody id="resultBody">
                    <tr><td colspan="2" style="text-align:center; padding-top:100px; color:#c7c7cc;">等待数据输入...</td></tr>
                </tbody>
            </table>
        </div>
        <div class="tips">
            💡 运营技巧：将 2-Gram 或 3-Gram 中的高频长尾词整合到 Listing 埋词中，权重远高于单字堆砌。
        </div>
    </div>
</div>

<script>
    let currentN = 1;
    const stopWords = new Set(['the','and','of','a','to','in','is','for','with','on','as','it','at','by','this','that','from','are','be','or','an','your','you','can','will','its','was','if','my','but','not','with','these','those']);

    function setNgram(n, btn) {
        currentN = n;
        document.querySelectorAll('.segment').forEach(s => s.classList.remove('active'));
        btn.classList.add('active');
        analyze();
    }

    function analyze() {
        const text = document.getElementById('inputText').value;
        const tbody = document.getElementById('resultBody');

        if (!text.trim()) {
            tbody.innerHTML = '<tr><td colspan="2" style="text-align:center; padding-top:100px; color:#c7c7cc;">等待数据输入...</td></tr>';
            return;
        }

        const ignoreCase = document.getElementById('ignoreCase').checked;
        const excludeCommon = document.getElementById('excludeCommon').checked;

        // 1. 数据清洗
        let cleanText = text.replace(/[.,/#!$%^&*;:{}=\-_`~()?"']/g, " ");
        let words = cleanText.split(/\s+/).filter(w => w.length > 1);
        if (ignoreCase) words = words.map(w => w.toLowerCase());

        // 2. N-Gram 逻辑
        const freqMap = {};
        for (let i = 0; i <= words.length - currentN; i++) {
            const gramArray = words.slice(i, i + currentN);
            
            // 如果开启排除虚词且是 1-Gram，过滤掉虚词
            if (excludeCommon && currentN === 1 && stopWords.has(gramArray[0])) continue;
            
            const gram = gramArray.join(" ");
            freqMap[gram] = (freqMap[gram] || 0) + 1;
        }

        // 3. 排序与渲染
        const sorted = Object.entries(freqMap)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 100); // 仅展示前 100 名，防止过载

        if (sorted.length === 0) {
            tbody.innerHTML = '<tr><td colspan="2" style="text-align:center; padding-top:100px; color:#c7c7cc;">未发现有效词组</td></tr>';
            return;
        }

        tbody.innerHTML = sorted.map(([word, count]) => `
            <tr>
                <td style="font-weight: 500;">${word}</td>
                <td style="text-align: center;"><span class="count-badge">${count}</span></td>
            </tr>
        `).join('');
    }

    function clearAll() {
        document.getElementById('inputText').value = '';
        analyze();
    }

    function exportData() {
        const table = document.getElementById('resultTable');
        const wb = XLSX.utils.table_to_book(table, {sheet: "N-Gram词频统计"});
        XLSX.writeFile(wb, `词频统计_N${currentN}_${new Date().toISOString().slice(0,10)}.xlsx`);
    }
</script>

</body>
</html>
