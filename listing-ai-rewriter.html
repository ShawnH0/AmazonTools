<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Listing AI Pro | Shawn's OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-blue: #0071e3;
            --apple-gray: #86868b;
            --apple-card-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(255, 255, 255, 0.3);
            --radius-main: 20px;
        }

        body {
            font-family: 'Inter', -apple-system, "PingFang SC", sans-serif;
            background-color: var(--apple-bg);
            color: #1d1d1f; margin: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- 导航栏：Apple 风格 --- */
        .nav {
            height: 52px; background: rgba(251, 251, 253, 0.8);
            backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 32px; border-bottom: 0.5px solid rgba(0,0,0,0.1); z-index: 1000;
        }
        .nav-brand {
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            text-decoration: none; color: #1d1d1f; font-weight: 600; transition: 0.2s;
        }
        .nav-brand:hover { opacity: 0.7; }
        .nav-brand svg { width: 22px; height: 22px; }

        .api-badge {
            font-size: 12px; padding: 6px 16px; border-radius: 20px;
            cursor: pointer; border: none; font-weight: 500; transition: 0.3s;
        }
        .status-off { background: rgba(255, 59, 48, 0.1); color: #ff3b30; }
        .status-on { background: rgba(52, 199, 89, 0.1); color: #34c759; }

        /* --- 主布局 --- */
        .main-content {
            flex: 1; display: grid; grid-template-columns: 1.2fr 0.8fr;
            gap: 24px; padding: 24px; max-width: 1600px; margin: 0 auto;
            width: 100%; box-sizing: border-box; overflow: hidden;
        }

        /* --- 左侧工作流 --- */
        .workspace { display: flex; flex-direction: column; gap: 20px; overflow: hidden; }

        /* Prompt 区域：强力美化 */
        .prompt-container {
            background: #fff; border-radius: var(--radius-main); padding: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
        }
        .prompt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .prompt-card { display: flex; flex-direction: column; gap: 8px; }
        .prompt-card label { font-size: 11px; font-weight: 700; color: var(--apple-gray); letter-spacing: 0.05em; }
        .apple-input {
            width: 100%; height: 70px; border-radius: 12px; border: 1px solid #d2d2d7;
            background: #fbfbfd; padding: 12px; font-size: 13px; font-family: inherit;
            color: #1d1d1f; line-height: 1.5; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            resize: none; box-sizing: border-box; outline: none;
        }
        .apple-input:focus {
            border-color: var(--apple-blue); background: #fff;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
        }
        .apple-input::placeholder { color: #c1c1c6; font-size: 12px; }

        /* 按钮组 */
        .toolbar { display: flex; gap: 12px; margin-top: 16px; }
        .btn {
            padding: 8px 20px; border-radius: 18px; font-size: 13px; font-weight: 500;
            border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .btn-primary { background: var(--apple-blue); color: #fff; }
        .btn-secondary { background: #e8e8ed; color: #1d1d1f; }
        .btn-export { background: #34c759; color: #fff; margin-left: auto; }
        .btn:active { transform: scale(0.97); }

        /* 表格区域 */
        .table-section {
            flex: 1; background: #fff; border-radius: var(--radius-main);
            overflow: hidden; display: flex; flex-direction: column;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .table-scroll { flex: 1; overflow: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
        th { background: #fafafa; padding: 14px; text-align: left; position: sticky; top: 0; z-index: 5; border-bottom: 1px solid #eee; color: var(--apple-gray); font-weight: 500; }
        td { padding: 14px; border-bottom: 1px solid #f5f5f7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        tr:hover { background: #fbfbff; cursor: pointer; }
        tr.selected { background: rgba(0, 113, 227, 0.05); }

        /* --- 右侧：预览面板 --- */
        .preview-panel {
            background: #fff; border-radius: var(--radius-main); padding: 28px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.04); display: flex; flex-direction: column;
        }
        .preview-title { font-size: 19px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
        .preview-body { flex: 1; overflow-y: auto; padding-right: 8px; }
        .listing-item { margin-bottom: 24px; }
        .listing-label { font-size: 11px; font-weight: 700; color: var(--apple-gray); margin-bottom: 6px; text-transform: uppercase; }
        .listing-val { font-size: 14px; line-height: 1.6; color: #333; white-space: pre-wrap; background: #f9f9fb; padding: 12px; border-radius: 10px; border: 1px solid #f0f0f2; }

        /* --- 弹窗：完善逻辑 --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(15px);
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal {
            background: #fff; width: 380px; border-radius: 24px; padding: 32px;
            position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .close-modal {
            position: absolute; right: 20px; top: 20px; cursor: pointer;
            color: var(--apple-gray); border: none; background: none; font-size: 20px;
        }
        .modal-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #d2d2d7; margin-top: 10px; box-sizing: border-box; margin-bottom: 20px; }

        .status-tag { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
        .tag-waiting { background: #f5f5f7; color: #86868b; }
        .tag-done { background: #e3f9e5; color: #34c759; }
    </style>
</head>
<body>

<nav class="nav">
    <a href="index.html" class="nav-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        ShawnTools
    </a>
    <div style="font-size: 14px; font-weight: 600; position: absolute; left: 50%; transform: translateX(-50%);">Listing AI Pro</div>
    <button id="configBtn" class="api-badge status-off" onclick="toggleModal(true)">API 未配置</button>
</nav>

<main class="main-content">
    <div class="workspace">
        <section class="prompt-container">
            <div class="prompt-grid">
                <div class="prompt-card"><label>Title Prompt</label><textarea id="p_title" class="apple-input" placeholder="选填：优化为 190 字符内的专业标题..."></textarea></div>
                <div class="prompt-card"><label>Search Terms Prompt</label><textarea id="p_st" class="apple-input" placeholder="选填：220 字符以内的地道关键词..."></textarea></div>
                <div class="prompt-card"><label>Bullet Points Prompt</label><textarea id="p_bp" class="apple-input" placeholder="选填：[大写标题] + 描述格式..."></textarea></div>
                <div class="prompt-card"><label>Description Prompt</label><textarea id="p_desc" class="apple-input" placeholder="选填：HTML 格式，1500 字符内..."></textarea></div>
            </div>
            <div class="toolbar">
                <button class="btn btn-secondary" onclick="downloadTemplate()">📥 模板下载</button>
                <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">📤 上传 Excel</button>
                <button id="runBtn" class="btn btn-primary" onclick="handleRun()">🚀 开始 AI 优化</button>
                <button id="exportBtn" class="btn btn-export" style="display:none" onclick="exportExcel()">💾 导出结果</button>
                <input type="file" id="fileInput" hidden accept=".xlsx" onchange="handleFile(this.files[0])">
            </div>
        </section>

        <section class="table-section">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 40%;">原始标题</th>
                            <th style="width: 40%;">优化后标题</th>
                            <th style="width: 20%;">状态</th>
                        </tr>
                    </thead>
                    <tbody id="tBody">
                        <tr><td colspan="3" style="text-align:center; padding:100px; color:#c1c1c6;">请上传 Excel 数据开始工作</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <aside class="preview-panel">
        <div class="preview-title">深度预览</div>
        <div id="previewBody" class="preview-body">
            <div style="text-align:center; color:#c1c1c6; margin-top:100px;">点击列表行查看完整 Listing 详情</div>
        </div>
    </aside>
</main>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <button class="close-modal" onclick="toggleModal(false)">×</button>
        <h3 style="margin-top:0">API 授权</h3>
        <p style="font-size: 12px; color: #86868b;">配置将仅在当前浏览器会话中有效。</p>
        <label style="font-size: 11px; font-weight: 700; color: #86868b;">PROVIDER</label>
        <select id="apiVendor" class="modal-input"><option value="DeepSeek">DeepSeek</option><option value="OpenAI">OpenAI</option></select>
        <label style="font-size: 11px; font-weight: 700; color: #86868b;">API KEY</label>
        <input type="password" id="apiKeyInput" class="modal-input" placeholder="sk-...">
        <button class="btn btn-primary" style="width: 100%; justify-content: center; height: 44px; border-radius: 12px;" onclick="saveConfig()">保存配置</button>
    </div>
</div>

<script>
    const DEFAULT_PROMPTS = {
        title: "要求: 150-200 字符。公式: 核心搜索词 + 产品特色 + 长尾词 + 使用场景/目标人群。符合亚马逊标题的规则，不能出现违规词。限制: 词频控制，同一个词出现不能超过 2 次（单复数计为不同词），字符控制在190以内，不能出现品牌词，如果要有品牌需要加Compatible with或者for。用英语回答，且只需要回答标题，不需要其他任何一个多余的字。",
        st: "要求: 亚马逊上顾客最常用的搜索词和长尾词，用逗号隔开。字数220以内。用英语回答，且只需要回答关键词的内容，不需要其他任何一个多余的字。",
        bp: "要求: 包含 [大写标题] + 描述，需要精准符合顾客购买需求。字数: 约 250 字符。用英语回答，且只需要回答Bullet Points的内容，不需要其他任何一个多余的字。",
        desc: "格式要求: 必须使用 HTML 格式。标签限制: 仅限使用 <p>, <li>, <ul>, <strong>。严禁出现 <h> 标签、任何 style 样式或其他属性。内容: 包含产品使用方法、特色、规格。字数限制: 严格控制总字符数（含标签）在 1500 字符以内。用英语回答，且只需要回答详情描述的内容，不需要其他任何一个多余的字。"
    };

    let tableData = [];
    let apiKey = "";

    function toggleModal(s) { document.getElementById('modalOverlay').style.display = s ? 'flex' : 'none'; }

    function saveConfig() {
        apiKey = document.getElementById('apiKeyInput').value;
        if(!apiKey) return alert("请输入 API Key");
        const btn = document.getElementById('configBtn');
        btn.className = 'api-badge status-on';
        btn.innerText = '已授权';
        toggleModal(false);
    }

    function downloadTemplate() {
        const headers = [["title", "search terms", "bullet point 1", "bullet point 2", "bullet point 3", "bullet point 4", "bullet point 5", "description"]];
        const ws = XLSX.utils.aoa_to_sheet(headers);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Listing");
        XLSX.writeFile(wb, "Amazon_Template.xlsx");
    }

    function handleFile(file) {
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const wb = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
            tableData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            renderTable();
        };
        reader.readAsArrayBuffer(file);
    }

    function renderTable() {
        const tbody = document.getElementById('tBody');
        tbody.innerHTML = tableData.map((row, i) => `
            <tr onclick="showFullPreview(${i})" id="row-${i}">
                <td>${row.title || '-'}</td>
                <td id="opt-title-${i}">${row.opt_title || '等待生成...'}</td>
                <td id="status-${i}"><span class="status-tag tag-waiting">待处理</span></td>
            </tr>
        `).join('');
    }

    async function handleRun() {
        if(!apiKey) return toggleModal(true);
        const btn = document.getElementById('runBtn');
        btn.disabled = true; btn.innerText = "处理中...";

        const vendor = document.getElementById('apiVendor').value;
        const config = {
            url: vendor === "DeepSeek" ? "https://api.deepseek.com/chat/completions" : "https://api.openai.com/v1/chat/completions",
            model: vendor === "DeepSeek" ? "deepseek-chat" : "gpt-4o"
        };

        const prompts = {
            title: document.getElementById('p_title').value || DEFAULT_PROMPTS.title,
            st: document.getElementById('p_st').value || DEFAULT_PROMPTS.st,
            bp: document.getElementById('p_bp').value || DEFAULT_PROMPTS.bp,
            desc: document.getElementById('p_desc').value || DEFAULT_PROMPTS.desc
        };

        for(let i=0; i<tableData.length; i++) {
            document.getElementById(`status-${i}`).innerHTML = `<span class="status-tag" style="background:#e0f2ff; color:#0071e3;">优化中...</span>`;
            
            const cols = ["title", "search terms", "bullet point 1", "bullet point 2", "bullet point 3", "bullet point 4", "bullet point 5", "description"];
            const tasks = cols.map(col => {
                if(!tableData[i][col]) return Promise.resolve();
                let p = prompts.bp;
                if(col === 'title') p = prompts.title;
                else if(col === 'search terms') p = prompts.st;
                else if(col === 'description') p = prompts.desc;
                
                return callAI(tableData[i][col], p, config).then(res => {
                    tableData[i]['opt_'+col] = res;
                    if(col === 'title') document.getElementById(`opt-title-${i}`).innerText = res;
                });
            });

            await Promise.all(tasks);
            document.getElementById(`status-${i}`).innerHTML = `<span class="status-tag tag-done">已完成</span>`;
        }
        btn.disabled = false; btn.innerText = "🚀 开始 AI 优化";
        document.getElementById('exportBtn').style.display = 'block';
    }

    async function callAI(content, prompt, config) {
        const res = await fetch(config.url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
            body: JSON.stringify({ model: config.model, messages: [{role: "user", content: `${prompt}\n\n内容：${content}`}] })
        });
        const data = await res.json();
        return data.choices[0].message.content.trim();
    }

    function showFullPreview(i) {
        document.querySelectorAll('tr').forEach(r => r.classList.remove('selected'));
        document.getElementById(`row-${i}`).classList.add('selected');

        const r = tableData[i];
        const box = document.getElementById('previewBody');
        box.innerHTML = `
            <div class="listing-item"><div class="listing-label">Optimized Title</div><div class="listing-val">${r.opt_title || '尚未生成'}</div></div>
            <div class="listing-item"><div class="listing-label">Search Terms</div><div class="listing-val">${r['opt_search terms'] || '尚未生成'}</div></div>
            <div class="listing-item"><div class="listing-label">Bullet Points 1-5</div><div class="listing-val">${r['opt_bullet point 1']||''}\n${r['opt_bullet point 2']||''}\n${r['opt_bullet point 3']||''}\n${r['opt_bullet point 4']||''}\n${r['opt_bullet point 5']||''}</div></div>
            <div class="listing-item"><div class="listing-label">Description (HTML)</div><div class="listing-val" style="font-family:monospace; font-size:12px;">${r.opt_description || '尚未生成'}</div></div>
        `;
    }

    function exportExcel() {
        const ws = XLSX.utils.json_to_sheet(tableData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Optimized");
        XLSX.writeFile(wb, "Shawn_Listing_Results.xlsx");
    }
</script>

</body>
</html>
