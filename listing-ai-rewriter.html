<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Listing AI Pro | Shawn's OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-blue: #0071e3;
            --apple-gray: #86868b;
            --radius-main: 22px;
        }

        body, input, textarea, select, button {
            font-family: 'Inter', -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--apple-bg);
            color: #1d1d1f; margin: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        .nav {
            height: 52px; background: rgba(251, 251, 253, 0.8);
            backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 32px; border-bottom: 0.5px solid rgba(0,0,0,0.1); z-index: 1000; flex-shrink: 0;
        }
        .nav-brand { display: flex; align-items: center; gap: 10px; cursor: pointer; text-decoration: none; color: #1d1d1f; font-weight: 600; }

        .api-badge { font-size: 12px; padding: 6px 16px; border-radius: 20px; cursor: pointer; border: none; font-weight: 500; }
        .status-off { background: rgba(255, 59, 48, 0.1); color: #ff3b30; }
        .status-on { background: rgba(52, 199, 89, 0.1); color: #34c759; }

        .main-content {
            flex: 1; display: grid; grid-template-columns: 1.1fr 0.9fr;
            gap: 24px; padding: 20px 24px; max-width: 1600px; margin: 0 auto;
            width: 100%; box-sizing: border-box; overflow: hidden;
        }

        .workspace { display: flex; flex-direction: column; gap: 20px; height: 100%; min-height: 0; }

        .prompt-container { background: #fff; border-radius: var(--radius-main); padding: 20px; flex-shrink: 0; box-shadow: 0 8px 30px rgba(0,0,0,0.04); }
        .prompt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 10px; color: var(--apple-gray); font-weight: 700; }
        .apple-input {
            width: 100%; height: 60px; border-radius: 12px; border: 1px solid #d2d2d7;
            background: #fbfbfd; padding: 10px; font-size: 12px; line-height: 1.4;
            resize: none; box-sizing: border-box; outline: none; transition: 0.3s;
        }
        .apple-input:focus { border-color: var(--apple-blue); background: #fff; }

        .toolbar { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; align-items: center; }
        .btn { padding: 8px 16px; border-radius: 18px; font-size: 12px; font-weight: 500; border: none; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-primary { background: var(--apple-blue); color: #fff; }
        .btn-secondary { background: #e8e8ed; color: #1d1d1f; }
        .btn-danger { background: rgba(255, 59, 48, 0.1); color: #ff3b30; }
        .btn-export { background: #34c759; color: #fff; margin-left: auto; }

        .concurrency-control { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--apple-gray); font-weight: 600; background: #eee; padding: 4px 12px; border-radius: 14px; }
        .concurrency-input { width: 40px; border: none; background: transparent; font-weight: 700; color: var(--apple-blue); outline: none; text-align: center; }

        #totalTimer { font-size: 11px; color: var(--apple-gray); font-weight: 600; padding: 0 10px; }

        .table-section {
            flex: 1; background: #fff; border-radius: var(--radius-main);
            overflow: hidden; display: flex; flex-direction: column;
            border: 1px solid rgba(0,0,0,0.05); min-height: 0;
        }
        .table-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
        th { background: #fafafa; padding: 12px; text-align: left; position: sticky; top: 0; z-index: 5; border-bottom: 1px solid #eee; color: var(--apple-gray); }
        td { padding: 12px; border-bottom: 1px solid #f5f5f7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
        tr:hover { background: #fbfbff; cursor: pointer; }
        tr.selected { background: rgba(0, 113, 227, 0.05); }

        .time-tag { 
            font-size: 9px; color: #0071e3; background: rgba(0, 113, 227, 0.1); 
            padding: 2px 6px; border-radius: 4px; margin-top: 4px; display: inline-block;
        }

        .preview-panel {
            background: #fff; border-radius: var(--radius-main); padding: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.04); display: flex; flex-direction: column; 
            height: 100%; min-height: 0; box-sizing: border-box;
        }
        .preview-body { flex: 1; overflow-y: auto; padding-right: 10px; margin-top: 15px; }
        .listing-item { margin-bottom: 24px; }
        .listing-label { font-size: 11px; font-weight: 700; color: var(--apple-gray); margin-bottom: 8px; text-transform: uppercase; border-left: 3px solid var(--apple-blue); padding-left: 8px; }
        .listing-val { font-size: 13px; line-height: 1.6; color: #333; white-space: pre-wrap; background: #f9f9fb; padding: 14px; border-radius: 12px; border: 1px solid #f0f0f2; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .modal { background: #fff; width: 420px; border-radius: 24px; padding: 32px; position: relative; }
        .modal-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #d2d2d7; margin-top: 8px; box-sizing: border-box; margin-bottom: 15px; font-size: 13px; outline: none; }
        
        .status-tag { padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 600; }
        .tag-waiting { background: #f5f5f7; color: #86868b; }
        .tag-done { background: #e3f9e5; color: #34c759; }
    </style>
</head>
<body>

<nav class="nav">
    <a href="index.html" class="nav-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Shawn's Listing Pro
    </a>
    <button id="configBtn" class="api-badge status-off" onclick="toggleModal(true)">API 配置</button>
</nav>

<main class="main-content">
    <div class="workspace">
        <section class="prompt-container">
            <div class="prompt-grid">
                <div class="input-group"><label>TITLE (APPEND PROMPT)</label><textarea id="p_title" class="apple-input" placeholder="输入额外要求..."></textarea></div>
                <div class="input-group"><label>SEARCH TERMS (APPEND PROMPT)</label><textarea id="p_st" class="apple-input" placeholder="输入额外要求..."></textarea></div>
                <div class="input-group"><label>BULLET POINTS (APPEND PROMPT)</label><textarea id="p_bp" class="apple-input" placeholder="输入额外要求..."></textarea></div>
                <div class="input-group"><label>DESCRIPTION (APPEND PROMPT)</label><textarea id="p_desc" class="apple-input" placeholder="输入额外要求..."></textarea></div>
            </div>
            <div class="toolbar">
                <button class="btn btn-secondary" onclick="downloadTemplate()">📥 模板下载</button>
                <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">📤 上传 Excel</button>
                <div class="concurrency-control">
                    并发数 <input type="number" id="concurrencyInput" class="concurrency-input" value="100" min="1" max="500">
                </div>
                <button id="runBtn" class="btn btn-primary" onclick="handleRun()">🚀 开始优化</button>
                <span id="totalTimer"></span>
                <button class="btn btn-danger" onclick="clearData()">🧹 清除数据</button>
                <button id="exportBtn" class="btn btn-export" style="display:none" onclick="exportExcel()">💾 导出结果</button>
                <input type="file" id="fileInput" hidden accept=".xlsx" onchange="handleFile(this.files[0])">
            </div>
        </section>

        <section class="table-section">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 60px; text-align: center;">序号</th>
                            <th style="width: 35%;">原始标题</th>
                            <th style="width: 45%;">实时优化预览</th>
                            <th style="width: 15%;">处理状态</th>
                        </tr>
                    </thead>
                    <tbody id="tBody">
                        <tr><td colspan="4" style="text-align:center; padding:100px; color:#c1c1c6;">等待数据导入...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <aside class="preview-panel">
        <div style="font-size:18px; font-weight:600; padding-bottom:15px; border-bottom:1px solid #eee;">深度预览面板</div>
        <div id="previewBody" class="preview-body">
            <div style="text-align:center; color:#c1c1c6; margin-top:150px;">点击列表行<br>在此查看完整Listing详情</div>
        </div>
    </aside>
</main>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <button onclick="toggleModal(false)" style="position:absolute; right:20px; top:20px; border:none; background:none; cursor:pointer; font-size:20px; color:#86868b;">×</button>
        <h3 style="margin-top:0">AI 模型授权</h3>
        <label style="font-size:11px; font-weight:700; color:#86868b;">厂商平台</label>
        <select id="apiVendor" class="modal-input" onchange="updateModels()">
            <option value="DeepSeek">DeepSeek</option>
            <option value="OpenAI">OpenAI / OpenRouter</option>
            <option value="Gemini">Google Gemini</option>
            <option value="Doubao">字节豆包 (Ark)</option>
            <option value="Grok">xAI Grok</option>
        </select>
        <label style="font-size:11px; font-weight:700; color:#86868b;">选择具体模型</label>
        <select id="apiModel" class="modal-input"></select>
        <label style="font-size:11px; font-weight:700; color:#86868b;">API KEY</label>
        <input type="password" id="apiKeyInput" class="modal-input" placeholder="sk-...">
        <button class="btn btn-primary" style="width:100%; height:46px; justify-content:center; border-radius:12px;" onclick="saveConfig()">保存配置</button>
    </div>
</div>

<script>
    const SYSTEM_BASE_PROMPTS = {
        title: "Requirement: 150-200 characters. Formula: Core Keyword + Features + Long-tail Keyword + Scene. Compliance with Amazon policy.",
        st: "Requirement: Under 220 characters, comma-separated keywords.",
        bp: "Requirement: One line per point, about 250 characters.",
        desc: "Requirement: HTML format (<p>, <li>, <ul>, <strong>). No H tags. Under 1500 characters."
    };

    const MODEL_MAP = {
        "DeepSeek": ["deepseek-chat", "deepseek-reasoner"],
        "OpenAI": ["gpt-4o", "gpt-4o-mini", "claude-3-5-sonnet"],
        "Gemini": ["gemini-1.5-pro", "gemini-1.5-flash"],
        "Doubao": ["doubao-pro-32k", "doubao-lite-128k"],
        "Grok": ["grok-beta"]
    };

    let tableData = [];
    let config = { key: "", vendor: "DeepSeek", model: "" };

    function updateModels() {
        const vendor = document.getElementById('apiVendor').value;
        const select = document.getElementById('apiModel');
        select.innerHTML = MODEL_MAP[vendor].map(m => `<option value="${m}">${m}</option>`).join('');
    }
    updateModels();

    function toggleModal(s) { document.getElementById('modalOverlay').style.display = s ? 'flex' : 'none'; }

    function saveConfig() {
        config.key = document.getElementById('apiKeyInput').value;
        config.vendor = document.getElementById('apiVendor').value;
        config.model = document.getElementById('apiModel').value;
        if(!config.key) return alert("请输入Key");
        document.getElementById('configBtn').className = 'api-badge status-on';
        document.getElementById('configBtn').innerText = '已授权: ' + config.model;
        toggleModal(false);
    }

    function downloadTemplate() {
        const headers = [["title", "search terms", "bullet point 1", "bullet point 2", "bullet point 3", "bullet point 4", "bullet point 5", "description"]];
        const ws = XLSX.utils.aoa_to_sheet(headers);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Listing");
        XLSX.writeFile(wb, "Shawn_Template.xlsx");
    }

    function handleFile(file) {
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const wb = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
            tableData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            renderTable();
        };
        reader.readAsArrayBuffer(file);
    }

    function renderTable() {
        const tbody = document.getElementById('tBody');
        if(tableData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:60px; color:#c1c1c6;">暂无数据</td></tr>`;
            return;
        }
        tbody.innerHTML = tableData.map((row, i) => `
            <tr onclick="showFullPreview(${i})" id="row-${i}">
                <td style="text-align:center; color:var(--apple-gray); font-size:11px; font-weight:700;">${i+1}</td>
                <td>${row.title || '-'}</td>
                <td>
                    <div id="opt-title-${i}">${row.opt_title || '-'}</div>
                    <div id="time-cost-${i}"></div>
                </td>
                <td id="status-${i}"><span class="status-tag tag-waiting">等待任务</span></td>
            </tr>
        `).join('');
    }

    function clearData() {
        tableData = []; renderTable();
        document.getElementById('previewBody').innerHTML = `<div style="text-align:center; color:#c1c1c6; margin-top:150px;">数据已清除</div>`;
        document.getElementById('exportBtn').style.display = 'none';
        document.getElementById('fileInput').value = '';
        document.getElementById('totalTimer').innerText = '';
    }

    async function handleRun() {
        if(!config.key) return toggleModal(true);
        const btn = document.getElementById('runBtn');
        const timerSpan = document.getElementById('totalTimer');
        const limit = parseInt(document.getElementById('concurrencyInput').value) || 100;
        btn.disabled = true;
        
        const globalStartTime = Date.now();
        const globalInterval = setInterval(() => {
            const elapsed = ((Date.now() - globalStartTime) / 1000).toFixed(1);
            timerSpan.innerText = `⏳ 运行中: ${elapsed}s`;
        }, 100);

        let activeTasks = 0;
        let currentIndex = 0;

        const next = async () => {
            if (currentIndex >= tableData.length) {
                if (activeTasks === 0) {
                    clearInterval(globalInterval);
                    const finalTime = ((Date.now() - globalStartTime) / 1000).toFixed(1);
                    timerSpan.innerText = `✅ 完成！总耗时: ${finalTime}s`;
                    btn.disabled = false;
                    document.getElementById('exportBtn').style.display = 'block';
                }
                return;
            }

            const i = currentIndex++;
            activeTasks++;
            processRowWhole(i).finally(() => {
                activeTasks--;
                next();
            });

            if (activeTasks < limit) next();
        };
        next();
    }

    // --- 核心修改：按行请求 AI ---
    async function processRowWhole(i) {
        const rowStartTime = Date.now();
        document.getElementById(`status-${i}`).innerHTML = `<span class="status-tag" style="background:#e0f2ff; color:#0071e3;">处理中...</span>`;
        
        const row = tableData[i];
        const prompt = `
Act as an Amazon SEO Expert. Optimize the following product row. 
You MUST return a JSON object with these keys: "title", "st", "bp1", "bp2", "bp3", "bp4", "bp5", "desc".

Input Data:
- Title: ${row.title || ""}
- Search Terms: ${row['search terms'] || ""}
- Bullet Points: ${[row['bullet point 1'], row['bullet point 2'], row['bullet point 3'], row['bullet point 4'], row['bullet point 5']].filter(x=>x).join('; ')}

Rules:
1. Title: ${SYSTEM_BASE_PROMPTS.title}. Extra: ${document.getElementById('p_title').value}
2. ST: ${SYSTEM_BASE_PROMPTS.st}. Extra: ${document.getElementById('p_st').value}
3. BP: ${SYSTEM_BASE_PROMPTS.bp}. Extra: ${document.getElementById('p_bp').value}
4. Description: ${SYSTEM_BASE_PROMPTS.desc}. Extra: ${document.getElementById('p_desc').value}

Constraint: No Chinese. Output ONLY the raw JSON object.
        `;

        try {
            const rawResponse = await callAI(prompt);
            // 兼容可能带 markdown 代码块的情况
            const cleanJson = JSON.parse(rawResponse.replace(/```json|```/g, "").trim());
            
            tableData[i].opt_title = cleanJson.title || "";
            tableData[i].opt_st = cleanJson.st || "";
            tableData[i].opt_bp1 = cleanJson.bp1 || "";
            tableData[i].opt_bp2 = cleanJson.bp2 || "";
            tableData[i].opt_bp3 = cleanJson.bp3 || "";
            tableData[i].opt_bp4 = cleanJson.bp4 || "";
            tableData[i].opt_bp5 = cleanJson.bp5 || "";
            tableData[i].opt_desc = cleanJson.desc || "";

            const costSec = ((Date.now() - rowStartTime) / 1000).toFixed(1);
            tableData[i].cost_time = costSec;
            
            document.getElementById(`opt-title-${i}`).innerText = cleanJson.title || "";
            document.getElementById(`time-cost-${i}`).innerHTML = `<span class="time-tag">⏱️ ${costSec}s</span>`;
            document.getElementById(`status-${i}`).innerHTML = `<span class="status-tag tag-done">已完成</span>`;
        } catch (e) {
            console.error("Row Error:", e);
            document.getElementById(`status-${i}`).innerHTML = `<span class="status-tag" style="background:#fff2f0; color:#ff4d4f;">失败</span>`;
        }
    }

    async function callAI(prompt) {
        const urlMap = {
            "DeepSeek": "https://api.deepseek.com/chat/completions",
            "OpenAI": "https://api.openai.com/v1/chat/completions",
            "Gemini": "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions",
            "Doubao": "https://ark.cn-beijing.volces.com/api/v3/chat/completions"
        };
        const url = urlMap[config.vendor] || urlMap["OpenAI"];
        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.key}` },
            body: JSON.stringify({
                model: config.model,
                messages: [{role: "user", content: prompt}],
                response_format: { type: "json_object" } // 强制 JSON
            })
        });
        const data = await res.json();
        return data.choices[0].message.content;
    }

    function showFullPreview(i) {
        document.querySelectorAll('tr').forEach(r => r.classList.remove('selected'));
        document.getElementById(`row-${i}`).classList.add('selected');
        const r = tableData[i];
        document.getElementById('previewBody').innerHTML = `
            <div style="margin-bottom:20px;">${r.cost_time ? `<span class="time-tag">整行优化耗时：${r.cost_time} 秒</span>` : ''}</div>
            <div class="listing-item"><div class="listing-label">Optimized Title</div><div class="listing-val">${r.opt_title || '-'}</div></div>
            <div class="listing-item"><div class="listing-label">Search Terms</div><div class="listing-val">${r.opt_st || '-'}</div></div>
            <div class="listing-item">
                <div class="listing-label">Bullet Points</div>
                <div class="listing-val">${[r.opt_bp1, r.opt_bp2, r.opt_bp3, r.opt_bp4, r.opt_bp5].filter(v => v).join('\n\n')}</div>
            </div>
            <div class="listing-item"><div class="listing-label">Description (HTML)</div><div class="listing-val" style="font-family:monospace; background:#2c2c2e; color:#0ad3ff; border:none;">${r.opt_desc || '-'}</div></div>
        `;
    }

    function exportExcel() {
        const cleanData = tableData.map(r => ({
            "Optimized Title": r.opt_title || "",
            "Search Terms": r.opt_st || "",
            "BP 1": r.opt_bp1 || "", "BP 2": r.opt_bp2 || "", "BP 3": r.opt_bp3 || "", "BP 4": r.opt_bp4 || "", "BP 5": r.opt_bp5 || "",
            "Description": r.opt_desc || "",
            "Time Cost(s)": r.cost_time || ""
        }));
        const ws = XLSX.utils.json_to_sheet(cleanData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Shawn_Optimized");
        XLSX.writeFile(wb, `Listing_Batch_${Date.now()}.xlsx`);
    }
</script>
</body>
</html>
