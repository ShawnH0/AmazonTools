<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI Listing 优化 Pro - Amazon 卖家工具箱</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-blue: #0066cc;
            --apple-red: #ff3b30;
            --apple-green: #34c759;
            --apple-card: rgba(255, 255, 255, 0.8);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--apple-bg);
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* 顶部导航 - 已锁定主页Logo风格 */
        .nav-header {
            height: 52px; background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; border-bottom: 1px solid rgba(0,0,0,0.05); z-index: 100;
        }

        .home-logo {
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; background: #fff; border: 1px solid #e5e5e7;
            color: #1d1d1f; text-decoration: none; transition: 0.2s;
        }
        .home-logo:hover { transform: scale(1.05); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

        /* 右上角配置按钮 */
        .api-config-btn {
            padding: 6px 14px; border-radius: 18px; font-size: 13px; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: none;
        }
        .status-unconfigured { background: rgba(255, 59, 48, 0.1); color: var(--apple-red); }
        .status-configured { background: rgba(52, 199, 89, 0.1); color: var(--apple-green); }

        /* 主体布局 */
        .container { max-width: 1440px; margin: 0 auto; width: 95%; display: flex; flex-direction: column; flex: 1; padding: 20px 0; overflow: hidden; }
        
        .workspace { display: flex; gap: 20px; flex: 1; overflow: hidden; }
        
        .panel { background: #fff; border-radius: 18px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); display: flex; flex-direction: column; }
        .main-panel { flex: 1.8; }
        .preview-panel { flex: 1.1; }

        /* 提示词输入区 */
        .prompt-section {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px;
        }
        .prompt-item label { font-size: 11px; font-weight: 600; color: #86868b; margin-bottom: 6px; display: block; }
        textarea {
            width: 100%; height: 80px; padding: 10px; border-radius: 12px; border: 1px solid #d2d2d7;
            font-size: 12px; resize: none; box-sizing: border-box; transition: 0.2s;
        }
        textarea:focus { border-color: var(--apple-blue); outline: none; box-shadow: 0 0 0 4px rgba(0,102,204,0.1); }

        /* 苹果风格按钮 */
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn {
            padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500;
            border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .btn-primary { background: var(--apple-blue); color: #fff; }
        .btn-secondary { background: #f5f5f7; color: #1d1d1f; }
        .btn-secondary:hover { background: #e8e8ed; }

        /* 配置弹窗 */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.2); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-card {
            background: #fff; width: 400px; border-radius: 24px; padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); transform: scale(0.9); transition: 0.3s;
        }
        .modal-card.active { transform: scale(1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 8px; color: #86868b; }
        .modal-input {
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #d2d2d7; box-sizing: border-box; outline: none;
        }

        /* 表格样式 */
        .table-wrap { flex: 1; overflow: auto; border: 1px solid #f2f2f2; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { background: #fafafa; padding: 12px; text-align: left; color: #86868b; position: sticky; top: 0; }
        td { padding: 12px; border-bottom: 1px solid #f2f2f2; }
        tr:hover { background: #fbfbff; }

        /* 错误抖动动画 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .shake { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body>

<div class="nav-header">
    <a href="index.html" class="home-logo" title="返回首页">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </a>
    <div style="font-weight: 600;">Listing AI 优化 Pro</div>
    <button id="configBtn" class="api-config-btn status-unconfigured" onclick="toggleModal(true)">
        <span id="statusDot" style="width:8px; height:8px; border-radius:50%; background:currentColor;"></span>
        <span id="statusText">API 未配置</span>
    </button>
</div>

<div class="container">
    <div class="workspace">
        <div class="panel main-panel">
            <div class="prompt-section">
                <div class="prompt-item"><label>TITLE PROMPT</label><textarea id="p_title"></textarea></div>
                <div class="prompt-item"><label>DESC PROMPT</label><textarea id="p_desc"></textarea></div>
                <div class="prompt-item"><label>BP PROMPT</label><textarea id="p_bp"></textarea></div>
                <div class="prompt-item"><label>ST PROMPT</label><textarea id="p_st"></textarea></div>
            </div>

            <div class="btn-group">
                <button class="btn btn-secondary" onclick="downloadTemplate()">📥 下载模板</button>
                <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">📤 上传表格</button>
                <button class="btn btn-primary" id="runBtn" onclick="handleRun()">🚀 开始处理</button>
                <input type="file" id="fileInput" hidden accept=".xlsx" onchange="handleFile(this.files[0])">
            </div>

            <div class="table-wrap">
                <table id="dataTable"><thead id="tHead"></thead><tbody id="tBody"></tbody></table>
            </div>
        </div>

        <div class="panel preview-panel">
            <div style="font-weight: 600; margin-bottom: 20px;">🔍 深度预览</div>
            <div id="previewContent" style="color:#86868b; text-align:center; padding-top:100px;">
                选择行以查看 AI 优化细节
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" id="modalCard">
        <div class="modal-header">
            <div style="font-weight: 600; font-size: 18px;">API & 模型配置</div>
            <div style="cursor:pointer;" onclick="toggleModal(false)">✕</div>
        </div>
        <div class="input-group">
            <label>AI 供应商</label>
            <select class="modal-input" id="apiVendor" onchange="updateModels()">
                <option value="OpenAI">OpenAI</option>
                <option value="DeepSeek">DeepSeek</option>
                <option value="Gemini">Google Gemini</option>
                <option value="Doubao">字节跳动豆包</option>
                <option value="Grok">xAI Grok</option>
            </select>
        </div>
        <div class="input-group">
            <label>模型选择</label>
            <select class="modal-input" id="apiModel"></select>
        </div>
        <div class="input-group">
            <label>API Key</label>
            <input type="password" class="modal-input" id="apiKeyInput" placeholder="请输入你的 API Key">
        </div>
        <div style="margin-top:25px; display:flex; gap:12px;">
            <button class="btn btn-primary" style="flex:1; justify-content:center;" onclick="saveAPIConfig()">保存并关闭</button>
        </div>
    </div>
</div>

<script>
    const modelMap = {
        "OpenAI": ["gpt-4o", "gpt-4-turbo"],
        "DeepSeek": ["deepseek-chat", "deepseek-reasoner"],
        "Gemini": ["gemini-1.5-pro", "gemini-1.5-flash"],
        "Doubao": ["doubao-pro-4k", "doubao-lite-4k"],
        "Grok": ["grok-1", "grok-2"]
    };

    let isConfigured = false;

    function updateModels() {
        const vendor = document.getElementById('apiVendor').value;
        const modelSelect = document.getElementById('apiModel');
        modelSelect.innerHTML = modelMap[vendor].map(m => `<option value="${m}">${m}</option>`).join('');
    }

    function toggleModal(show) {
        const overlay = document.getElementById('modalOverlay');
        const card = document.getElementById('modalCard');
        if(show) {
            overlay.style.display = 'flex';
            setTimeout(() => card.classList.add('active'), 10);
            updateModels();
        } else {
            card.classList.remove('active');
            setTimeout(() => overlay.style.display = 'none', 300);
        }
    }

    function saveAPIConfig() {
        const key = document.getElementById('apiKeyInput').value;
        if(key) {
            isConfigured = true;
            const btn = document.getElementById('configBtn');
            btn.className = 'api-config-btn status-configured';
            document.getElementById('statusText').innerText = 'API 已配置';
            localStorage.setItem('sh_pro_key', key);
            toggleModal(false);
        }
    }

    function handleRun() {
        if(!isConfigured) {
            const btn = document.getElementById('configBtn');
            btn.classList.add('shake');
            setTimeout(() => btn.classList.remove('shake'), 400);
            alert('⚠️ 请先点击右上角配置 API 接口信息');
            return;
        }
        // 执行 AI 处理逻辑...
        console.log("Starting AI process...");
    }

    // 页面加载逻辑
    window.onload = () => {
        const savedKey = localStorage.getItem('sh_pro_key');
        if(savedKey) {
            document.getElementById('apiKeyInput').value = savedKey;
            saveAPIConfig();
        }
    };

    // 其他原有逻辑 (表格解析、下载模板等) 保持不变
    function downloadTemplate() { /* ... */ }
    function handleFile(file) { /* ... */ }
</script>

</body>
</html>
