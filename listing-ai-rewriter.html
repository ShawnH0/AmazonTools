<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Listing AI 优化 Pro - Amazon 卖家工具箱</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #1890ff; --bg: #f0f2f5; --success: #52c41a; --error: #ff4d4f; --warning: #faad14; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; padding: 20px; height: 100vh; display: flex; flex-direction: column; }
        .container { width: 100%; max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        
        .nav-header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px 20px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .config-card { background: white; border-radius: 12px; padding: 15px 20px; margin-bottom: 15px; display: grid; grid-template-columns: 180px 1fr 1fr 150px auto; gap: 15px; align-items: end; }
        .config-item { display: flex; flex-direction: column; gap: 5px; }
        .config-item label { font-size: 12px; color: #8c8c8c; font-weight: bold; }
        .config-item input, .config-item select { padding: 8px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 13px; }

        .workspace { display: flex; gap: 20px; flex: 1; overflow: hidden; }
        .main-panel { flex: 1.8; background: white; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; overflow: hidden; }
        .preview-panel { flex: 1.2; background: white; border-radius: 12px; padding: 20px; overflow-y: auto; border-left: 4px solid var(--primary); }

        .upload-zone { border: 2px dashed #d9d9d9; padding: 20px; text-align: center; border-radius: 8px; cursor: pointer; margin-bottom: 15px; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .btn-blue { background: var(--primary); color: white; }
        .btn-green { background: var(--success); color: white; }
        .btn-outline { background: white; border: 1px solid #d9d9d9; color: #595959; }

        .table-wrap { flex: 1; overflow: auto; border: 1px solid #f0f0f0; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { background: #fafafa; padding: 12px; border-bottom: 2px solid #f0f0f0; position: sticky; top: 0; z-index: 10; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #f0f0f0; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        tr.selected { background: #e6f7ff !important; }

        .char-tag { font-size: 10px; color: #bfbfbf; display: block; }
        .warning-text { color: var(--error) !important; font-weight: bold; }
        .render-box { background: #f9f9f9; padding: 15px; border-radius: 6px; border: 1px solid #eee; font-size: 14px; line-height: 1.6; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-header">
        <a href="index.html" style="text-decoration:none; color:var(--primary);">🏠 返回工具箱首页</a>
        <div style="font-weight: bold;">Listing AI 优化 (下拉配置版)</div>
    </div>

    <div class="config-card">
        <div class="config-item">
            <label>AI 供应商 (API Host)</label>
            <select id="apiHostSelect">
                <option value="https://api.openai.com/v1">OpenAI</option>
                <option value="https://api.deepseek.com">DeepSeek</option>
            </select>
        </div>
        <div class="config-item">
            <label>API Key</label>
            <input type="password" id="apiKey" placeholder="sk-xxxx">
        </div>
        <div class="config-item">
            <label>模型名称</label>
            <input type="text" id="modelName" value="gpt-3.5-turbo">
        </div>
        <div class="config-item">
            <label>并发数 (1-5)</label>
            <input type="range" id="concurrency" min="1" max="5" value="1" oninput="this.nextElementSibling.innerText = this.value">
            <span style="text-align:center; font-size:12px; font-weight:bold;">1</span>
        </div>
        <button class="btn btn-outline" onclick="saveConfig()">💾 保存配置</button>
    </div>

    <div class="workspace">
        <div class="main-panel">
            <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                <strong>📤 上传数据表格 (.xlsx)</strong>
                <input type="file" id="fileInput" hidden accept=".xlsx" onchange="handleFileLoad(this.files[0])">
            </div>

            <div class="btn-group">
                <button class="btn btn-outline" onclick="downloadBlankTemplate()">📥 下载空白模板表格</button>
                <button class="btn btn-blue" id="runBtn" onclick="startAIProcessing()" disabled>🚀 开始批量处理</button>
                <button class="btn btn-green" id="exportBtn" onclick="exportFinalExcel()" disabled>📊 导出处理结果</button>
            </div>

            <div id="progBar" style="display:none; margin-bottom:10px;">
                <div style="height:6px; background:#eee; border-radius:3px; overflow:hidden;">
                    <div id="progFill" style="width:0%; height:100%; background:var(--primary); transition:0.3s;"></div>
                </div>
            </div>

            <div class="table-wrap">
                <table id="dataTable">
                    <thead id="tHead"></thead>
                    <tbody id="tBody"></tbody>
                </table>
            </div>
        </div>

        <div class="preview-panel" id="previewArea">
            <h3 style="margin-top:0;">🔍 Listing 实时预览</h3>
            <div id="previewContent"><p style="color:#999; text-align:center; margin-top:50px;">选择行以预览</p></div>
        </div>
    </div>
</div>

<script>
    let rawData = [];
    let headers = [];
    
    window.onload = () => {
        document.getElementById('apiHostSelect').value = localStorage.getItem('sh_ls_host') || 'https://api.openai.com/v1';
        document.getElementById('apiKey').value = localStorage.getItem('sh_ls_key') || '';
        document.getElementById('modelName').value = localStorage.getItem('sh_ls_model') || 'gpt-3.5-turbo';
    };

    function saveConfig() {
        localStorage.setItem('sh_ls_host', document.getElementById('apiHostSelect').value);
        localStorage.setItem('sh_ls_key', document.getElementById('apiKey').value);
        localStorage.setItem('sh_ls_model', document.getElementById('modelName').value);
        alert('配置已保存');
    }

    function downloadBlankTemplate() {
        const headerRow = ["Title", "Product Description", "Bullet Point 1", "Bullet Point 2", "Bullet Point 3", "Bullet Point 4", "Bullet Point 5", "Search Terms"];
        const ws = XLSX.utils.aoa_to_sheet([headerRow]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Template");
        XLSX.writeFile(wb, "Listing_Template.xlsx");
    }

    function handleFileLoad(file) {
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, {type:'array'});
            const ws = wb.Sheets[wb.SheetNames[0]];
            headers = XLSX.utils.sheet_to_json(ws, {header:1})[0];
            rawData = XLSX.utils.sheet_to_json(ws);
            renderTable();
            document.getElementById('runBtn').disabled = false;
        };
        reader.readAsArrayBuffer(file);
    }

    function renderTable() {
        const thead = document.getElementById('tHead');
        const tbody = document.getElementById('tBody');
        thead.innerHTML = `<tr><th>状态</th>${headers.map(h => `<th>${h}</th>`).join('')}</tr>`;
        tbody.innerHTML = rawData.map((row, i) => `
            <tr onclick="updatePreview(${i})" id="row-${i}">
                <td id="status-${i}">待处理</td>
                ${headers.map(h => `<td id="cell-${idxStr(i,h)}">${row[h]||''}<span class="char-tag" id="tag-${idxStr(i,h)}">${(row[h]||'').length}</span></td>`).join('')}
            </tr>
        `).join('');
    }

    function idxStr(i, h) { return i + '-' + h.replace(/\s+/g, ''); }

    function updatePreview(i) {
        document.querySelectorAll('tr').forEach(r => r.classList.remove('selected'));
        document.getElementById(`row-${i}`).classList.add('selected');
        const row = rawData[i];
        document.getElementById('previewContent').innerHTML = `
            <h4>📌 Title (${(row['Title']||'').length}/190)</h4>
            <div class="render-box">${row['Title']||'-'}</div>
            <h4>🌐 Description (${(row['Product Description']||'').length}/1500)</h4>
            <div class="render-box">${row['Product Description']||'-'}</div>
        `;
    }

    async function startAIProcessing() {
        const key = document.getElementById('apiKey').value;
        const host = document.getElementById('apiHostSelect').value;
        const model = document.getElementById('modelName').value;
        const concurrency = parseInt(document.getElementById('concurrency').value);
        
        document.getElementById('progBar').style.display = 'block';
        document.getElementById('runBtn').disabled = true;

        const queue = [...rawData.keys()];
        const workers = Array(concurrency).fill(null).map(() => (async () => {
            while (queue.length > 0) {
                const idx = queue.shift();
                document.getElementById(`status-${idx}`).innerText = "⏳...";
                for (let h of headers) {
                    if (rawData[idx][h]) {
                        const res = await callAI(host, key, model, h, rawData[idx][h]);
                        rawData[idx][h] = res;
                        const cell = document.getElementById(`cell-${idxStr(idx,h)}`);
                        cell.firstChild.textContent = res;
                        document.getElementById(`tag-${idxStr(idx,h)}`).innerText = res.length;
                    }
                }
                document.getElementById(`status-${idx}`).innerText = "✅";
                const per = Math.round(((rawData.length - queue.length) / rawData.length) * 100);
                document.getElementById('progFill').style.width = per + '%';
            }
        })());
        await Promise.all(workers);
        document.getElementById('exportBtn').disabled = false;
    }

    async function callAI(host, key, model, field, content) {
        try {
            const res = await fetch(`${host}/chat/completions`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${key}`},
                body: JSON.stringify({
                    model: model,
                    messages: [{role: "user", content: `优化亚马逊${field}：${content}`}]
                })
            });
            const data = await res.json();
            return data.choices[0].message.content.trim();
        } catch (e) { return "API Error"; }
    }

    function exportFinalExcel() {
        const ws = XLSX.utils.json_to_sheet(rawData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Result");
        XLSX.writeFile(wb, "Listing_AI_Result.xlsx");
    }
</script>
</body>
</html>
