<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI Listing 优化 Pro - Amazon 卖家工具箱</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-text: #1d1d1f;
            --apple-subtext: #86868b;
            --apple-blue: #0066cc;
            --apple-green: #28cd41;
            --apple-red: #ff3b30;
            --card-bg: rgba(255, 255, 255, 0.8);
            --radius: 18px;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: var(--apple-bg);
            color: var(--apple-text);
            margin: 0; padding: 0;
            height: 100vh; display: flex; flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* 顶部导航：苹果标志性的半透明模糊 */
        .nav-header {
            height: 52px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 30px; border-bottom: 1px solid rgba(0,0,0,0.05);
            z-index: 100;
        }

        /* 替换文字的超链接图标 */
        .home-icon {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; background: #e8e8ed;
            color: var(--apple-text); text-decoration: none;
            transition: 0.3s;
        }
        .home-icon:hover { background: #d2d2d7; transform: scale(1.05); }

        .container {
            max-width: 1440px; margin: 0 auto; width: 95%;
            display: flex; flex-direction: column; flex: 1;
            padding-top: 25px; overflow: hidden;
        }

        /* 配置卡片 */
        .config-card {
            background: #ffffff; border-radius: var(--radius);
            padding: 24px; margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            display: flex; flex-direction: column; gap: 20px;
        }

        .config-row { display: grid; grid-template-columns: 160px 180px 1fr 180px 120px; gap: 20px; align-items: flex-end; }
        
        .prompt-grid { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;
            padding-top: 20px; border-top: 1px solid #f2f2f2;
        }

        .config-item label { font-size: 12px; font-weight: 600; color: var(--apple-subtext); margin-bottom: 8px; display: block; }
        
        /* 苹果风格输入控件 */
        select, input[type="password"], textarea {
            width: 100%; padding: 10px 12px; border: 1px solid #d2d2d7;
            border-radius: 10px; background: #fff; font-size: 13px;
            outline: none; transition: 0.2s; box-sizing: border-box;
        }
        select:focus, input:focus, textarea:focus { border-color: var(--apple-blue); box-shadow: 0 0 0 3px rgba(0,102,204,0.1); }
        textarea { height: 70px; resize: none; font-family: inherit; }

        /* 工作空间布局 */
        .workspace { display: flex; gap: 24px; flex: 1; overflow: hidden; margin-bottom: 20px; }
        
        .main-panel { 
            flex: 1.8; background: #ffffff; border-radius: var(--radius);
            padding: 25px; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        .preview-panel { 
            flex: 1.1; background: #ffffff; border-radius: var(--radius);
            padding: 25px; overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        /* 药丸形状按钮 */
        .btn-group { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn {
            padding: 8px 18px; border: none; border-radius: 20px;
            font-size: 13px; font-weight: 500; cursor: pointer;
            transition: all 0.3s; display: flex; align-items: center; gap: 6px;
        }
        .btn-blue { background: var(--apple-blue); color: white; }
        .btn-blue:hover { background: #0077ed; }
        .btn-outline { background: #f5f5f7; color: var(--apple-text); }
        .btn-outline:hover { background: #e8e8ed; }
        .btn-red { background: rgba(255,59,48,0.1); color: var(--apple-red); }
        .btn-red:hover { background: var(--apple-red); color: white; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* 表格苹果化渲染 */
        .table-wrap { flex: 1; overflow: auto; border: 1px solid #f2f2f2; border-radius: 12px; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { background: #fafafa; padding: 14px; color: var(--apple-subtext); font-weight: 600; text-align: left; position: sticky; top:0; z-index: 10; border-bottom: 1px solid #f2f2f2; }
        td { padding: 12px; border-bottom: 1px solid #f2f2f2; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        tr:hover { background: #fbfbff; }
        tr.selected { background: rgba(0,102,204,0.05) !important; color: var(--apple-blue); font-weight: 500; }

        /* 预览区域样式 */
        .preview-header { font-size: 18px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .preview-label { font-size: 11px; font-weight: 700; color: var(--apple-blue); margin-top: 15px; margin-bottom: 6px; display: block; text-transform: uppercase; }
        .render-box { background: #f9f9fb; padding: 14px; border-radius: 12px; font-size: 13px; line-height: 1.6; border: 1px solid #efeff4; }
        .warning-text { color: var(--apple-red) !important; font-weight: bold; }

        /* 进度条 */
        .progress-container { height: 4px; background: #e8e8ed; border-radius: 2px; margin-bottom: 15px; overflow: hidden; display: none; }
        .progress-fill { height: 100%; background: var(--apple-blue); width: 0%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #d2d2d7; border-radius: 10px; }
    </style>
</head>
<body>

<div class="nav-header">
    <a href="index.html" class="home-icon" title="返回首页">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </a>
    <div style="font-weight: 600; font-size: 15px; letter-spacing: -0.3px;">Listing AI 优化 Pro</div>
    <div style="width:36px;"></div> </div>

<div class="container">
    <div class="config-card">
        <div class="config-row">
            <div class="config-item">
                <label>AI 供应商</label>
                <select id="apiHostSelect" onchange="handleProviderChange()">
                    <option value="https://api.openai.com/v1">OpenAI</option>
                    <option value="https://api.deepseek.com">DeepSeek</option>
                </select>
            </div>
            <div class="config-item">
                <label>模型名称</label>
                <select id="modelSelect"></select>
            </div>
            <div class="config-item">
                <label>API Key</label>
                <input type="password" id="apiKey" placeholder="sk-xxxx">
            </div>
            <div class="config-item">
                <label>并发量: <span id="conValue" style="color:var(--apple-blue)">1</span></label>
                <input type="range" id="concurrency" min="1" max="5" value="1" 
                       style="width:100%; accent-color: var(--apple-blue);" 
                       oninput="document.getElementById('conValue').innerText = this.value">
            </div>
            <button class="btn btn-blue" onclick="saveConfig()">保存配置</button>
        </div>

        <div class="prompt-grid">
            <div class="config-item"><label>TITLE PROMPT</label><textarea id="p_title" placeholder="默认：优化标题，突出核心卖点..."></textarea></div>
            <div class="config-item"><label>DESCRIPTION PROMPT</label><textarea id="p_desc" placeholder="默认：使用HTML标签优化详情描述..."></textarea></div>
            <div class="config-item"><label>BULLET POINTS PROMPT</label><textarea id="p_bp" placeholder="默认：精简并增强五点描述..."></textarea></div>
            <div class="config-item"><label>SEARCH TERMS PROMPT</label><textarea id="p_st" placeholder="默认：筛选高转化关键词..."></textarea></div>
        </div>
    </div>

    <div class="workspace">
        <div class="main-panel">
            <div class="btn-group">
                <button class="btn btn-outline" onclick="downloadBlankTemplate()">📥 下载模板</button>
                <button class="btn btn-outline" onclick="document.getElementById('fileInput').click()">📤 上传表格</button>
                <button class="btn btn-blue" id="runBtn" onclick="startAIProcessing()" disabled>🚀 开始处理</button>
                <button class="btn btn-outline" style="color:var(--apple-green)" id="exportBtn" onclick="exportFinalExcel()" disabled>📊 导出结果</button>
                <button class="btn btn-red" id="clearBtn" onclick="clearAll()">清除记录</button>
                <input type="file" id="fileInput" hidden accept=".xlsx" onchange="handleFileLoad(this.files[0])">
            </div>

            <div class="progress-container" id="progBar">
                <div class="progress-fill" id="progFill"></div>
            </div>

            <div class="table-wrap">
                <table id="dataTable"><thead id="tHead"></thead><tbody id="tBody"></tbody></table>
            </div>
        </div>

        <div class="preview-panel">
            <div class="preview-header">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--apple-blue)" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                Listing 深度预览
            </div>
            <div id="previewContent">
                <div style="text-align:center; padding-top:100px; color:var(--apple-subtext);">
                    请上传并选择行数据进行预览
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // [保持原有的 JS 逻辑不变，仅更新 UI 相关微调]
    const models = {
        "https://api.openai.com/v1": ["gpt-4o", "gpt-4-turbo", "gpt-3.5-turbo"],
        "https://api.deepseek.com": ["deepseek-chat", "deepseek-reasoner"]
    };

    let rawData = [];
    let headers = [];

    window.onload = () => {
        const savedHost = localStorage.getItem('sh_ls_host') || "https://api.openai.com/v1";
        document.getElementById('apiHostSelect').value = savedHost;
        handleProviderChange(localStorage.getItem('sh_ls_model'));
        document.getElementById('apiKey').value = localStorage.getItem('sh_ls_key') || '';
        ['p_title','p_desc','p_bp','p_st'].forEach(id => {
            document.getElementById(id).value = localStorage.getItem('sh_ls_' + id) || '';
        });
    };

    function handleProviderChange(savedModel = null) {
        const host = document.getElementById('apiHostSelect').value;
        const select = document.getElementById('modelSelect');
        select.innerHTML = models[host].map(m => `<option value="${m}">${m}</option>`).join('');
        if (savedModel && models[host].includes(savedModel)) select.value = savedModel;
    }

    function saveConfig() {
        localStorage.setItem('sh_ls_host', document.getElementById('apiHostSelect').value);
        localStorage.setItem('sh_ls_model', document.getElementById('modelSelect').value);
        localStorage.setItem('sh_ls_key', document.getElementById('apiKey').value);
        ['p_title','p_desc','p_bp','p_st'].forEach(id => {
            localStorage.setItem('sh_ls_' + id, document.getElementById(id).value);
        });
        alert('配置已成功保存！');
    }

    function handleFileLoad(file) {
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, {type:'array'});
            const ws = wb.Sheets[wb.SheetNames[0]];
            headers = XLSX.utils.sheet_to_json(ws, {header:1})[0];
            rawData = XLSX.utils.sheet_to_json(ws);
            renderTable();
            document.getElementById('runBtn').disabled = false;
        };
        reader.readAsArrayBuffer(file);
    }

    function renderTable() {
        const thead = document.getElementById('tHead');
        const tbody = document.getElementById('tBody');
        thead.innerHTML = `<tr><th width="80">状态</th>${headers.map(h => `<th>${h}</th>`).join('')}</tr>`;
        tbody.innerHTML = rawData.map((row, i) => `
            <tr onclick="updatePreview(${i})" id="row-${i}">
                <td id="status-${i}" style="color:var(--apple-subtext)">待处理</td>
                ${headers.map(h => {
                    const val = String(row[h] || '');
                    return `<td id="cell-${i}-${h.replace(/\s/g,'')}">${val}</td>`;
                }).join('')}
            </tr>
        `).join('');
    }

    function updatePreview(i) {
        document.querySelectorAll('tr').forEach(r => r.classList.remove('selected'));
        document.getElementById(`row-${i}`).classList.add('selected');
        const row = rawData[i];
        const content = document.getElementById('previewContent');
        
        let bpText = "";
        for(let n=1; n<=5; n++) { 
            const val = row['Bullet Point '+n] || '';
            if(val) bpText += `<li style="margin-bottom:8px">${val}</li>`; 
        }

        content.innerHTML = `
            <span class="preview-label">Title (${(row['Title']||'').length}/190)</span>
            <div class="render-box ${(row['Title']||'').length > 190 ? 'warning-text':''}">${row['Title']||'-'}</div>
            
            <span class="preview-label">Product Description (${(row['Product Description']||'').length}/1500)</span>
            <div class="render-box">${row['Product Description']||'-'}</div>

            <span class="preview-label">Bullet Points</span>
            <div class="render-box"><ul style="padding-left:18px;margin:0;">${bpText || '无内容'}</ul></div>

            <span class="preview-label">Search Terms</span>
            <div class="render-box">${row['Search Terms']||'-'}</div>
        `;
    }

    async function startAIProcessing() {
        const key = document.getElementById('apiKey').value;
        if(!key) return alert('请输入 API Key');
        
        const host = document.getElementById('apiHostSelect').value;
        const model = document.getElementById('modelSelect').value;
        const concurrency = parseInt(document.getElementById('concurrency').value);
        
        document.getElementById('progBar').style.display = 'block';
        document.getElementById('runBtn').disabled = true;

        const queue = [...rawData.keys()];
        const total = rawData.length;

        const workers = Array(concurrency).fill(null).map(() => (async () => {
            while (queue.length > 0) {
                const idx = queue.shift();
                document.getElementById(`status-${idx}`).innerText = "⏳ 处理中";
                let hasError = false;

                for (let h of headers) {
                    if (rawData[idx][h]) {
                        const res = await callAI(host, key, model, h, rawData[idx][h], getPrompt(h));
                        if (res.startsWith("Error")) {
                            hasError = true;
                            rawData[idx][h] = "API Error";
                        } else {
                            rawData[idx][h] = res;
                        }
                        const cell = document.getElementById(`cell-${idx}-${h.replace(/\s/g,'')}`);
                        if(cell) cell.innerText = rawData[idx][h];
                    }
                }
                
                const statusCell = document.getElementById(`status-${idx}`);
                statusCell.innerText = hasError ? "❌ 失败" : "✅ 完成";
                statusCell.style.color = hasError ? "var(--apple-red)" : "var(--apple-green)";

                const processed = total - queue.length;
                document.getElementById('progFill').style.width = (processed / total * 100) + '%';
            }
        })());
        await Promise.all(workers);
        document.getElementById('exportBtn').disabled = false;
    }

    function getPrompt(field) {
        if (field === 'Title') return document.getElementById('p_title').value;
        if (field === 'Product Description') return document.getElementById('p_desc').value;
        if (field.includes('Bullet Point')) return document.getElementById('p_bp').value;
        if (field === 'Search Terms') return document.getElementById('p_st').value;
        return "";
    }

    async function callAI(host, key, model, field, content, customPrompt) {
        const finalPrompt = customPrompt ? `${customPrompt}\n\n内容：${content}` : `优化亚马逊${field}：${content}，仅返回结果。`;
        try {
            const res = await fetch(`${host}/chat/completions`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${key}`},
                body: JSON.stringify({
                    model: model,
                    messages: [{role: "user", content: finalPrompt}],
                    temperature: 0.7
                })
            });
            const data = await res.json();
            return data.choices[0].message.content.trim();
        } catch (e) { return "Error"; }
    }

    function downloadBlankTemplate() {
        const headerRow = ["Title", "Product Description", "Bullet Point 1", "Bullet Point 2", "Bullet Point 3", "Bullet Point 4", "Bullet Point 5", "Search Terms"];
        const ws = XLSX.utils.aoa_to_sheet([headerRow]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Template");
        XLSX.writeFile(wb, "Amazon_Template.xlsx");
    }

    function exportFinalExcel() {
        const ws = XLSX.utils.json_to_sheet(rawData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Result");
        XLSX.writeFile(wb, `Optimized_Listing.xlsx`);
    }

    function clearAll() {
        location.reload(); // 苹果风格的彻底清除最快方式
    }
</script>
</body>
</html>
