<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SEO 解析专家 - Shawn's Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --sf-bg: #ffffff;
            --sf-secondary-bg: #f5f5f7;
            --sf-label: #86868b;
            --sf-text: #1d1d1f;
            --sf-accent: #0066cc;
            --sf-success: #34c759;
            --sf-error: #ff3b30;
            --sf-border: rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--sf-bg); margin: 0; color: var(--sf-text);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* Apple Style Navigation */
        .nav-header {
            height: 52px; background: rgba(255, 255, 255, 0.7);
            backdrop-filter: saturate(180%) blur(20px);
            display: flex; justify-content: center; align-items: center;
            border-bottom: 1px solid var(--sf-border); z-index: 1000; position: sticky; top: 0;
        }
        .nav-content { width: 96%; max-width: 1400px; display: flex; justify-content: space-between; align-items: center; }
        .nav-title { font-size: 19px; font-weight: 600; letter-spacing: -0.5px; }

        /* Main Layout */
        .main-container {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            padding: 40px 0; overflow-y: auto; background: var(--sf-secondary-bg);
        }
        .content-width { width: 94%; max-width: 1280px; }

        /* Card Elements */
        .glass-card {
            background: #ffffff; border-radius: 24px; padding: 32px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04); border: 1px solid var(--sf-border);
            margin-bottom: 30px;
        }

        .section-header { margin-bottom: 24px; }
        .section-header h2 { font-size: 24px; font-weight: 600; margin: 0; letter-spacing: -0.5px; }

        /* Input Area */
        textarea {
            width: 100%; height: 160px; padding: 20px; border-radius: 16px;
            border: 1px solid #d2d2d7; background: #fff; font-size: 15px;
            line-height: 1.6; outline: none; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
        }
        textarea:focus { border-color: var(--sf-accent); box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.1); }

        /* Button System */
        .btn-group { display: flex; gap: 14px; margin-top: 24px; }
        .btn {
            padding: 10px 22px; border-radius: 20px; font-size: 14px; font-weight: 500;
            border: none; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .btn-primary { background: var(--sf-accent); color: white; }
        .btn-primary:hover { background: #0077ed; transform: scale(1.02); }
        .btn-secondary { background: #e8e8ed; color: var(--sf-text); }
        .btn-secondary:hover { background: #d2d2d7; }
        .btn-danger { background: rgba(255, 59, 48, 0.1); color: var(--sf-error); }

        /* Table Area */
        .table-container { border-radius: 20px; overflow: hidden; border: 1px solid var(--sf-border); background: white; }
        .table-scroll { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1500px; }
        th {
            background: #fafafa; padding: 16px; text-align: left; font-size: 12px;
            font-weight: 600; color: var(--sf-label); text-transform: uppercase;
            border-bottom: 1px solid var(--sf-border);
        }
        td { padding: 20px 16px; border-bottom: 1px solid #f5f5f7; font-size: 14px; vertical-align: top; }
        tr:hover { background: #fbfbfd; }

        /* Field Badge */
        .field-label { font-size: 10px; color: var(--sf-label); margin-bottom: 4px; display: block; font-weight: 600; }
        
        /* Progress Indicators */
        .progress-bar-wrap { height: 4px; background: #eee; border-radius: 2px; margin-top: 10px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; transition: width 0.4s ease; }
        .count-info { font-size: 11px; color: var(--sf-label); margin-top: 6px; display: block; }

        .bg-normal { background: var(--sf-success); }
        .bg-error { background: var(--sf-error); }
        .text-error { color: var(--sf-error); font-weight: 600; }

        .error-tag { 
            color: var(--sf-error); background: #fff1f0; padding: 2px 6px; 
            border-radius: 4px; border: 1px solid rgba(255, 59, 48, 0.2); font-size: 12px;
        }
    </style>
</head>
<body>

<div class="nav-header">
    <div class="nav-content">
        <div class="nav-title">SEO Content Structure Pro</div>
        <button class="btn btn-danger" onclick="clearAppData()">Reset System</button>
    </div>
</div>

<div class="main-container">
    <div class="content-width">
        <div class="glass-card">
            <div class="section-header">
                <h2>Raw Content</h2>
            </div>
            <textarea id="rawInput" placeholder="在此粘贴 1. 产品名... Title: ... Search Terms: ... 等待解析"></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="processParsing()">⚡ 立即解析内容</button>
                <button class="btn btn-secondary" onclick="exportData()">📊 导出为 Excel</button>
            </div>
        </div>

        <div class="table-container">
            <div class="table-scroll">
                <table id="seoTable">
                    <thead>
                        <tr>
                            <th style="width: 50px;">#</th>
                            <th style="width: 150px;">Product Name</th>
                            <th style="width: 250px;">Listing Title</th>
                            <th style="width: 200px;">Search Terms</th>
                            <th>Bullet Points 1-5</th>
                            <th>Bullet 2</th><th>Bullet 3</th><th>Bullet 4</th><th>Bullet 5</th>
                            <th style="width: 300px;">Description</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
const LIMITS = { title: 200, terms: 250, bullet: 500, desc: 2000 };
const ERROR_MARK = "⚠️ 缺失内容，请检查原文";

window.onload = () => {
    const savedText = localStorage.getItem('shawn_v13_raw');
    if (savedText) document.getElementById('rawInput').value = savedText;
    renderFromStorage();
};

// 核心功能：创建结构化单元格
function createStructCell(content, limit, fieldKey) {
    const td = document.createElement('td');
    td.contentEditable = "true";
    td.dataset.limit = limit;
    td.dataset.field = fieldKey;
    
    const isError = !content || content === ERROR_MARK;
    const cleanContent = isError ? ERROR_MARK : content.trim();

    td.innerHTML = `
        <span class="field-label" contenteditable="false">${fieldKey.toUpperCase()}</span>
        <div class="cell-content ${isError ? 'error-tag' : ''}">${cleanContent}</div>
        <div class="progress-bar-wrap" contenteditable="false"><div class="progress-bar"></div></div>
        <span class="count-info" contenteditable="false">0 / ${limit}</span>
    `;

    // 绑定实时校验
    td.oninput = () => updateCellUI(td);
    setTimeout(() => updateCellUI(td), 10); // 延迟初始化进度条
    return td;
}

function updateCellUI(td) {
    const limit = parseInt(td.dataset.limit);
    const contentDiv = td.querySelector('.cell-content');
    const text = contentDiv.innerText.replace(/[\n\r]/g, "").trim();
    
    // 如果用户开始输入，移除错误标签
    if(text !== ERROR_MARK) contentDiv.classList.remove('error-tag');

    const bar = td.querySelector('.progress-bar');
    const info = td.querySelector('.count-info');
    const len = text.length;

    const percent = Math.min((len / limit) * 100, 100);
    bar.style.width = percent + '%';
    bar.className = 'progress-bar ' + (len > limit ? 'bg-error' : 'bg-normal');
    
    info.innerText = `${len} / ${limit}`;
    info.className = 'count-info ' + (len > limit ? 'text-error' : '');
    
    saveCurrentState();
}

function processParsing() {
    const input = document.getElementById('rawInput').value.trim();
    if (!input) { alert("请先粘贴内容"); return; }
    
    localStorage.setItem('shawn_v13_raw', input);
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    // 增强型切分逻辑
    const startIndices = [];
    const entryRegex = /^\d+\.\s/gm;
    let match;
    while ((match = entryRegex.exec(input)) !== null) startIndices.push(match.index);

    const blocks = startIndices.length > 0 
        ? startIndices.map((s, i) => input.substring(s, startIndices[i+1] || input.length))
        : [input];

    blocks.forEach((block, idx) => {
        const lines = block.split('\n');
        const pName = lines[0].replace(/^\d+\.\s*/, "").trim() || "Undefined Item";
        
        const extract = (regex) => {
            const m = block.match(regex);
            return (m && m[1]) ? m[1].trim() : ERROR_MARK;
        };

        const title = extract(/Title:\s*([\s\S]*?)(?=\nSearch Terms:|\n\[|\nProduct Description:|$)/i);
        const terms = extract(/Search Terms:\s*([\s\S]*?)(?=\n\[|\nProduct Description:|$)/i);
        
        const bRegex = /\[(.*?)\]\s*([\s\S]*?)(?=\n\[|\nProduct Description:|$)/gi;
        let bullets = [];
        let bMatch;
        while ((bMatch = bRegex.exec(block)) !== null && bullets.length < 5) {
            bullets.push(`[${bMatch[1]}] ${bMatch[2].trim()}`);
        }
        while(bullets.length < 5) bullets.push(ERROR_MARK);

        const desc = extract(/Product Description:\s*([\s\S]*)$/i);

        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${idx + 1}</td>`;
        tr.appendChild(createStructCell(pName, 9999, 'name'));
        tr.appendChild(createStructCell(title, LIMITS.title, 'title'));
        tr.appendChild(createStructCell(terms, LIMITS.terms, 'terms'));
        bullets.forEach((b, i) => tr.appendChild(createStructCell(b, LIMITS.bullet, `b${i+1}`)));
        tr.appendChild(createStructCell(desc, LIMITS.desc, 'desc'));
        
        tbody.appendChild(tr);
    });
    saveCurrentState();
}

function saveCurrentState() {
    const rows = [];
    document.querySelectorAll('#tableBody tr').forEach(tr => {
        const row = {};
        tr.querySelectorAll('td[data-field]').forEach(td => {
            row[td.dataset.field] = td.querySelector('.cell-content').innerText;
        });
        rows.push(row);
    });
    localStorage.setItem('shawn_v13_table', JSON.stringify(rows));
}

function renderFromStorage() {
    const data = JSON.parse(localStorage.getItem('shawn_v13_table') || "[]");
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    
    data.forEach((row, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${idx + 1}</td>`;
        tr.appendChild(createStructCell(row.name, 9999, 'name'));
        tr.appendChild(createStructCell(row.title, LIMITS.title, 'title'));
        tr.appendChild(createStructCell(row.terms, LIMITS.terms, 'terms'));
        for(let i=1; i<=5; i++) tr.appendChild(createStructCell(row[`b${i}`], LIMITS.bullet, `b${i}`));
        tr.appendChild(createStructCell(row.desc, LIMITS.desc, 'desc'));
        tbody.appendChild(tr);
    });
}

function clearAppData() {
    if(confirm("确定重置吗？这会清空解析数据，但保留设置中心配置。")) {
        localStorage.removeItem('shawn_v13_raw');
        localStorage.removeItem('shawn_v13_table');
        location.reload();
    }
}

function exportData() {
    const data = JSON.parse(localStorage.getItem('shawn_v13_table') || "[]");
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "SEO_Analysis");
    XLSX.writeFile(wb, `SEO_Export_${new Date().toISOString().split('T')[0]}.xlsx`);
}
</script>
</body>
</html>
