<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SEO 解析校验 - 卖家工具箱</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-blue: #0066cc;
            --apple-green: #34c759;
            --apple-red: #ff3b30;
            --apple-warning: #ff9500;
            --apple-card: #ffffff;
            --apple-text: #1d1d1f;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--apple-bg); margin: 0; padding: 0;
            color: var(--apple-text); height: 100vh; display: flex; flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* 导航 */
        .nav-header {
            height: 52px; background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; border-bottom: 1px solid rgba(0,0,0,0.05); z-index: 1000;
        }

        .home-logo {
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; background: #fff; border: 1px solid #e5e5e7;
            color: #1d1d1f; text-decoration: none;
        }

        .container { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow: hidden; gap: 20px; }

        /* 输入卡片 */
        .input-section {
            background: var(--apple-card); border-radius: 20px; padding: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.04); flex-shrink: 0;
        }

        textarea {
            width: 100%; height: 120px; padding: 16px; border-radius: 12px;
            border: 1px solid #d2d2d7; background: #fafafa; font-size: 14px;
            line-height: 1.5; resize: none; box-sizing: border-box; outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        textarea:focus { background: #fff; border-color: var(--apple-blue); box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.1); }

        /* 按钮样式 */
        .btn-group { display: flex; gap: 12px; margin-top: 15px; }
        .btn {
            padding: 8px 18px; border-radius: 18px; font-size: 13px; font-weight: 500;
            border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .btn-primary { background: var(--apple-blue); color: white; }
        .btn-success { background: var(--apple-green); color: white; }
        .btn-ghost { background: #f5f5f7; color: var(--apple-red); }
        .btn:hover { transform: translateY(-1px); filter: brightness(1.1); }

        /* 表格区域 */
        .output-section {
            background: var(--apple-card); border-radius: 20px; flex: 1;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
        }

        .table-wrap { flex: 1; overflow: auto; position: relative; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 1400px; }
        
        th {
            position: sticky; top: 0; background: rgba(250,250,252,0.9);
            backdrop-filter: blur(10px); z-index: 10;
            padding: 14px; text-align: left; font-size: 12px; font-weight: 600;
            color: var(--apple-secondary); border-bottom: 1px solid #e5e5e7;
        }

        td {
            padding: 16px 12px; border-bottom: 1px solid #f2f2f2;
            font-size: 13px; vertical-align: top; transition: background 0.2s;
            position: relative; outline: none;
        }
        td:focus { background: #f9f9fb; }

        /* 字符校验样式 */
        .char-count-wrap {
            margin-top: 8px; height: 3px; background: #eee; border-radius: 2px;
            overflow: hidden; position: relative;
        }
        .char-progress { height: 100%; width: 0; transition: width 0.3s, background 0.3s; }
        .char-text { font-size: 10px; color: #86868b; margin-top: 4px; display: block; font-weight: 500; }

        /* 警告状态 */
        .state-normal { background: var(--apple-green); }
        .state-near { background: var(--apple-warning); }
        .state-over { background: var(--apple-red); }
        .warning-text { color: var(--apple-red) !important; font-weight: 700; }

        /* 隐藏滚动条但保留功能 (WebKit) */
        .table-wrap::-webkit-scrollbar { width: 6px; height: 6px; }
        .table-wrap::-webkit-scrollbar-thumb { background: #d2d2d7; border-radius: 3px; }
    </style>
</head>
<body>

<div class="nav-header">
    <a href="index.html" class="home-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </a>
    <div style="font-weight: 600;">SEO 解析 & 长度校验专家</div>
    <div style="width: 36px;"></div>
</div>

<div class="container">
    <div class="input-section">
        <textarea id="rawInput" placeholder="在此粘贴 1. 产品名... Title: ... Search Terms: ... 等待解析"></textarea>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="parseContent()">⚡ 解析并校验</button>
            <button class="btn btn-success" onclick="exportToExcel()">📊 导出 Excel</button>
            <button class="btn btn-ghost" onclick="clearData()">🗑️ 清空数据</button>
        </div>
    </div>

    <div class="output-section">
        <div class="table-wrap">
            <table id="seoTable">
                <thead>
                    <tr>
                        <th style="width: 120px;">产品名称</th>
                        <th style="width: 260px;">Title (200)</th>
                        <th style="width: 220px;">Search Terms (250)</th>
                        <th>Bullet 1 (500)</th>
                        <th>Bullet 2 (500)</th>
                        <th>Bullet 3 (500)</th>
                        <th>Bullet 4 (500)</th>
                        <th>Bullet 5 (500)</th>
                        <th style="width: 320px;">Description (2000)</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
const LIMITS = { title: 200, terms: 250, bullet: 500, desc: 2000 };

window.onload = () => {
    const savedInput = localStorage.getItem('shawn_seo_raw');
    if (savedInput) document.getElementById('rawInput').value = savedInput;
    const savedTable = localStorage.getItem('shawn_seo_table');
    if (savedTable) {
        document.getElementById('tableBody').innerHTML = savedTable;
        bindCellEvents();
    }
};

function checkLength(td, limit) {
    const text = td.innerText.replace(/[\n\r]/g, "").trim();
    const len = text.length;
    const progress = td.querySelector('.char-progress');
    const textLabel = td.querySelector('.char-text');
    
    let percent = Math.min((len / limit) * 100, 100);
    if(progress) {
        progress.style.width = percent + '%';
        progress.className = 'char-progress ' + (len > limit ? 'state-over' : (len > limit * 0.9 ? 'state-near' : 'state-normal'));
    }
    if(textLabel) {
        textLabel.innerText = `${len} / ${limit}`;
        textLabel.className = 'char-text ' + (len > limit ? 'warning-text' : '');
    }
    saveTableState();
}

function bindCellEvents() {
    document.querySelectorAll('#tableBody td[contenteditable="true"]').forEach(td => {
        const limit = parseInt(td.dataset.limit) || 9999;
        td.oninput = () => checkLength(td, limit);
        checkLength(td, limit);
    });
}

function createCell(content, limit) {
    const td = document.createElement('td');
    td.contentEditable = "true";
    td.dataset.limit = limit;
    td.innerText = content.trim();
    
    // 注入苹果风格进度条
    const uiWrap = document.createElement('div');
    uiWrap.contentEditable = "false";
    uiWrap.innerHTML = `
        <div class="char-count-wrap"><div class="char-progress"></div></div>
        <span class="char-text">0 / ${limit}</span>
    `;
    td.appendChild(uiWrap);
    return td;
}

function parseContent() {
    const text = document.getElementById('rawInput').value;
    if (!text.trim()) return;
    
    localStorage.setItem('shawn_seo_raw', text);
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = ''; 

    // 使用你原有的正则逻辑进行切分
    const productSections = text.split(/(?=\d+\.\s+[\u4e00-\u9fa5a-zA-Z])/).filter(s => s.trim().length > 10);

    productSections.forEach(section => {
        const lines = section.split('\n');
        const productName = (lines[0].match(/\d+\.\s*(.*)/) || ["", "Item"])[1].trim();
        const title = (section.match(/Title:\s*(.*)/) || ["", ""])[1];
        const terms = (section.match(/Search Terms:\s*(.*)/) || ["", ""])[1];
        
        const bulletRegex = /\[(.*?)\](.*?)(?=\n\[|\n\n|Product Description:|$)/gs;
        let bullets = [];
        let match;
        while ((match = bulletRegex.exec(section)) !== null && bullets.length < 5) {
            bullets.push(`[${match[1]}] ${match[2].trim()}`);
        }
        while(bullets.length < 5) bullets.push("");
        const descPart = section.split(/Product Description:\s*/)[1] || "";

        const tr = document.createElement('tr');
        tr.appendChild(createCell(productName, 9999));
        tr.appendChild(createCell(title, LIMITS.title));
        tr.appendChild(createCell(terms, LIMITS.terms));
        [0,1,2,3,4].forEach(i => tr.appendChild(createCell(bullets[i], LIMITS.bullet)));
        tr.appendChild(createCell(descPart, LIMITS.desc));
        tbody.appendChild(tr);
    });
    bindCellEvents();
    saveTableState();
}

function saveTableState() {
    localStorage.setItem('shawn_seo_table', document.getElementById('tableBody').innerHTML);
}

function clearData() {
    if(confirm("确定清空吗？")) {
        localStorage.clear();
        location.reload();
    }
}

function exportToExcel() {
    const table = document.getElementById('seoTable');
    const clone = table.cloneNode(true);
    clone.querySelectorAll('.char-count-wrap, .char-text').forEach(el => el.remove());
    const wb = XLSX.utils.table_to_book(clone);
    XLSX.writeFile(wb, `Shawn_Amazon_SEO_${new Date().toLocaleDateString()}.xlsx`);
}
</script>

</body>
</html>
