<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Shawn's SEO Pro v12 - 结构化重构版</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --apple-bg: #f5f5f7; --apple-blue: #0066cc; --apple-green: #34c759;
            --apple-red: #ff3b30; --apple-warning: #ff9500; --apple-card: #ffffff;
            --apple-text: #1d1d1f; --apple-secondary: #86868b;
        }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--apple-bg); margin: 0; color: var(--apple-text); height: 100vh; display: flex; flex-direction: column; }
        .nav-header { height: 52px; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); display: flex; justify-content: space-between; align-items: center; padding: 0 24px; border-bottom: 1px solid rgba(0,0,0,0.05); z-index: 1000; }
        .container { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow: hidden; gap: 20px; }
        .input-section { background: var(--apple-card); border-radius: 20px; padding: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.04); flex-shrink: 0; }
        textarea { width: 100%; height: 140px; padding: 16px; border-radius: 12px; border: 1px solid #d2d2d7; background: #fafafa; font-size: 13px; line-height: 1.5; outline: none; transition: 0.3s; }
        textarea:focus { background: #fff; border-color: var(--apple-blue); box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.1); }
        .btn-group { display: flex; gap: 12px; margin-top: 15px; }
        .btn { padding: 8px 18px; border-radius: 18px; font-size: 13px; font-weight: 500; border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--apple-blue); color: white; }
        .btn-success { background: var(--apple-green); color: white; }
        .btn-ghost { background: #f2f2f7; color: #1d1d1f; }
        /* 表格样式 */
        .output-section { background: var(--apple-card); border-radius: 20px; flex: 1; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.04); }
        .table-wrap { flex: 1; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 1600px; }
        th { position: sticky; top: 0; background: rgba(250,250,252,0.95); backdrop-filter: blur(10px); z-index: 10; padding: 14px; text-align: left; font-size: 12px; font-weight: 600; color: var(--apple-secondary); border-bottom: 1px solid #e5e5e7; }
        td { padding: 16px 12px; border-bottom: 1px solid #f2f2f2; font-size: 13px; vertical-align: top; outline: none; }
        /* 进度条与警告 */
        .char-count-wrap { margin-top: 8px; height: 3px; background: #eee; border-radius: 2px; overflow: hidden; }
        .char-progress { height: 100%; width: 0; transition: 0.3s; }
        .char-text { font-size: 10px; color: #86868b; margin-top: 4px; display: block; }
        .state-normal { background: var(--apple-green); }
        .state-over { background: var(--apple-red); }
        .warning-label { color: var(--apple-red); font-weight: bold; background: #fff1f0; padding: 2px 4px; border-radius: 4px; border: 1px solid #ffa39e; }
    </style>
</head>
<body>

<div class="nav-header">
    <div style="font-weight: 600;">Shawn's SEO Pro v12</div>
    <div class="btn-group">
        <button class="btn btn-ghost" onclick="clearData()">🗑️ 重置数据</button>
    </div>
</div>

<div class="container">
    <div class="input-section">
        <textarea id="rawInput" placeholder="在此粘贴 AI 生成的文案内容..."></textarea>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="parseContent()">⚡ 结构化解析</button>
            <button class="btn btn-success" onclick="exportToExcel()">📊 导出 Excel</button>
        </div>
    </div>

    <div class="output-section">
        <div class="table-wrap">
            <table id="seoTable">
                <thead>
                    <tr>
                        <th style="width: 60px;">ID</th>
                        <th style="width: 150px;">产品名称</th>
                        <th style="width: 250px;">Title (200)</th>
                        <th style="width: 220px;">Search Terms (250)</th>
                        <th>Bullet 1-5 (500)</th>
                        <th>Bullet 2</th><th>Bullet 3</th><th>Bullet 4</th><th>Bullet 5</th>
                        <th style="width: 350px;">Description (2000)</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
const LIMITS = { title: 200, terms: 250, bullet: 500, desc: 2000 };
const ERROR_TEXT = "⚠️ 未识别，请检查原文";

window.onload = () => {
    const savedInput = localStorage.getItem('shawn_seo_raw');
    if (savedInput) document.getElementById('rawInput').value = savedInput;
    renderSavedTable();
};

/** * 核心优化：createCell 现在携带 field 元数据
 */
function createCell(content, limit, fieldName) {
    const td = document.createElement('td');
    td.contentEditable = "true";
    td.dataset.limit = limit;
    td.dataset.field = fieldName; // 【新增元数据】
    
    // 处理异常内容显示
    const isEmpty = !content || content.trim() === "";
    const isError = content === ERROR_TEXT;
    
    td.innerHTML = `<div class="content-text ${isError ? 'warning-label' : ''}">${content || (fieldName === 'productName' ? 'New Item' : ERROR_TEXT)}</div>
                    <div class="char-count-wrap" contenteditable="false"><div class="char-progress"></div></div>
                    <span class="char-text" contenteditable="false">0 / ${limit}</span>`;
    
    return td;
}

function checkLength(td) {
    const limit = parseInt(td.dataset.limit);
    const textElement = td.querySelector('.content-text');
    const text = textElement.innerText.replace(/[\n\r]/g, "").trim();
    const len = text.length;
    
    // 自动清除错误标记（如果用户输入了内容）
    if(len > 0 && text !== ERROR_TEXT) textElement.classList.remove('warning-label');

    const progress = td.querySelector('.char-progress');
    const label = td.querySelector('.char-text');
    
    if(progress && label) {
        let percent = Math.min((len / limit) * 100, 100);
        progress.style.width = percent + '%';
        progress.className = 'char-progress ' + (len > limit ? 'state-over' : 'state-normal');
        label.innerText = `${len} / ${limit}`;
        label.className = 'char-text ' + (len > limit ? 'warning-label' : '');
    }
    saveTableState();
}

function parseContent() {
    const fullText = document.getElementById('rawInput').value.trim();
    if (!fullText) return;
    localStorage.setItem('shawn_seo_raw', fullText);
    
    const startIndices = [];
    const entryRegex = /^\d+\.\s/gm;
    let m;
    while ((m = entryRegex.exec(fullText)) !== null) startIndices.push(m.index);
    
    const sections = startIndices.map((start, i) => fullText.substring(start, startIndices[i+1] || fullText.length));
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    sections.forEach((section, index) => {
        const productName = (section.split('\n')[0] || "").replace(/^\d+\.\s*/, "").trim();
        const getMatch = (reg) => {
            const res = section.match(reg);
            return (res && res[1] && res[1].trim()) ? res[1].trim() : ERROR_TEXT;
        };

        const title = getMatch(/Title:\s*([\s\S]*?)(?=\nSearch Terms:|\n\[|\nProduct Description:|$)/i);
        const terms = getMatch(/Search Terms:\s*([\s\S]*?)(?=\n\[|\nProduct Description:|$)/i);
        
        const bulletRegex = /\[(.*?)\]\s*([\s\S]*?)(?=\n\[|\nProduct Description:|$)/gi;
        let bullets = [];
        let bMatch;
        while ((bMatch = bulletRegex.exec(section)) !== null && bullets.length < 5) {
            bullets.push(`[${bMatch[1]}] ${bMatch[2].trim()}`);
        }
        while(bullets.length < 5) bullets.push(ERROR_TEXT);

        const desc = getMatch(/Product Description:\s*([\s\S]*)$/i);

        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${index + 1}</td>`;
        tr.appendChild(createCell(productName, 9999, 'productName'));
        tr.appendChild(createCell(title, LIMITS.title, 'title'));
        tr.appendChild(createCell(terms, LIMITS.terms, 'searchTerms'));
        bullets.forEach((b, i) => tr.appendChild(createCell(b, LIMITS.bullet, `bullet_${i+1}`)));
        tr.appendChild(createCell(desc, LIMITS.desc, 'description'));
        tbody.appendChild(tr);
    });

    document.querySelectorAll('#tableBody td[contenteditable="true"]').forEach(td => {
        td.oninput = () => checkLength(td);
        checkLength(td);
    });
}

function saveTableState() {
    const rows = [];
    document.querySelectorAll('#tableBody tr').forEach(tr => {
        const rowData = {};
        tr.querySelectorAll('td[data-field]').forEach(td => {
            rowData[td.dataset.field] = td.querySelector('.content-text').innerText;
        });
        rows.push(rowData);
    });
    localStorage.setItem('shawn_seo_table_v12', JSON.stringify(rows));
}

function renderSavedTable() {
    const data = JSON.parse(localStorage.getItem('shawn_seo_table_v12') || "[]");
    const tbody = document.getElementById('tableBody');
    data.forEach((row, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${index + 1}</td>`;
        tr.appendChild(createCell(row.productName, 9999, 'productName'));
        tr.appendChild(createCell(row.title, LIMITS.title, 'title'));
        tr.appendChild(createCell(row.searchTerms, LIMITS.terms, 'searchTerms'));
        for(let i=1; i<=5; i++) tr.appendChild(createCell(row[`bullet_${i}`], LIMITS.bullet, `bullet_${i}`));
        tr.appendChild(createCell(row.description, LIMITS.desc, 'description'));
        tbody.appendChild(tr);
    });
    document.querySelectorAll('#tableBody td[contenteditable="true"]').forEach(td => {
        td.oninput = () => checkLength(td);
        checkLength(td);
    });
}

/** * 精准爆破清除，不伤及无辜（配置信息）
 */
function clearData() {
    if(confirm("确定清空当前预览数据吗？（保留系统配置）")) {
        localStorage.removeItem('shawn_seo_raw');
        localStorage.removeItem('shawn_seo_table_v12');
        location.reload();
    }
}

function exportToExcel() {
    const data = JSON.parse(localStorage.getItem('shawn_seo_table_v12') || "[]");
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "SEO_Data");
    XLSX.writeFile(wb, `Shawn_Listing_v12_${new Date().toISOString().slice(0,10)}.xlsx`);
}
</script>
</body>
</html>
