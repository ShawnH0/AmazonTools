<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户权限管理控制台 - 管理员专用</title>
    <script>
        // 【1. 顶部安全校验】 必须在页面渲染前执行
        (function() {
            const currentUser = JSON.parse(localStorage.getItem('current_user'));
            // 检查是否存在登录信息，且账号是否为 admin
            if (!currentUser || currentUser.user !== 'admin') {
                alert('⚠️ 访问受限：检测到非管理员操作，正在返回首页...');
                window.location.href = 'index.html';
            }
        })();
    </script>
    <style>
        :root { --primary: #1890ff; --success: #52c41a; --error: #ff4d4f; --bg: #f0f2f5; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 30px; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f0f2f5; padding-bottom: 20px; margin-bottom: 20px; }
        .header h2 { margin: 0; color: #333; display: flex; align-items: center; gap: 10px; }
        
        .toolbar { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-box { flex: 1; padding: 8px 15px; border: 1px solid #d9d9d9; border-radius: 6px; outline: none; }
        .search-box:focus { border-color: var(--primary); }

        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: #fafafa; padding: 15px; text-align: left; color: #595959; font-weight: 600; border-bottom: 2px solid #f0f0f0; }
        td { padding: 15px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        
        .btn { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 500; transition: 0.2s; }
        .btn-add { background: var(--primary); color: white; }
        .btn-edit { background: #e6f7ff; color: var(--primary); margin-right: 5px; }
        .btn-vip { background: #f6ffed; color: var(--success); border: 1px solid #b7eb8f; margin-right: 5px; }
        .btn-del { background: #fff1f0; color: var(--error); border: 1px solid #ffa39e; }
        .btn:hover { opacity: 0.8; }

        .tag { padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        .tag-vip { background: #fff7e6; color: #fa8c16; border: 1px solid #ffd591; }
        .tag-admin { background: #f9f0ff; color: #722ed1; border: 1px solid #d3adf7; }
        .tag-user { background: #f5f5f5; color: #8c8c8c; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🔑 用户管理后台 <span style="font-size: 14px; color: #8c8c8c; font-weight: normal;">(仅管理员可见)</span></h2>
        <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: 500;">← 返回卖家工具箱</a>
    </div>

    <div class="toolbar">
        <input type="text" id="searchKey" class="search-box" placeholder="搜索用户名或账号类型..." oninput="loadUsers()">
        <button class="btn btn-add" onclick="userAction('add')">+ 新增用户</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>账号</th>
                <th>密码</th>
                <th>用户类型</th>
                <th>套餐到期时间</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="userTableBody">
            </tbody>
    </table>
</div>

<script>
    // 初始化本地模拟数据库
    function getDB() {
        return JSON.parse(localStorage.getItem('users_db')) || [];
    }

    function saveDB(data) {
        localStorage.setItem('users_db', JSON.stringify(data));
        loadUsers();
    }

    // 加载并渲染用户列表
    function loadUsers() {
        const db = getDB();
        const keyword = document.getElementById('searchKey').value.toLowerCase();
        const tbody = document.getElementById('userTableBody');
        tbody.innerHTML = '';

        db.filter(u => u.user.toLowerCase().includes(keyword) || u.type.includes(keyword)).forEach((user, index) => {
            const isVIP = user.type === 'VIP用户';
            const isAdmin = user.user === 'admin';
            
            tbody.innerHTML += `
                <tr>
                    <td><strong>${user.user}</strong></td>
                    <td><code>${user.pass}</code></td>
                    <td><span class="tag ${isAdmin ? 'tag-admin' : (isVIP ? 'tag-vip' : 'tag-user')}">${user.type}</span></td>
                    <td>${user.expiry}</td>
                    <td>
                        <button class="btn btn-edit" onclick="userAction('edit', ${index})">修改</button>
                        ${!isAdmin ? `<button class="btn btn-vip" onclick="makeForeverVIP(${index})">✨ 永久VIP</button>` : ''}
                        ${!isAdmin ? `<button class="btn btn-del" onclick="userAction('delete', ${index})">删除</button>` : ''}
                    </td>
                </tr>
            `;
        });
    }

    // 【一键设为永久 VIP 逻辑】
    function makeForeverVIP(index) {
        const db = getDB();
        db[index].type = 'VIP用户';
        db[index].expiry = '2099-12-31'; // 设置一个遥远的日期作为永久标识
        if(confirm(`确定要将用户 [${db[index].user}] 提升为永久 VIP 吗？`)) {
            saveDB(db);
        }
    }

    // CRUD 操作逻辑
    function userAction(type, index) {
        let db = getDB();
        
        if (type === 'delete') {
            if(confirm('确定删除该用户吗？操作不可撤销。')) {
                db.splice(index, 1);
                saveDB(db);
            }
        } else if (type === 'add' || type === 'edit') {
            const isEdit = type === 'edit';
            const userObj = isEdit ? db[index] : { user: '', pass: '', type: '普通用户', expiry: '2026-12-31' };
            
            const newName = isEdit ? userObj.user : prompt("请输入新账号:", "");
            if(!newName) return;
            
            const newPass = prompt("设置密码:", userObj.pass);
            const newType = prompt("用户类型 (普通用户/VIP用户):", userObj.type);
            const newExpiry = prompt("套餐到期日期 (YYYY-MM-DD):", userObj.expiry);

            if(isEdit) {
                db[index] = { user: newName, pass: newPass, type: newType, expiry: newExpiry };
            } else {
                db.push({ user: newName, pass: newPass, type: newType, expiry: newExpiry });
            }
            saveDB(db);
        }
    }

    // 页面加载执行
    window.onload = loadUsers;
</script>
</body>
</html>
