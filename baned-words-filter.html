<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Amazon 品牌清理 Pro - Shawn's Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --apple-bg: #f5f5f7; --apple-blue: #0066cc; --apple-red: #ff3b30;
            --apple-green: #34c759; --apple-purple: #722ed1; --apple-gray: #86868b;
        }

        body {
            font-family: 'Inter', -apple-system, "PingFang SC", sans-serif;
            background-color: var(--apple-bg); margin: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden; color: #1d1d1f;
        }

        /* 顶部导航 */
        .nav-header {
            height: 56px; background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; border-bottom: 1px solid rgba(0,0,0,0.08); z-index: 100;
        }

        .capability-tags { display: flex; gap: 10px; }
        .cap-tag { 
            font-size: 11px; padding: 3px 10px; border-radius: 6px; 
            border: 1px solid #e5e5e7; color: var(--apple-gray); font-weight: 500;
            transition: 0.3s;
        }
        .cap-tag.active { border-color: var(--apple-green); color: var(--apple-green); background: rgba(52, 199, 89, 0.08); }

        .container { max-width: 1400px; margin: 0 auto; width: 96%; flex: 1; display: flex; flex-direction: column; padding: 20px 0; overflow: hidden; }
        .workspace { display: grid; grid-template-columns: 1fr 1.2fr; gap: 24px; flex: 1; overflow: hidden; }
        
        .panel { 
            background: #fff; border-radius: 24px; padding: 24px; 
            display: flex; flex-direction: column; overflow: hidden; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.02);
        }

        .section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
        
        textarea {
            width: 100%; border-radius: 14px; border: 1px solid #d2d2d7;
            font-size: 14px; line-height: 1.6; padding: 15px; box-sizing: border-box;
            background: #fbfbfd; outline: none; transition: 0.2s; resize: none;
        }
        textarea:focus { border-color: var(--apple-blue); background: #fff; box-shadow: 0 0 0 4px rgba(0,102,204,0.1); }

        .display-area { 
            flex: 1; margin-top: 16px; padding: 18px; background: #f5f5f7; 
            border-radius: 14px; font-size: 14px; overflow-y: auto; white-space: pre-wrap;
            border: 1px solid #e5e5e7; position: relative; color: #333;
        }

        .ai-badge {
            position: absolute; top: 12px; right: 12px; font-size: 10px;
            background: var(--apple-purple); color: white; padding: 3px 8px; border-radius: 6px;
            font-weight: 600; letter-spacing: 0.5px;
        }

        .btn {
            padding: 10px 18px; border-radius: 20px; font-size: 13px; font-weight: 500;
            border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .btn-blue { background: var(--apple-blue); color: #fff; }
        .btn-blue:hover { background: #0055bb; }
        .btn-purple { background: var(--apple-purple); color: #fff; }
        .btn-gray { background: #f2f2f7; color: #1d1d1f; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* 配置弹窗 */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(12px); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-card { background: #fff; width: 520px; border-radius: 30px; padding: 32px; box-shadow: 0 30px 60px rgba(0,0,0,0.2); }
        .modal-card h2 { margin: 0 0 24px 0; font-size: 22px; font-weight: 700; }
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-size: 11px; font-weight: 700; color: var(--apple-gray); margin-bottom: 6px; text-transform: uppercase; }
        .modal-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #d2d2d7; box-sizing: border-box; font-size: 14px; }
        
        select.modal-input { appearance: none; background: url("data:image/svg+xml,...") no-repeat right 12px center; }

        /* Loading 动画 */
        .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="nav-header">
    <div style="display:flex; align-items:center; gap:18px;">
        <div style="background:var(--apple-blue); color:white; width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:800;">S</div>
        <span style="font-weight:700; font-size:18px; letter-spacing:-0.5px;">CleanListing Pro</span>
        <div class="capability-tags">
            <span id="tag-local" class="cap-tag">词库清洗</span>
            <span id="tag-ai" class="cap-tag">AI 清洗</span>
        </div>
    </div>
    <button class="btn btn-gray" onclick="openModal()">⚙️ 设置中心</button>
</div>

<div class="container">
    <div class="workspace">
        <div class="panel">
            <div class="section-title">单段文案清洗</div>
            <textarea id="textInput" style="height: 180px;" placeholder="在此粘贴 Amazon Listing 原始描述 (支持 HTML)..."></textarea>
            <div style="display:flex; gap:12px; margin-top:16px;">
                <button class="btn btn-blue" onclick="execClean('rule')">⚡ 规则清洗</button>
                <button class="btn btn-purple" id="btnAiExec" onclick="execClean('ai')">
                    <span id="aiBtnText">🤖 AI 深度清理</span>
                </button>
                <button class="btn btn-gray" onclick="clearAll()">重置</button>
            </div>
            <div id="textOutput" class="display-area">等待指令...</div>
        </div>

        <div class="panel">
            <div class="section-title">
                批量 Excel 处理
                <span id="batchCount" style="font-weight:400; font-size:12px; color:var(--apple-gray)"></span>
            </div>
            <div style="display:flex; gap:12px; margin-bottom:16px;">
                <button class="btn btn-gray" onclick="document.getElementById('fIn').click()">📤 上传表格</button>
                <button class="btn btn-blue" id="btnTableExec" disabled onclick="execTableClean()">执行批量清洗</button>
                <button class="btn btn-gray" id="btnExport" disabled onclick="exportRes()">💾 导出结果</button>
                <input type="file" id="fIn" hidden onchange="handleExcel(this.files[0])">
            </div>
            <div style="flex:1; overflow:auto; border:1px solid rgba(0,0,0,0.05); border-radius:14px; background:#fcfcfd;">
                <table id="dataTable" style="width:100%; font-size:12px; border-collapse:collapse; text-align:left;">
                    <thead style="background:#f5f5f7; position:sticky; top:0; z-index:10;"><tr id="tHead"></tr></thead>
                    <tbody id="tBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal-card">
        <h2>系统配置</h2>
        <div class="input-group">
            <label>AI 供应商</label>
            <select id="apiProvider" class="modal-input" onchange="toggleProvider()">
                <option value="deepseek">DeepSeek (性价比最高)</option>
                <option value="openrouter">OpenRouter (模型最全)</option>
                <option value="openai">OpenAI (标准接口)</option>
            </select>
        </div>
        <div class="input-group">
            <label>API Key</label>
            <input type="password" id="apiKey" class="modal-input" placeholder="sk-...">
        </div>
        <div class="input-group">
            <label>模型名称</label>
            <input type="text" id="apiModel" class="modal-input" placeholder="deepseek-chat">
        </div>
        <div class="input-group">
            <label>本地屏蔽品牌库 (逗号分隔)</label>
            <textarea id="customBrands" class="modal-input" style="height:80px;" placeholder="Apple, Sony, Nike..."></textarea>
        </div>
        <div style="display:flex; gap:12px; margin-top:20px;">
            <button class="btn btn-blue" style="flex:1; justify-content:center;" onclick="saveConfig()">保存并应用</button>
            <button class="btn btn-gray" onclick="closeModal()">取消</button>
        </div>
    </div>
</div>

<script>
    let rawData = [];
    let config = {};
    let isProcessing = false;

    window.onload = () => {
        loadConfig();
        refreshCapabilityUI();
    };

    function loadConfig() {
        const fields = ['apiKey', 'apiProvider', 'apiModel', 'customBrands'];
        fields.forEach(f => {
            config[f] = localStorage.getItem('sh_v3_' + f) || '';
            document.getElementById(f).value = config[f];
        });
        if(!config.apiModel) document.getElementById('apiModel').value = 'deepseek-chat';
    }

    function saveConfig() {
        const fields = ['apiKey', 'apiProvider', 'apiModel', 'customBrands'];
        fields.forEach(f => {
            const val = document.getElementById(f).value.trim();
            localStorage.setItem('sh_v3_' + f, val);
            config[f] = val;
        });
        refreshCapabilityUI();
        closeModal();
    }

    function refreshCapabilityUI() {
        const hasBrands = config.customBrands.length > 0;
        const hasAI = config.apiKey.length > 10;
        document.getElementById('tag-local').className = hasBrands ? 'cap-tag active' : 'cap-tag';
        document.getElementById('tag-ai').className = hasAI ? 'cap-tag active' : 'cap-tag';
    }

    // --- 算法核心：三段式规则清理 ---
    function advancedRuleClean(text) {
        if (!text) return "";
        let brands = config.customBrands.split(/[,，]/).map(s => s.trim()).filter(s => s.length > 1);
        if (brands.length === 0) return text;

        let processed = text;
        const protectMap = new Map();

        // 1. 保护 HTML 标签 (防止清理破坏结构)
        processed = processed.replace(/<[^>]+>/g, (match) => {
            const id = `##TAG${Math.random().toString(36).substr(2, 7)}##`;
            protectMap.set(id, match);
            return id;
        });

        // 2. 保护兼容性短语 (Compatible for Apple)
        const compatPrefixes = ["compatible\\s+with", "for", "fits", "replacement\\s+for", "suited\\s+for"];
        const compatRegex = new RegExp(`(${compatPrefixes.join('|')})\\s+(${brands.join('|')})`, 'gi');
        processed = processed.replace(compatRegex, (match) => {
            const id = `##COMP${Math.random().toString(36).substr(2, 7)}##`;
            protectMap.set(id, match);
            return id;
        });

        // 3. 执行品牌词清理
        const brandRegex = new RegExp(`\\b(${brands.join('|')})\\b`, 'gi');
        processed = processed.replace(brandRegex, "");

        // 4. 还原所有保护内容
        protectMap.forEach((val, id) => {
            processed = processed.replace(id, val);
        });

        return processed.replace(/\s+/g, ' ').trim();
    }

    // --- AI 核心：标准 API 请求适配器 ---
    async function callAiApi(content) {
        const providerConfigs = {
            deepseek: { url: 'https://api.deepseek.com/v1/chat/completions' },
            openrouter: { url: 'https://openrouter.ai/api/v1/chat/completions' },
            openai: { url: 'https://api.openai.com/v1/chat/completions' }
        };

        const targetUrl = providerConfigs[config.apiProvider].url;
        const systemPrompt = "你是一个亚马逊 Listing 合规专家。请清洗文案中的违规品牌词，但务必保留兼容性描述（如 for XXX）。直接输出清洗后的文本，保留原有 HTML 标签，不要多余解释。";

        try {
            const response = await fetch(targetUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${config.apiKey}`,
                    'HTTP-Referer': 'https://github.com/ShawnHo/AmazonTools', // OpenRouter 必要
                },
                body: JSON.stringify({
                    model: config.apiModel,
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: `请清洗以下文案：\n\n${content}` }
                    ],
                    temperature: 0.3
                })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error.message || "API 报错");
            return data.choices[0].message.content;
        } catch (err) {
            console.error(err);
            throw err;
        }
    }

    // --- 界面交互 ---
    async function execClean(mode) {
        const input = document.getElementById('textInput').value.trim();
        const outBox = document.getElementById('textOutput');
        if (!input || isProcessing) return;

        if (mode === 'rule') {
            outBox.innerText = advancedRuleClean(input);
        } else {
            setAiLoading(true);
            try {
                const result = await callAiApi(input);
                outBox.innerHTML = `<div class="ai-badge">${config.apiModel}</div>${result}`;
            } catch (e) {
                outBox.innerHTML = `<span style="color:var(--apple-red)">❌ 错误: ${e.message}</span>`;
            } finally {
                setAiLoading(false);
            }
        }
    }

    function setAiLoading(loading) {
        isProcessing = loading;
        const btn = document.getElementById('btnAiExec');
        const text = document.getElementById('aiBtnText');
        btn.disabled = loading;
        text.innerHTML = loading ? `<div class="spinner"></div> 正在思考...` : `🤖 AI 深度清理`;
    }

    // --- Excel 处理保持原有高效结构 ---
    function handleExcel(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const wb = XLSX.read(e.target.result, {type: 'binary'});
            rawData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            renderTable();
        };
        reader.readAsBinaryString(file);
    }

    function renderTable() {
        if(!rawData.length) return;
        const keys = Object.keys(rawData[0]);
        document.getElementById('tHead').innerHTML = keys.map(k => `<th>${k}</th>`).join('');
        document.getElementById('tBody').innerHTML = rawData.slice(0, 15).map(row => 
            `<tr>${keys.map(k => `<td style="padding:10px; border-bottom:1px solid #eee;">${String(row[k] || '').substring(0, 40)}...</td>`).join('')}</tr>`
        ).join('');
        document.getElementById('btnTableExec').disabled = false;
        document.getElementById('batchCount').innerText = `(解析成功: ${rawData.length} 行)`;
    }

    function execTableClean() {
        rawData = rawData.map(row => {
            const newRow = {...row};
            for(let k in newRow) if(typeof newRow[k] === 'string') newRow[k] = advancedRuleClean(newRow[k]);
            return newRow;
        });
        document.getElementById('btnExport').disabled = false;
        alert("批量规则清洗已完成！(AI 批量因成本较高需单独开发流水线)");
    }

    function exportRes() {
        const ws = XLSX.utils.json_to_sheet(rawData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Cleaned");
        XLSX.writeFile(wb, `Cleaned_Listing_${new Date().toLocaleDateString()}.xlsx`);
    }

    function openModal() { document.getElementById('modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function clearAll() { document.getElementById('textInput').value = ""; document.getElementById('textOutput').innerHTML = "等待指令..."; }
    function toggleProvider() {
        const p = document.getElementById('apiProvider').value;
        const modelInput = document.getElementById('apiModel');
        if(p === 'deepseek') modelInput.value = 'deepseek-chat';
        if(p === 'openai') modelInput.value = 'gpt-4o-mini';
        if(p === 'openrouter') modelInput.value = 'google/gemini-2.0-flash-001';
    }
</script>
</body>
</html>
