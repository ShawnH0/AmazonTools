<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Amazon 品牌清理 Pro - 卖家工具箱</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-blue: #0066cc;
            --apple-red: #ff3b30;
            --apple-green: #34c759;
            --apple-card: rgba(255, 255, 255, 0.8);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--apple-bg);
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 统一导航栏 - 锁定主页Logo风格 */
        .nav-header {
            height: 52px; background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; border-bottom: 1px solid rgba(0,0,0,0.05); z-index: 100;
        }

        .home-logo {
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; background: #fff; border: 1px solid #e5e5e7;
            color: #1d1d1f; text-decoration: none; transition: 0.2s;
        }
        .home-logo:hover { transform: scale(1.05); }

        /* 右上角配置状态按钮 */
        .config-trigger {
            padding: 6px 14px; border-radius: 18px; font-size: 13px; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
            transition: 0.3s; border: none; outline: none;
        }
        .status-off { background: rgba(255, 59, 48, 0.1); color: var(--apple-red); }
        .status-on { background: rgba(52, 199, 89, 0.1); color: var(--apple-green); }

        .container { max-width: 1440px; margin: 0 auto; width: 95%; flex: 1; display: flex; flex-direction: column; padding: 20px 0; overflow: hidden; }

        /* 工作区卡片 */
        .workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; flex: 1; overflow: hidden; }
        .panel { 
            background: #ffffff; border-radius: 20px; padding: 24px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* 输入区样式 */
        .section-title { font-size: 17px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        textarea {
            width: 100%; padding: 12px; border-radius: 14px; border: 1px solid #d2d2d7;
            font-size: 13px; line-height: 1.5; resize: none; box-sizing: border-box;
            background: #fafafa; transition: 0.2s;
        }
        textarea:focus { border-color: var(--apple-blue); background: #fff; outline: none; }

        .display-area { 
            flex: 1; margin-top: 15px; padding: 15px; background: #f5f5f7; 
            border-radius: 14px; font-size: 13px; color: #1d1d1f; 
            overflow-y: auto; white-space: pre-wrap; border: 1px dashed #d2d2d7;
        }

        /* 苹果风格按钮组 */
        .toolbar { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn {
            padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500;
            border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .btn-blue { background: var(--apple-blue); color: #fff; }
        .btn-gray { background: #f5f5f7; color: #1d1d1f; }
        .btn-gray:hover { background: #e8e8ed; }
        .btn-red-dim { background: rgba(255, 59, 48, 0.1); color: var(--apple-red); }

        /* 表格苹果化 */
        .table-wrap { flex: 1; overflow: auto; border: 1px solid #f2f2f2; border-radius: 14px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { background: rgba(250,250,252,0.8); padding: 12px; text-align: left; color: #86868b; position: sticky; top: 0; backdrop-filter: blur(5px); }
        td { padding: 12px; border-bottom: 1px solid #f2f2f2; }

        /* 配置弹窗 */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.1); backdrop-filter: blur(15px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-card {
            background: #fff; width: 500px; border-radius: 28px; padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .modal-tabs { display: flex; gap: 20px; border-bottom: 1px solid #f2f2f2; margin-bottom: 20px; }
        .tab-item { padding-bottom: 10px; cursor: pointer; font-size: 14px; color: #86868b; }
        .tab-item.active { color: var(--apple-blue); border-bottom: 2px solid var(--apple-blue); font-weight: 600; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; font-weight: 600; color: #86868b; margin-bottom: 6px; }
        .modal-input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #d2d2d7; box-sizing: border-box; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
        .shake { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body>

<div class="nav-header">
    <a href="index.html" class="home-logo" title="返回首页">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </a>
    <div style="font-weight: 600;">品牌清理 & 合规助手 Pro</div>
    <button id="mainConfigBtn" class="config-trigger status-off" onclick="openModal()">
        <span id="configText">系统配置未就绪</span>
    </button>
</div>

<div class="container">
    <div class="workspace">
        <div class="panel">
            <div class="section-title">📝 单段文案清理</div>
            <textarea id="textInput" style="height: 120px;" placeholder="粘贴 Listing 描述..."></textarea>
            <div class="toolbar" style="margin-top:15px;">
                <button class="btn btn-blue" onclick="handleClean('rule')">⚡ 词库清理</button>
                <button class="btn btn-blue" style="background: #722ed1" onclick="handleClean('ai')">🤖 AI 清理</button>
                <button class="btn btn-gray" onclick="clearText()">清除</button>
            </div>
            <div id="textOutput" class="display-area">清洗结果将在此显示...</div>
        </div>

        <div class="panel">
            <div class="section-title">📊 批量表格处理</div>
            <div class="toolbar">
                <button class="btn btn-gray" onclick="document.getElementById('fileIn').click()">📤 上传 Excel</button>
                <button class="btn btn-blue" id="tableBtn" disabled onclick="runTableClean()">🚀 执行批量清理</button>
                <button class="btn btn-gray" style="color:var(--apple-green)" id="exportBtn" disabled onclick="exportExcel()">💾 导出</button>
                <button class="btn btn-red-dim" onclick="clearTable()">🧹</button>
                <input type="file" id="fileIn" hidden onchange="handleExcel(this.files[0])">
            </div>
            <div class="table-wrap">
                <table id="dataTable"><thead id="tHead"></thead><tbody id="tBody"></tbody></table>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <div style="font-weight: 600; font-size: 19px;">系统配置</div>
            <div style="cursor:pointer; color:#86868b" onclick="closeModal()">✕</div>
        </div>
        
        <div class="modal-tabs">
            <div class="tab-item active" id="tab-gh" onclick="switchTab('gh')">GitHub 同步</div>
            <div class="tab-item" id="tab-ai" onclick="switchTab('ai')">AI 接口设置</div>
        </div>

        <div id="content-gh">
            <div class="input-group">
                <label>GITHUB TOKEN</label>
                <input type="password" id="ghToken" class="modal-input" placeholder="ghp_xxxx">
            </div>
            <div class="input-group">
                <label>仓库路径 (USER/REPO)</label>
                <input type="text" id="ghRepo" class="modal-input" placeholder="ShawnHo/Amazon-Repo">
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="input-group"><label>品牌词库</label><textarea id="brandWords" style="height:60px; font-size:11px;"></textarea></div>
                <div class="input-group"><label>违禁词库</label><textarea id="restrictedWords" style="height:60px; font-size:11px;"></textarea></div>
            </div>
            <button class="btn btn-blue" style="width:100%; justify-content:center; margin-top:10px;" onclick="syncCloud()">🔄 同步词库</button>
        </div>

        <div id="content-ai" style="display:none;">
            <div class="input-group">
                <label>接口地址</label>
                <select id="apiHost" class="modal-input">
                    <option value="https://api.deepseek.com">DeepSeek</option>
                    <option value="https://api.openai.com/v1">OpenAI</option>
                    <option value="https://api.google.com/gemini">Gemini</option>
                </select>
            </div>
            <div class="input-group">
                <label>API KEY</label>
                <input type="password" id="apiKey" class="modal-input" placeholder="sk-xxxx">
            </div>
            <div class="input-group">
                <label>SYSTEM PROMPT</label>
                <textarea id="aiPrompt" style="height:80px; font-size:11px;">剔除品牌词，保留 for/compatible with 后面的词...</textarea>
            </div>
        </div>

        <button class="btn btn-blue" style="width:100%; justify-content:center; margin-top:20px;" onclick="saveAllAndClose()">保存全部配置</button>
    </div>
</div>

<script>
    let rawData = [];
    
    // 弹窗切换逻辑
    function openModal() { document.getElementById('modalOverlay').style.display = 'flex'; }
    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
    function switchTab(type) {
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + type).classList.add('active');
        document.getElementById('content-gh').style.display = type === 'gh' ? 'block' : 'none';
        document.getElementById('content-ai').style.display = type === 'ai' ? 'block' : 'none';
    }

    function saveAllAndClose() {
        const ghKey = document.getElementById('ghToken').value;
        const aiKey = document.getElementById('apiKey').value;
        
        // 更新顶部按钮状态
        const btn = document.getElementById('mainConfigBtn');
        const text = document.getElementById('configText');
        
        if(ghKey && aiKey) {
            btn.className = "config-trigger status-on";
            text.innerText = "系统配置已就绪";
        } else {
            btn.className = "config-trigger status-off";
            text.innerText = "配置不完整";
        }

        // 保存到本地
        ['ghToken','ghRepo','apiHost','apiKey','aiPrompt','brandWords','restrictedWords'].forEach(id => {
            localStorage.setItem('sh_clean_save_' + id, document.getElementById(id).value);
        });
        closeModal();
    }

    function handleClean(mode) {
        if(mode === 'ai' && !document.getElementById('apiKey').value) {
            const btn = document.getElementById('mainConfigBtn');
            btn.classList.add('shake');
            setTimeout(() => btn.classList.remove('shake'), 400);
            alert('请先配置 AI API Key');
            return;
        }
        // 调用原有的 cleanLogic 或 API 调用...
        const input = document.getElementById('textInput').value;
        document.getElementById('textOutput').innerText = "正在清理：" + input; 
    }

    // 初始化加载
    window.onload = () => {
        ['ghToken','ghRepo','apiHost','apiKey','aiPrompt','brandWords','restrictedWords'].forEach(id => {
            const val = localStorage.getItem('sh_clean_save_' + id);
            if(val) document.getElementById(id).value = val;
        });
        if(document.getElementById('ghToken').value && document.getElementById('apiKey').value) {
            saveAllAndClose();
        }
    };

    // 其他 Excel 处理逻辑保持不变...
    function handleExcel(file) { /* ... 原有代码 ... */ }
    function runTableClean() { /* ... 原有代码 ... */ }
    function exportExcel() { /* ... 原有代码 ... */ }
    function clearText() { document.getElementById('textInput').value = ""; document.getElementById('textOutput').innerText = ""; }
    function clearTable() { rawData = []; document.getElementById('tBody').innerHTML=""; }
</script>
</body>
</html>
