<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Baned Brand Filter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --apple-bg: #f5f5f7; 
            --apple-blue: #0066cc; 
            --apple-gray: #86868b;
            --apple-border: rgba(0,0,0,0.1);
        }

        body {
            /* 统一全页面 Apple 官网风格字体 */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Myriad Set Pro", "SF Pro Icons", "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--apple-bg); 
            margin: 0; 
            height: 100vh;
            display: flex; 
            flex-direction: column; 
            color: #1d1d1f;
            -webkit-font-smoothing: antialiased;
        }

        /* 顶部导航栏优化 */
        .nav-header {
            height: 48px; 
            background: rgba(251, 251, 253, 0.8);
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 0 10%; 
            border-bottom: 1px solid var(--apple-border); 
            z-index: 100;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #1d1d1f;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: -0.01em;
            transition: opacity 0.2s;
        }
        .nav-brand:hover { opacity: 0.7; }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .capability-tags { display: flex; gap: 8px; }
        .cap-tag { 
            font-size: 11px; padding: 2px 8px; border-radius: 4px; 
            border: 1px solid #d2d2d7; color: var(--apple-gray); font-weight: 500;
        }
        .cap-tag.active { border-color: #34c759; color: #34c759; background: rgba(52, 199, 89, 0.05); }

        /* 面板设计 */
        .container { max-width: 1200px; margin: 0 auto; width: 92%; flex: 1; display: flex; flex-direction: column; padding: 30px 0; overflow: hidden; }
        .workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; flex: 1; overflow: hidden; }
        
        .panel { 
            background: #fff; border-radius: 18px; padding: 24px; 
            display: flex; flex-direction: column; overflow: hidden; 
            border: 1px solid var(--apple-border);
        }

        .section-title { font-size: 19px; font-weight: 600; margin-bottom: 20px; letter-spacing: -0.02em; }
        
        textarea {
            width: 100%; border-radius: 12px; border: 1px solid #d2d2d7;
            font-family: inherit; font-size: 14px; line-height: 1.5; padding: 12px; box-sizing: border-box;
            background: #fff; outline: none; transition: border-color 0.3s; resize: none;
        }
        textarea:focus { border-color: var(--apple-blue); }

        .display-area { 
            flex: 1; margin-top: 16px; padding: 16px; background: #fbfbfd; 
            border-radius: 12px; font-size: 14px; overflow-y: auto;
            border: 1px solid var(--apple-border); color: #1d1d1f; line-height: 1.6;
        }

        .btn {
            padding: 8px 16px; border-radius: 18px; font-size: 12px; font-weight: 400;
            border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .btn-blue { background: var(--apple-blue); color: #fff; }
        .btn-blue:hover { background: #0071e3; }
        .btn-gray { background: #e8e8ed; color: #1d1d1f; }
        .btn-gray:hover { background: #d2d2d7; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.2); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-card { background: #fff; width: 500px; border-radius: 20px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="nav-header">
    <a href="index.html" class="nav-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Shawn's Listing Pro
    </a>

    <div class="nav-right">
        <div class="capability-tags">
            <span id="tag-gh" class="cap-tag">GitHub 同步</span>
            <span id="tag-ai" class="cap-tag">AI 清洗</span>
        </div>
        <button class="btn btn-gray" style="border-radius: 12px;" onclick="openModal()">设置</button>
    </div>
</div>

<div class="container">
    <div class="workspace">
        <div class="panel">
            <div class="section-title">单段文案清洗</div>
            <textarea id="textInput" style="height: 160px;" placeholder="在此粘贴原始描述..."></textarea>
            <div style="display:flex; gap:10px; margin-top:16px;">
                <button class="btn btn-blue" onclick="execClean('ai')">AI 深度清理</button>
                <button class="btn btn-gray" onclick="clearAll()">重置</button>
            </div>
            <div id="textOutput" class="display-area">等待指令...</div>
        </div>

        <div class="panel">
            <div class="section-title">批量 Excel 处理</div>
            <div style="display:flex; gap:10px; margin-bottom:16px;">
                <button class="btn btn-gray" onclick="document.getElementById('fIn').click()">上传表格</button>
                <button class="btn btn-blue" id="btnExport" disabled onclick="exportRes()">导出结果</button>
                <input type="file" id="fIn" hidden onchange="handleExcel(this.files[0])">
            </div>
            <div style="flex:1; overflow:auto; border:1px solid var(--apple-border); border-radius:12px;">
                <table id="dataTable" style="width:100%; font-size:12px; border-collapse:collapse; text-align: left;">
                    <thead style="background:#f5f5f7;"><tr id="tHead"></tr></thead>
                    <tbody id="tBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // 优化 2: 解决首尾剔除不统一的问题
    const DEFAULT_PROMPT = `You are an Amazon Compliance Expert. 
STRICT RULE:
1. REMOVE any brand names that appear alone, including at the VERY BEGINNING and the VERY END of the text.
2. KEEP brands ONLY if they are part of a compatibility phrase (e.g., "for [Brand]", "compatible with [Brand]").
3. "Nikon Camera" -> "Camera", "Sony TV" -> "TV". Even if "Nikon" is the first word or "TV" is the last word.
4. Output ONLY the cleaned text. No conversational filler. No Chinese.`;

    // ... 其余 JavaScript 逻辑 (execClean, handleExcel 等) 保持 v5 的补刀逻辑 ...
    // 特别是 localRuleClean 函数中，确保正则使用了 ^ 和 $ 来处理首尾。
    function localRuleClean(text) {
        let brands = (localStorage.getItem('sh_cloud_v5_customBrands') || "").split(/[,，]/).map(s => s.trim()).filter(s => s.length > 1);
        if (!brands.length) return text;
        
        // 使用 (^|\b) 确保匹配开头，$ 确保匹配结尾
        let brandRegex = new RegExp(`(^|\\b)(${brands.join('|')})(\\b|$)`, 'gi');
        return text.replace(brandRegex, "").replace(/\s+/g, ' ').trim();
    }
    
    // 省略部分重复的 API 调用代码以适应展示...
</script>
</body>
</html>
