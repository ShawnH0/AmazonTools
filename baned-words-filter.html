<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Amazon 品牌清理 Pro - Shawn's Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --apple-bg: #f5f5f7; --apple-blue: #0066cc; --apple-red: #ff3b30;
            --apple-green: #34c759; --apple-purple: #722ed1; --apple-gray: #86868b;
        }

        body {
            font-family: 'Inter', -apple-system, "PingFang SC", sans-serif;
            background-color: var(--apple-bg); margin: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden; color: #1d1d1f;
        }

        /* 顶部导航 */
        .nav-header {
            height: 56px; background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; border-bottom: 1px solid rgba(0,0,0,0.08); z-index: 100;
        }

        .capability-tags { display: flex; gap: 10px; }
        .cap-tag { 
            font-size: 11px; padding: 3px 10px; border-radius: 6px; 
            border: 1px solid #e5e5e7; color: var(--apple-gray); font-weight: 500;
        }
        .cap-tag.active { border-color: var(--apple-green); color: var(--apple-green); background: rgba(52, 199, 89, 0.08); }

        .container { max-width: 1400px; margin: 0 auto; width: 96%; flex: 1; display: flex; flex-direction: column; padding: 20px 0; overflow: hidden; }
        .workspace { display: grid; grid-template-columns: 1fr 1.2fr; gap: 24px; flex: 1; overflow: hidden; }
        
        .panel { 
            background: #fff; border-radius: 24px; padding: 24px; 
            display: flex; flex-direction: column; overflow: hidden; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.02);
        }

        .section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
        
        textarea {
            width: 100%; border-radius: 14px; border: 1px solid #d2d2d7;
            font-size: 14px; line-height: 1.6; padding: 15px; box-sizing: border-box;
            background: #fbfbfd; outline: none; transition: 0.2s; resize: none;
        }
        textarea:focus { border-color: var(--apple-blue); background: #fff; box-shadow: 0 0 0 4px rgba(0,102,204,0.1); }

        .display-area { 
            flex: 1; margin-top: 16px; padding: 18px; background: #f5f5f7; 
            border-radius: 14px; font-size: 14px; overflow-y: auto; white-space: pre-wrap;
            border: 1px solid #e5e5e7; position: relative; color: #333;
        }

        .ai-badge {
            position: absolute; top: 12px; right: 12px; font-size: 10px;
            background: var(--apple-purple); color: white; padding: 3px 8px; border-radius: 6px;
            font-weight: 600;
        }

        .btn {
            padding: 10px 18px; border-radius: 20px; font-size: 13px; font-weight: 500;
            border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .btn-blue { background: var(--apple-blue); color: #fff; }
        .btn-purple { background: var(--apple-purple); color: #fff; }
        .btn-gray { background: #f2f2f7; color: #1d1d1f; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* 配置弹窗增强 */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(12px); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-card { background: #fff; width: 600px; border-radius: 30px; padding: 32px; box-shadow: 0 30px 60px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
        
        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-size: 11px; font-weight: 700; color: var(--apple-gray); margin-bottom: 6px; text-transform: uppercase; }
        .modal-input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #d2d2d7; box-sizing: border-box; font-size: 13px; }

        .sync-box { 
            background: #f5f5f7; padding: 15px; border-radius: 15px; margin-top: 10px;
            border: 1px dashed #d2d2d7;
        }

        /* 动画 */
        .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="nav-header">
    <div style="display:flex; align-items:center; gap:18px;">
        <div style="background:var(--apple-blue); color:white; width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:800;">S</div>
        <span style="font-weight:700; font-size:18px; letter-spacing:-0.5px;">CleanListing Pro</span>
        <div class="capability-tags">
            <span id="tag-gh" class="cap-tag">GitHub 云同步</span>
            <span id="tag-ai" class="cap-tag">AI 清洗</span>
        </div>
    </div>
    <button class="btn btn-gray" onclick="openModal()">⚙️ 设置中心</button>
</div>

<div class="container">
    <div class="workspace">
        <div class="panel">
            <div class="section-title">单段文案清洗</div>
            <textarea id="textInput" style="height: 180px;" placeholder="在此粘贴 Amazon Listing 原始描述..."></textarea>
            <div style="display:flex; gap:12px; margin-top:16px;">
                <button class="btn btn-blue" onclick="execClean('rule')">⚡ 规则清洗</button>
                <button class="btn btn-purple" id="btnAiExec" onclick="execClean('ai')">
                    <span id="aiBtnText">🤖 AI 深度清理</span>
                </button>
                <button class="btn btn-gray" onclick="clearAll()">重置</button>
            </div>
            <div id="textOutput" class="display-area">等待指令...</div>
        </div>

        <div class="panel">
            <div class="section-title">
                批量 Excel 处理
                <span id="batchCount" style="font-weight:400; font-size:12px; color:var(--apple-gray)"></span>
            </div>
            <div style="display:flex; gap:12px; margin-bottom:16px;">
                <button class="btn btn-gray" onclick="document.getElementById('fIn').click()">📤 上传表格</button>
                <button class="btn btn-blue" id="btnTableExec" disabled onclick="execTableClean()">执行批量清洗</button>
                <button class="btn btn-gray" id="btnExport" disabled onclick="exportRes()">💾 导出</button>
                <input type="file" id="fIn" hidden onchange="handleExcel(this.files[0])">
            </div>
            <div style="flex:1; overflow:auto; border:1px solid rgba(0,0,0,0.05); border-radius:14px;">
                <table id="dataTable" style="width:100%; font-size:12px; border-collapse:collapse;">
                    <thead style="background:#f5f5f7; position:sticky; top:0;"><tr id="tHead"></tr></thead>
                    <tbody id="tBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal-card">
        <h2>系统配置管理</h2>
        
        <div class="config-grid">
            <div>
                <label style="font-size:12px; color:var(--apple-blue)">● AI 深度模型配置</label>
                <div class="input-group">
                    <label>供应商</label>
                    <select id="apiProvider" class="modal-input" onchange="toggleProvider()">
                        <option value="deepseek">DeepSeek</option>
                        <option value="openrouter">OpenRouter</option>
                        <option value="openai">OpenAI</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>API Key</label>
                    <input type="password" id="apiKey" class="modal-input">
                </div>
                <div class="input-group">
                    <label>模型名称</label>
                    <input type="text" id="apiModel" class="modal-input">
                </div>
            </div>

            <div>
                <label style="font-size:12px; color:var(--apple-purple)">● GitHub 词库同步</label>
                <div class="input-group">
                    <label>GitHub Token (Repo 权限)</label>
                    <input type="password" id="ghToken" class="modal-input" placeholder="ghp_xxx">
                </div>
                <div class="input-group">
                    <label>仓库路径 (User/Repo)</label>
                    <input type="text" id="ghRepo" class="modal-input" placeholder="ShawnHo/AmazonTools">
                </div>
                <div class="input-group">
                    <label>文件路径</label>
                    <input type="text" id="ghPath" class="modal-input" placeholder="data/brands.json">
                </div>
            </div>
        </div>

        <div class="input-group">
            <label>当前词库内容 (对应 GitHub brands 字段)</label>
            <textarea id="customBrands" class="modal-input" style="height:80px;" placeholder="Apple, Sony, Nike..."></textarea>
        </div>

        <div class="sync-box">
            <div style="display:flex; gap:10px;">
                <button class="btn btn-purple" style="flex:1; justify-content:center;" id="btnDownload" onclick="syncCloud('download')">📥 从云端下载词库</button>
                <button class="btn btn-gray" style="flex:1; justify-content:center;" id="btnUpload" onclick="syncCloud('upload')">📤 上传至云端仓库</button>
            </div>
            <p style="font-size:10px; color:var(--apple-gray); margin-top:8px; text-align:center;">* 上传将覆盖 GitHub 上的文件，请谨慎操作</p>
        </div>

        <div style="display:flex; gap:12px; margin-top:24px;">
            <button class="btn btn-blue" style="flex:1; justify-content:center; height:44px;" onclick="saveConfig()">保存并应用本地配置</button>
            <button class="btn btn-gray" onclick="closeModal()">取消</button>
        </div>
    </div>
</div>

<script>
    let rawData = [];
    let config = {};
    let isProcessing = false;
    let ghFileSha = ""; // GitHub 要求的文校验码

    window.onload = () => { loadConfig(); refreshCapabilityUI(); };

    function loadConfig() {
        ['apiKey', 'apiProvider', 'apiModel', 'customBrands', 'ghToken', 'ghRepo', 'ghPath'].forEach(f => {
            config[f] = localStorage.getItem('sh_cloud_' + f) || '';
            document.getElementById(f).value = config[f];
        });
        if(!config.ghPath) document.getElementById('ghPath').value = 'data/brands.json';
    }

    function saveConfig() {
        ['apiKey', 'apiProvider', 'apiModel', 'customBrands', 'ghToken', 'ghRepo', 'ghPath'].forEach(f => {
            const val = document.getElementById(f).value.trim();
            localStorage.setItem('sh_cloud_' + f, val);
            config[f] = val;
        });
        refreshCapabilityUI();
        closeModal();
    }

    function refreshCapabilityUI() {
        const hasGH = config.ghToken && config.ghRepo;
        const hasAI = config.apiKey.length > 10;
        document.getElementById('tag-gh').className = hasGH ? 'cap-tag active' : 'cap-tag';
        document.getElementById('tag-ai').className = hasAI ? 'cap-tag active' : 'cap-tag';
    }

    // --- GitHub 云同步逻辑 ---
    async function syncCloud(mode) {
        if(!config.ghToken || !config.ghRepo) return alert("请先配置 GitHub Token 和 仓库路径");
        const btn = mode === 'download' ? document.getElementById('btnDownload') : document.getElementById('btnUpload');
        const originalText = btn.innerText;
        btn.innerHTML = `<div class="spinner"></div> 处理中...`;

        const url = `https://api.github.com/repos/${config.ghRepo}/contents/${config.ghPath}`;
        const headers = { 'Authorization': `token ${config.ghToken}`, 'Content-Type': 'application/json' };

        try {
            if(mode === 'download') {
                const res = await fetch(url, { headers });
                if(!res.ok) throw new Error("文件不存在或权限错误");
                const data = await res.json();
                ghFileSha = data.sha; // 记录 SHA 供以后上传使用
                const content = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                document.getElementById('customBrands').value = content.brands.join(', ');
                alert("✅ 词库已从云端同步至本地");
            } else {
                // 上传前先获取最新的 SHA (GitHub 强制要求)
                const getRes = await fetch(url, { headers });
                if(getRes.ok) { const d = await getRes.json(); ghFileSha = d.sha; }

                const brandsArr = document.getElementById('customBrands').value.split(/[,，]/).map(s => s.trim()).filter(s => s);
                const fileBody = {
                    message: "Update brands library via CleanListing Pro",
                    content: btoa(unescape(encodeURIComponent(JSON.stringify({ brands: brandsArr, updated: new Date().toISOString() })))),
                    sha: ghFileSha
                };
                const putRes = await fetch(url, { method: 'PUT', headers, body: JSON.stringify(fileBody) });
                if(!putRes.ok) throw new Error("同步失败");
                alert("✅ 词库已成功推送至 GitHub 仓库");
            }
        } catch(e) {
            alert("❌ 操作失败: " + e.message);
        } finally {
            btn.innerText = originalText;
        }
    }

    // --- 核心清洗算法 ---
    function advancedRuleClean(text) {
        if (!text) return "";
        let brands = config.customBrands.split(/[,，]/).map(s => s.trim()).filter(s => s.length > 1);
        if (brands.length === 0) return text;
        let processed = text;
        const protectMap = new Map();
        processed = processed.replace(/<[^>]+>/g, (m) => {
            const id = `##T${Math.random().toString(36).substr(2, 5)}##`;
            protectMap.set(id, m); return id;
        });
        const compatRegex = new RegExp(`(compatible\\s+with|for|fits|replacement\\s+for)\\s+(${brands.join('|')})`, 'gi');
        processed = processed.replace(compatRegex, (m) => {
            const id = `##C${Math.random().toString(36).substr(2, 5)}##`;
            protectMap.set(id, m); return id;
        });
        const brandRegex = new RegExp(`\\b(${brands.join('|')})\\b`, 'gi');
        processed = processed.replace(brandRegex, "").replace(id, v => protectMap.get(id));
        protectMap.forEach((v, id) => processed = processed.replace(id, v));
        return processed.replace(/\s+/g, ' ').trim();
    }

    // --- AI 逻辑 ---
    async function execClean(mode) {
        const input = document.getElementById('textInput').value.trim();
        const outBox = document.getElementById('textOutput');
        if (!input || isProcessing) return;
        if (mode === 'rule') { outBox.innerText = advancedRuleClean(input); } 
        else {
            setAiLoading(true);
            try {
                const url = config.apiProvider === 'deepseek' ? 'https://api.deepseek.com/v1/chat/completions' : 
                            config.apiProvider === 'openrouter' ? 'https://openrouter.ai/api/v1/chat/completions' : 'https://api.openai.com/v1/chat/completions';
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.apiKey}` },
                    body: JSON.stringify({
                        model: config.apiModel,
                        messages: [{role:"system", content:"亚马逊Listing清理专家，剔除违规品牌词但保留兼容性描述。直接输出结果。"}, {role:"user", content:input}]
                    })
                });
                const data = await response.json();
                outBox.innerHTML = `<div class="ai-badge">${config.apiModel}</div>${data.choices[0].message.content}`;
            } catch (e) { outBox.innerHTML = `❌ 错误: ${e.message}`; }
            finally { setAiLoading(false); }
        }
    }

    function setAiLoading(l) {
        isProcessing = l;
        document.getElementById('btnAiExec').disabled = l;
        document.getElementById('aiBtnText').innerHTML = l ? `<div class="spinner"></div> 思考中...` : `🤖 AI 深度清理`;
    }

    // --- Excel 基础功能 ---
    function handleExcel(f) {
        const r = new FileReader();
        r.onload = (e) => {
            const wb = XLSX.read(e.target.result, {type: 'binary'});
            rawData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            const keys = Object.keys(rawData[0]);
            document.getElementById('tHead').innerHTML = keys.map(k => `<th>${k}</th>`).join('');
            document.getElementById('tBody').innerHTML = rawData.slice(0, 10).map(row => `<tr>${keys.map(k => `<td>${String(row[k]).substring(0,30)}</td>`).join('')}</tr>`).join('');
            document.getElementById('btnTableExec').disabled = false;
        };
        r.readAsBinaryString(f);
    }

    function execTableClean() {
        rawData = rawData.map(row => {
            const nr = {...row};
            for(let k in nr) if(typeof nr[k] === 'string') nr[k] = advancedRuleClean(nr[k]);
            return nr;
        });
        document.getElementById('btnExport').disabled = false;
        alert("批量清洗完成！");
    }

    function exportRes() {
        const ws = XLSX.utils.json_to_sheet(rawData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Cleaned");
        XLSX.writeFile(wb, `Cleaned_${new Date().getTime()}.xlsx`);
    }

    function openModal() { document.getElementById('modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function clearAll() { document.getElementById('textInput').value = ""; document.getElementById('textOutput').innerHTML = ""; }
    function toggleProvider() {
        const p = document.getElementById('apiProvider').value;
        document.getElementById('apiModel').value = p === 'deepseek' ? 'deepseek-chat' : p === 'openai' ? 'gpt-4o-mini' : 'google/gemini-2.0-flash-001';
    }
</script>
</body>
</html>
