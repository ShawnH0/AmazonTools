<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Shawn's Listing Pro | Compliance Expert</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --apple-bg: #f5f5f7; --apple-blue: #0066cc; --apple-gray: #86868b;
            --apple-border: rgba(0,0,0,0.1); --apple-green: #34c759; --apple-red: #ff3b30;
        }

        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "SF Pro Text", sans-serif;
            background-color: var(--apple-bg); margin: 0; height: 100vh;
            display: flex; flex-direction: column; color: #1d1d1f; -webkit-font-smoothing: antialiased;
        }

        /* 顶部导航 */
        .nav-header {
            height: 48px; background: rgba(251, 251, 253, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center; padding: 0 5%; border-bottom: 1px solid var(--apple-border); z-index: 100;
        }
        .nav-brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: #1d1d1f; font-weight: 600; font-size: 14px; }
        .nav-right { display: flex; align-items: center; gap: 16px; }
        .capability-tags { display: flex; gap: 8px; }
        .cap-tag { font-size: 10px; padding: 2px 8px; border-radius: 4px; border: 1px solid #d2d2d7; color: var(--apple-gray); }
        .cap-tag.active { border-color: var(--apple-green); color: var(--apple-green); background: rgba(52,199,89,0.05); }

        /* 工作区 */
        .container { max-width: 1440px; margin: 0 auto; width: 94%; flex: 1; display: flex; flex-direction: column; padding: 20px 0; overflow: hidden; }
        .workspace { display: grid; grid-template-columns: 420px 1fr; gap: 20px; flex: 1; overflow: hidden; }
        .panel { background: #fff; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--apple-border); }
        .section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; }
        
        textarea { width: 100%; border-radius: 10px; border: 1px solid #d2d2d7; font-family: inherit; font-size: 14px; padding: 12px; resize: none; outline: none; transition: 0.2s; }
        textarea:focus { border-color: var(--apple-blue); }
        .display-area { flex: 1; margin-top: 12px; padding: 16px; background: #fbfbfd; border-radius: 10px; font-size: 14px; overflow-y: auto; border: 1px solid var(--apple-border); white-space: pre-wrap; position: relative; }

        /* 按钮系统 */
        .btn-group { display: flex; gap: 8px; margin-top: 12px; }
        .btn { padding: 6px 12px; border-radius: 10px; font-size: 12px; font-weight: 500; border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 4px; }
        .btn-blue { background: var(--apple-blue); color: #fff; }
        .btn-gray { background: #f2f2f7; color: #1d1d1f; }
        .btn-purple { background: #af52de; color: #fff; }
        .btn-red { background: rgba(255, 59, 48, 0.1); color: var(--apple-red); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 表格 */
        .table-wrap { flex: 1; overflow: auto; border: 1px solid var(--apple-border); border-radius: 10px; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th { background: #f5f5f7; padding: 10px; text-align: left; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--apple-border); }
        td { padding: 8px 10px; border-bottom: 1px solid #f2f2f7; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }

        /* 弹窗 */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.2); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-card { background: #fff; width: 580px; border-radius: 20px; padding: 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); position: relative; }
        .modal-close-x { position: absolute; top: 20px; right: 20px; cursor: pointer; color: var(--apple-gray); }
        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 15px 0; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 10px; color: var(--apple-gray); margin-bottom: 4px; font-weight: 600; }
        .modal-input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #d2d2d7; font-size: 12px; }
        .warning-text { font-size: 10px; color: var(--apple-red); margin-top: 4px; display: block; }
        
        .spinner { width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="nav-header">
    <a href="index.html" class="nav-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Shawn's Listing Pro
    </a>
    <div class="nav-right">
        <div class="capability-tags">
            <span id="tag-gh" class="cap-tag">GitHub 同步</span>
            <span id="tag-ai" class="cap-tag">AI 清洗</span>
        </div>
        <button class="btn btn-gray" onclick="openModal()">⚙️ 设置中心</button>
    </div>
</div>

<div class="container">
    <div class="workspace">
        <div class="panel">
            <div class="section-title">单段文案清洗</div>
            <textarea id="textInput" style="height: 150px;" placeholder="输入 Listing 描述..."></textarea>
            <div class="btn-group">
                <button class="btn btn-blue" onclick="execClean('rule')">⚡ 规则清洗</button>
                <button class="btn btn-purple" id="btnAiExec" onclick="execClean('ai')"><span id="aiBtnText">🤖 AI 深度清理</span></button>
                <button class="btn btn-gray" onclick="clearAll()">重置</button>
            </div>
            <div id="textOutput" class="display-area">等待指令...</div>
        </div>

        <div class="panel">
            <div class="section-title">
                批量 Excel 处理
                <div id="tableStatus" style="font-size: 10px; color: var(--apple-gray); font-weight: normal;"></div>
            </div>
            <div class="btn-group">
                <button class="btn btn-gray" onclick="document.getElementById('fIn').click()">📤 上传</button>
                <input type="file" id="fIn" hidden accept=".xlsx, .xls, .csv" onchange="handleExcel(this.files[0])">
                
                <button class="btn btn-blue" id="btnTableExec" disabled onclick="execTableClean()">开始清洗</button>
                <button class="btn btn-red" id="btnTableReset" disabled onclick="resetTableData()">撤销清洗</button>
                <button class="btn btn-gray" id="btnExport" disabled onclick="exportRes()">💾 导出</button>
            </div>
            <div class="table-wrap">
                <table id="mainTable"><thead id="tHead"></thead><tbody id="tBody"></tbody></table>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal-card">
        <div class="modal-close-x" onclick="closeModal()">✕</div>
        <div class="section-title">系统配置管理</div>
        <div class="config-grid">
            <div>
                <div class="input-group"><label>供应商</label>
                    <select id="apiProvider" class="modal-input" onchange="toggleProvider()">
                        <option value="deepseek">DeepSeek</option><option value="openrouter">OpenRouter</option><option value="openai">OpenAI</option>
                    </select>
                </div>
                <div class="input-group"><label>API Key</label><input type="password" id="apiKey" class="modal-input"></div>
                <div class="input-group"><label>模型名称</label><input type="text" id="apiModel" class="modal-input"></div>
            </div>
            <div>
                <div class="input-group">
                    <label>GitHub Token (⚠ 建议仅开放 contents:read/write)</label>
                    <input type="password" id="ghToken" class="modal-input">
                </div>
                <div class="input-group"><label>GitHub Repo (user/repo)</label><input type="text" id="ghRepo" class="modal-input"></div>
                <div class="input-group"><label>JSON Path</label><input type="text" id="ghPath" class="modal-input"></div>
            </div>
        </div>
        <div class="input-group">
            <label>禁售品牌词库 (逗号分隔)</label>
            <textarea id="customBrands" class="modal-input" style="height:50px;"></textarea>
        </div>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-purple" style="flex:1; justify-content:center;" onclick="syncCloud('upload')">📤 同步至云端</button>
            <button class="btn btn-gray" style="flex:1; justify-content:center;" onclick="syncCloud('download')">📥 从云端拉取</button>
        </div>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn btn-blue" style="flex:2; height:36px; justify-content:center;" onclick="saveConfig()">保存所有配置</button>
            <button class="btn btn-gray" style="flex:1; justify-content:center;" onclick="closeModal()">取消</button>
        </div>
    </div>
</div>

<script>
    const DEFAULT_PROMPT = `As an Amazon Compliance Expert:
1. REMOVE brand names ONLY if isolated.
2. KEEP brands in compatibility phrases like "for Brand", "compatible with Brand".
3. Check from start to end. Output ONLY cleaned text.`;

    let originalData = []; // 原始备份
    let processedData = []; // 运行数据
    let config = {}, isProcessing = false, ghFileSha = "";

    window.onload = () => { loadConfig(); refreshCapabilityUI(); };

    function loadConfig() {
        ['apiKey', 'apiProvider', 'apiModel', 'customBrands', 'ghToken', 'ghRepo', 'ghPath'].forEach(f => {
            config[f] = localStorage.getItem('sh_v8_' + f) || '';
            document.getElementById(f).value = config[f];
        });
    }

    function saveConfig() {
        ['apiKey', 'apiProvider', 'apiModel', 'customBrands', 'ghToken', 'ghRepo', 'ghPath'].forEach(f => {
            config[f] = document.getElementById(f).value.trim();
            localStorage.setItem('sh_v8_' + f, config[f]);
        });
        refreshCapabilityUI(); closeModal();
    }

    function refreshCapabilityUI() {
        document.getElementById('tag-gh').className = (config.ghToken && config.ghRepo) ? 'cap-tag active' : 'cap-tag';
        document.getElementById('tag-ai').className = config.apiKey.length > 5 ? 'cap-tag active' : 'cap-tag';
    }

    // --- 进化版三段式规则逻辑 ---
    function localRuleClean(text) {
        if (!text) return "";
        let brands = config.customBrands.split(/[,，]/).map(s => s.trim()).filter(s => s.length > 1);
        if (!brands.length) return text;

        // Phase 1: 标记保护短语 (防止 Nikon-compatible 被杀)
        const placeholder = " __PROTECT__ ";
        const protectRegex = new RegExp(`(for|compatible with|replacement for|fits)\\s+(${brands.join('|')})`, 'gi');
        let protectedText = text.replace(protectRegex, (m) => m.replace(/\s+/g, '_'));

        // Phase 2: 暴力剔除独立品牌词
        let brandRegex = new RegExp(`(^|\\b)(${brands.join('|')})(\\b|$)`, 'gi');
        let cleaned = protectedText.replace(brandRegex, "").replace(/\s+/g, ' ').trim();

        // Phase 3: 恢复保护短语并修格式
        return cleaned.replace(/_/g, ' ');
    }

    // --- AI 链路守卫版 ---
    async function execClean(mode) {
        const input = document.getElementById('textInput').value.trim();
        const outBox = document.getElementById('textOutput');
        if (!input || isProcessing) return;

        if (mode === 'rule') {
            outBox.innerText = localRuleClean(input);
        } else {
            if(!config.apiKey) return alert("配置 API Key");
            setAiLoading(true);
            try {
                const url = config.apiProvider === 'deepseek' ? 'https://api.deepseek.com/v1/chat/completions' : 
                            config.apiProvider === 'openrouter' ? 'https://openrouter.ai/api/v1/chat/completions' : 'https://api.openai.com/v1/chat/completions';
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.apiKey}` },
                    body: JSON.stringify({
                        model: config.apiModel,
                        messages: [{ role: "system", content: DEFAULT_PROMPT }, { role: "user", content: input }],
                        temperature: 0
                    })
                });

                const data = await response.json();
                
                // 链路检查：防止盲信 AI 返回
                if (!data.choices || !data.choices[0]?.message?.content) {
                    throw new Error(data.error?.message || "AI 返回异常，请检查 Key 或余额");
                }

                let aiResult = data.choices[0].message.content.replace(/^["']|["']$/g, '');
                outBox.innerHTML = `<div style="position:absolute;top:6px;right:6px;font-size:9px;background:#af52de;color:white;padding:2px 5px;border-radius:4px;">AI Result</div>${localRuleClean(aiResult)}`;
            } catch (e) { 
                outBox.innerHTML = `<span style="color:var(--apple-red)">⚠️ 调用失败: ${e.message}</span>`;
            } finally { setAiLoading(false); }
        }
    }

    // --- Excel 数据安全版 ---
    function handleExcel(f) {
        const r = new FileReader();
        r.onload = (e) => {
            const wb = XLSX.read(e.target.result, {type: 'binary'});
            const firstSheet = wb.Sheets[wb.SheetNames[0]];
            originalData = XLSX.utils.sheet_to_json(firstSheet);
            processedData = JSON.parse(JSON.stringify(originalData)); // 深拷贝备份
            
            renderTable(processedData);
            document.getElementById('btnTableExec').disabled = false;
            document.getElementById('tableStatus').innerText = `已载入 ${originalData.length} 行数据`;
        };
        r.readAsBinaryString(f);
    }

    function renderTable(data) {
        if(!data.length) return;
        const keys = Object.keys(data[0]);
        document.getElementById('tHead').innerHTML = `<tr>${keys.map(k => `<th>${k}</th>`).join('')}</tr>`;
        document.getElementById('tBody').innerHTML = data.slice(0, 15).map(row => 
            `<tr>${keys.map(k => `<td>${String(row[k] || '')}</td>`).join('')}</tr>`
        ).join('');
    }

    function execTableClean() {
        processedData = processedData.map(row => {
            const nr = {...row};
            for(let k in nr) if(typeof nr[k] === 'string') nr[k] = localRuleClean(nr[k]);
            return nr;
        });
        renderTable(processedData);
        document.getElementById('btnExport').disabled = false;
        document.getElementById('btnTableReset').disabled = false;
        document.getElementById('tableStatus').innerHTML = `<span style="color:var(--apple-green)">● 清洗完成（预览前15行）</span>`;
    }

    function resetTableData() {
        if(confirm("确定撤销所有清洗修改吗？")) {
            processedData = JSON.parse(JSON.stringify(originalData));
            renderTable(processedData);
            document.getElementById('btnExport').disabled = true;
            document.getElementById('btnTableReset').disabled = true;
            document.getElementById('tableStatus').innerText = "已重置原始数据";
        }
    }

    function exportRes() {
        const ws = XLSX.utils.json_to_sheet(processedData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Cleaned");
        XLSX.writeFile(wb, `Shawn_Cleaned_${new Date().getTime()}.xlsx`);
    }

    async function syncCloud(mode) {
        if(!config.ghToken || !config.ghRepo) return alert("配置 GitHub 信息");
        
        // 安全二次确认
        if(!confirm(`确定要执行 GitHub ${mode === 'upload' ? '上传覆盖' : '拉取覆盖'} 操作吗？`)) return;

        const url = `https://api.github.com/repos/${config.ghRepo}/contents/${config.ghPath}`;
        const headers = { 'Authorization': `token ${config.ghToken}`, 'Accept': 'application/vnd.github.v3+json' };
        
        try {
            const getRes = await fetch(url, { headers });
            if(getRes.ok) { const d = await getRes.json(); ghFileSha = d.sha; }

            if(mode === 'download') {
                const d = await (await fetch(url, { headers })).json();
                const content = JSON.parse(decodeURIComponent(escape(atob(d.content))));
                document.getElementById('customBrands').value = content.brands.join(', ');
                alert("下载成功");
            } else {
                const brandsArr = document.getElementById('customBrands').value.split(/[,，]/).map(s => s.trim()).filter(s => s);
                const body = {
                    message: "Cloud Sync v8",
                    content: btoa(unescape(encodeURIComponent(JSON.stringify({ brands: brandsArr, ts: Date.now() })))),
                    sha: ghFileSha
                };
                const putRes = await fetch(url, { method: 'PUT', headers, body: JSON.stringify(body) });
                if(!putRes.ok) throw new Error("写入失败，请检查 Token 权限");
                alert("云端同步成功！");
            }
        } catch(e) { alert("同步失败: " + e.message); }
    }

    function setAiLoading(l) {
        isProcessing = l;
        document.getElementById('btnAiExec').disabled = l;
        document.getElementById('aiBtnText').innerHTML = l ? `<div class="spinner"></div> 分析中...` : `🤖 AI 深度清理`;
    }

    function openModal() { document.getElementById('modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function clearAll() { document.getElementById('textInput').value = ""; document.getElementById('textOutput').innerText = ""; }
    function toggleProvider() {
        const p = document.getElementById('apiProvider').value;
        document.getElementById('apiModel').value = p === 'deepseek' ? 'deepseek-chat' : 'gpt-4o-mini';
    }
</script>
</body>
</html>
