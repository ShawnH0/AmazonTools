<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Amazon 品牌清理 Pro - 卖家工具箱</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-blue: #0066cc;
            --apple-red: #ff3b30;
            --apple-green: #34c759;
            --apple-card: rgba(255, 255, 255, 0.8);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--apple-bg);
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 顶部导航 */
        .nav-header {
            height: 52px; background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; border-bottom: 1px solid rgba(0,0,0,0.05); z-index: 100;
        }

        .home-logo {
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; background: #fff; border: 1px solid #e5e5e7;
            color: #1d1d1f; text-decoration: none; transition: 0.2s;
        }

        .config-trigger {
            padding: 6px 14px; border-radius: 18px; font-size: 13px; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
            transition: 0.3s; border: none;
        }
        .status-off { background: rgba(255, 59, 48, 0.1); color: var(--apple-red); }
        .status-on { background: rgba(52, 199, 89, 0.1); color: var(--apple-green); }

        .container { max-width: 1440px; margin: 0 auto; width: 95%; flex: 1; display: flex; flex-direction: column; padding: 20px 0; overflow: hidden; }

        /* 工作面板 */
        .workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; flex: 1; overflow: hidden; }
        .panel { 
            background: #ffffff; border-radius: 20px; padding: 24px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
            display: flex; flex-direction: column; overflow: hidden; position: relative;
        }

        /* 进度条样式 */
        .progress-container {
            position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: rgba(0,0,0,0.03); display: none;
        }
        .progress-bar {
            height: 100%; width: 0%; background: var(--apple-blue);
            transition: width 0.3s ease;
        }

        .section-title { font-size: 17px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        textarea {
            width: 100%; padding: 12px; border-radius: 14px; border: 1px solid #d2d2d7;
            font-size: 13px; line-height: 1.5; resize: none; box-sizing: border-box;
            background: #fafafa;
        }

        .display-area { 
            flex: 1; margin-top: 15px; padding: 15px; background: #f5f5f7; 
            border-radius: 14px; font-size: 13px; overflow-y: auto; white-space: pre-wrap;
            border: 1px dashed #d2d2d7;
        }

        .toolbar { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn {
            padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500;
            border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .btn-blue { background: var(--apple-blue); color: #fff; }
        .btn-gray { background: #f5f5f7; color: #1d1d1f; }
        .btn-red-dim { background: rgba(255, 59, 48, 0.1); color: var(--apple-red); }

        /* 表格容器 */
        .table-wrap { flex: 1; overflow: auto; border: 1px solid #f2f2f2; border-radius: 14px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { background: rgba(250,250,252,0.8); padding: 12px; text-align: left; position: sticky; top: 0; backdrop-filter: blur(5px); }
        td { padding: 12px; border-bottom: 1px solid #f2f2f2; }

        /* 配置弹窗 */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.2); backdrop-filter: blur(15px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-card {
            background: #fff; width: 520px; border-radius: 28px; padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .modal-tabs { display: flex; gap: 20px; border-bottom: 1px solid #f2f2f2; margin-bottom: 20px; }
        .tab-item { padding-bottom: 10px; cursor: pointer; font-size: 14px; color: #86868b; }
        .tab-item.active { color: var(--apple-blue); border-bottom: 2px solid var(--apple-blue); font-weight: 600; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; font-weight: 600; color: #86868b; margin-bottom: 6px; text-transform: uppercase; }
        .modal-input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #d2d2d7; box-sizing: border-box; }

        /* Toast 提示 */
        #toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 10px 20px; border-radius: 25px; background: rgba(0,0,0,0.8);
            color: white; font-size: 13px; z-index: 2000; display: none;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
    </style>
</head>
<body>

<div id="toast"></div>

<div class="nav-header">
    <a href="index.html" class="home-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </a>
    <div style="font-weight: 600;">品牌清理 & 合规助手 Pro</div>
    <button id="mainConfigBtn" class="config-trigger status-off" onclick="openModal()">
        <span id="configText">系统配置未就绪</span>
    </button>
</div>

<div class="container">
    <div class="workspace">
        <div class="panel" id="singlePanel">
            <div class="progress-container" id="singleProgress"><div class="progress-bar"></div></div>
            <div class="section-title">📝 单段文案清理</div>
            <textarea id="textInput" style="height: 120px;" placeholder="粘贴需要清洗的 Listing 描述..."></textarea>
            <div class="toolbar" style="margin-top:15px;">
                <button class="btn btn-blue" onclick="runSingleClean('rule')">⚡ 词库清理</button>
                <button class="btn btn-blue" style="background: #722ed1" onclick="runSingleClean('ai')">🤖 AI 深度清理</button>
                <button class="btn btn-gray" onclick="clearText()">清除</button>
            </div>
            <div id="textOutput" class="display-area">清洗结果将在此显示...</div>
        </div>

        <div class="panel" id="batchPanel">
            <div class="progress-container" id="batchProgress"><div class="progress-bar"></div></div>
            <div class="section-title">📊 批量表格处理</div>
            <div class="toolbar">
                <button class="btn btn-gray" onclick="document.getElementById('fileIn').click()">📤 上传 Excel</button>
                <button class="btn btn-blue" id="tableBtn" disabled onclick="runTableClean()">🚀 执行批量</button>
                <button class="btn btn-gray" style="color:var(--apple-green)" id="exportBtn" disabled onclick="exportExcel()">💾 导出</button>
                <button class="btn btn-red-dim" onclick="clearTable()">清空表格</button>
                <input type="file" id="fileIn" hidden onchange="handleExcel(this.files[0])">
            </div>
            <div class="table-wrap">
                <table id="dataTable"><thead id="tHead"></thead><tbody id="tBody"></tbody></table>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <div style="font-weight: 600; font-size: 19px;">系统配置</div>
            <div style="cursor:pointer; color:#86868b" onclick="closeModal()">✕</div>
        </div>
        
        <div class="modal-tabs">
            <div class="tab-item active" id="tab-gh" onclick="switchTab('gh')">GitHub 同步</div>
            <div class="tab-item" id="tab-ai" onclick="switchTab('ai')">AI 深度模型</div>
        </div>

        <div id="content-gh">
            <div class="input-group">
                <label>GITHUB TOKEN</label>
                <input type="password" id="ghToken" class="modal-input" placeholder="ghp_xxxx">
            </div>
            <div class="input-group">
                <label>仓库路径 (USER/REPO)</label>
                <input type="text" id="ghRepo" class="modal-input" placeholder="ShawnHo/AmazonTools">
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="input-group"><label>品牌词库</label><textarea id="brandWords" style="height:60px; font-size:11px;"></textarea></div>
                <div class="input-group"><label>违禁词库</label><textarea id="restrictedWords" style="height:60px; font-size:11px;"></textarea></div>
            </div>
            <button class="btn btn-blue" style="width:100%; justify-content:center; margin-top:10px;" id="ghSyncBtn" onclick="syncCloud()">🔄 立即从 GitHub 同步词库</button>
        </div>

        <div id="content-ai" style="display:none;">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="input-group">
                    <label>AI 供应商</label>
                    <select id="apiHost" class="modal-input" onchange="updateModelOptions()">
                        <option value="https://api.deepseek.com">DeepSeek</option>
                        <option value="https://openrouter.ai/api/v1">OpenRouter (推荐)</option>
                        <option value="https://api.openai.com/v1">OpenAI</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>模型选择</label>
                    <select id="apiModel" class="modal-input"></select>
                </div>
            </div>
            <div class="input-group">
                <label>API KEY</label>
                <input type="password" id="apiKey" class="modal-input" placeholder="sk-xxxx">
            </div>
            <div class="input-group">
                <label>AI 合规指令 (System Prompt)</label>
                <textarea id="aiPrompt" style="height:100px; font-size:11px;"></textarea>
            </div>
        </div>

        <button class="btn btn-blue" style="width:100%; justify-content:center; margin-top:20px; height:44px;" onclick="saveAllAndClose()">保存并应用配置</button>
    </div>
</div>

<script>
    let rawData = [];
    const DEFAULT_PROMPT = `你是一个亚马逊Listing合规专家。剔除违规内容但必须保留兼容性描述：
1. 【保留】跟在 "for", "compatible with", "replacement for", "fits" 后面的品牌词。
2. 【剔除】所有孤立出现的品牌词（如 "This is a Sony TV" 删掉 Sony）。
3. 【剔除】亚马逊禁售词（农药、保修、FDA等）。
4. 只返回清洗后的正文，保留HTML，不解释。`;

    const MODEL_MAP = {
        "https://api.deepseek.com": ["deepseek-chat", "deepseek-reasoner"],
        "https://openrouter.ai/api/v1": ["google/gemini-2.0-flash-001", "openai/gpt-4o-mini", "anthropic/claude-3.5-haiku"],
        "https://api.openai.com/v1": ["gpt-4o", "gpt-4o-mini"]
    };

    // 初始化
    window.onload = () => {
        ['ghToken','ghRepo','apiHost','apiKey','aiPrompt','brandWords','restrictedWords','apiModel'].forEach(id => {
            const val = localStorage.getItem('sh_clean_v2_' + id);
            if(id === 'aiPrompt' && !val) document.getElementById(id).value = DEFAULT_PROMPT;
            else if(val) document.getElementById(id).value = val;
        });
        updateModelOptions(localStorage.getItem('sh_clean_v2_apiModel'));
        checkConfigStatus();
    };

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    function updateModelOptions(savedModel) {
        const host = document.getElementById('apiHost').value;
        const select = document.getElementById('apiModel');
        select.innerHTML = MODEL_MAP[host].map(m => `<option value="${m}" ${m===savedModel?'selected':''}>${m}</option>`).join('');
    }

    async function syncCloud() {
        const btn = document.getElementById('ghSyncBtn');
        const token = document.getElementById('ghToken').value;
        const repo = document.getElementById('ghRepo').value;
        if(!token || !repo) return showToast("❌ 请先输入 Token 和 仓库路径");
        
        btn.innerText = "⏳ 正在连接 GitHub...";
        try {
            const res = await fetch(`https://api.github.com/repos/${repo}/contents/brand_repo.json`, {
                headers: { "Authorization": `token ${token}` }
            });
            if(res.ok) {
                const data = await res.json();
                const content = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                document.getElementById('brandWords').value = (content.brands || []).join(', ');
                document.getElementById('restrictedWords').value = (content.restricted || []).join(', ');
                showToast("✅ 词库同步成功");
            } else {
                showToast("❌ 同步失败: 请检查 Token 或文件是否存在");
            }
        } catch(e) { showToast("❌ 网络请求错误"); }
        btn.innerText = "🔄 立即从 GitHub 同步词库";
    }

    // 进度条控制
    function setProgress(type, percent) {
        const bar = document.querySelector(`#${type}Progress .progress-bar`);
        const container = document.getElementById(`${type}Progress`);
        container.style.display = percent > 0 && percent < 100 ? 'block' : 'none';
        bar.style.width = percent + '%';
    }

    async function runSingleClean(mode) {
        const input = document.getElementById('textInput').value;
        if(!input) return;
        
        setProgress('single', 30);
        if(mode === 'rule') {
            await new Promise(r => setTimeout(r, 500)); // 模拟计算
            document.getElementById('textOutput').innerText = dummyClean(input);
            setProgress('single', 100);
            showToast("✅ 本地词库清洗完成");
        } else {
            // AI 逻辑
            const key = document.getElementById('apiKey').value;
            if(!key) return showToast("❌ 请先配置 API Key");
            setProgress('single', 60);
            // 模拟 API 调用...
            setTimeout(() => {
                document.getElementById('textOutput').innerText = "[AI 清洗结果] " + input.substring(0, 50) + "...";
                setProgress('single', 100);
            }, 1000);
        }
    }

    async function runTableClean() {
        if(!rawData.length) return;
        const total = rawData.length;
        document.getElementById('tableBtn').disabled = true;
        
        for(let i = 0; i < total; i++) {
            // 批量处理逻辑...
            const progress = Math.round(((i + 1) / total) * 100);
            setProgress('batch', progress);
            if(i % 5 === 0) await new Promise(r => setTimeout(r, 50)); // 防止阻塞 UI
        }
        
        document.getElementById('exportBtn').disabled = false;
        document.getElementById('tableBtn').disabled = false;
        showToast(`✅ 已处理 ${total} 条数据`);
    }

    function checkConfigStatus() {
        const btn = document.getElementById('mainConfigBtn');
        const text = document.getElementById('configText');
        const hasKey = document.getElementById('apiKey').value && document.getElementById('ghToken').value;
        btn.className = hasKey ? "config-trigger status-on" : "config-trigger status-off";
        text.innerText = hasKey ? "系统配置已就绪" : "配置未就绪";
    }

    function saveAllAndClose() {
        ['ghToken','ghRepo','apiHost','apiKey','aiPrompt','brandWords','restrictedWords','apiModel'].forEach(id => {
            localStorage.setItem('sh_clean_v2_' + id, document.getElementById(id).value);
        });
        checkConfigStatus();
        closeModal();
        showToast("💾 配置已保存");
    }

    function openModal() { document.getElementById('modalOverlay').style.display = 'flex'; }
    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
    function switchTab(type) {
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + type).classList.add('active');
        document.getElementById('content-gh').style.display = type === 'gh' ? 'block' : 'none';
        document.getElementById('content-ai').style.display = type === 'ai' ? 'block' : 'none';
    }

    function dummyClean(t) { return t.replace(/Sony|Nike/gi, "[CLEANED]"); }
    function clearText() { document.getElementById('textInput').value = ""; document.getElementById('textOutput').innerText = ""; }
    function clearTable() { rawData = []; document.getElementById('tBody').innerHTML=""; document.getElementById('tableBtn').disabled=true; }
</script>
</body>
</html>
