<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图床大师 - 开发者生产力工具</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --apple-bg: #f5f5f7; --apple-blue: #0066cc; --apple-purple: #5e5ce6;
            --apple-card: #ffffff; --apple-text: #1d1d1f; --apple-red: #ff3b30;
        }

        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--apple-bg); margin: 0; color: var(--apple-text); -webkit-font-smoothing: antialiased; }
        
        /* 导航头 */
        .nav-header {
            height: 52px; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; border-bottom: 1px solid rgba(0,0,0,0.05);
            position: sticky; top: 0; z-index: 1000;
        }
        .home-logo { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #fff; border: 1px solid #e5e5e7; text-decoration: none; }
        
        /* 配置按钮 */
        .settings-trigger {
            display: flex; align-items: center; gap: 6px; cursor: pointer;
            padding: 6px 12px; border-radius: 10px; transition: 0.2s;
            font-size: 13px; font-weight: 500; color: var(--apple-blue);
        }
        .settings-trigger:hover { background: rgba(0,102,204,0.05); }

        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .card { background: var(--apple-card); border-radius: 24px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); }

        /* 弹窗样式 */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.2); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-card {
            background: #fff; width: 400px; border-radius: 20px; padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); animation: modalIn 0.3s ease-out;
        }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } }
        
        .field-group { margin-bottom: 16px; }
        .field-label { display: block; font-size: 12px; font-weight: 600; color: #86868b; margin-bottom: 6px; }
        .modal-card input {
            width: 100%; box-sizing: border-box; padding: 10px 14px; border: 1px solid #d2d2d7;
            border-radius: 10px; font-size: 14px; outline: none; transition: 0.2s;
        }
        .modal-card input:focus { border-color: var(--apple-blue); }

        /* 上传区 */
        .drop-zone {
            border: 2px dashed #d2d2d7; border-radius: 20px; padding: 50px 20px;
            background: #fafafa; cursor: pointer; transition: 0.3s; text-align: center;
        }
        .drop-zone:hover { border-color: var(--apple-blue); background: #fff; }

        .status-pill {
            display: inline-block; padding: 6px 16px; border-radius: 20px;
            font-size: 13px; font-weight: 600; margin: 20px 0;
            background: #f5f5f7; color: #86868b;
        }

        .btn-group { display: flex; justify-content: center; gap: 12px; }
        .btn {
            padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 600;
            border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .btn-primary { background: var(--apple-purple); color: white; }
        .btn-success { background: #34c759; color: white; }
        .btn-black { background: #1d1d1f; color: white; }
        .btn:disabled { background: #e5e5e7; color: #86868b; cursor: not-allowed; }

        /* 表格 */
        .table-container { margin-top: 30px; border-top: 1px solid #f2f2f2; }
        .result-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .result-table th { text-align: left; font-size: 12px; color: #86868b; padding: 12px; }
        .result-table td { padding: 12px; border-bottom: 1px solid #f2f2f2; font-size: 13px; }
        .thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; }
        .link-url { font-family: monospace; color: var(--apple-blue); font-size: 11px; word-break: break-all; }
    </style>
</head>
<body>

<div class="nav-header">
    <a href="#" class="home-logo">☁️</a>
    <div style="font-weight: 600; font-size: 14px;">Automation Image Hub</div>
    <div class="settings-trigger" onclick="toggleModal(true)">
        <span>⚙️ GitHub 配置</span>
    </div>
</div>

<div class="container">
    <div class="card">
        <div id="dropZone" class="drop-zone" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 40px; margin-bottom: 12px;">📤</div>
            <div style="font-size: 16px; font-weight: 600;">投放或点击上传图片</div>
            <div style="color: #86868b; font-size: 13px; margin-top: 8px;" id="fileInfo">将自动生成 GitHub 直连链接</div>
            <input type="file" id="fileInput" hidden multiple accept="image/*" onchange="handleSelect()">
        </div>

        <div style="text-align: center;">
            <div id="statusPill" class="status-pill">等待配置</div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" id="uploadBtn" onclick="startUpload()" disabled>⚡ 开始批量部署</button>
            <button class="btn btn-success" id="exportBtn" onclick="exportToExcel()" disabled>📊 导出 Excel</button>
        </div>

        <div class="table-container">
            <table class="result-table">
                <thead>
                    <tr><th width="50">预览</th><th>文件名</th><th>GitHub 直连链接 (Raw)</th></tr>
                </thead>
                <tbody id="resultBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
        <div style="font-weight: 700; font-size: 18px; margin-bottom: 20px;">GitHub API 配置</div>
        
        <div class="field-group">
            <label class="field-label">PERSONAL ACCESS TOKEN</label>
            <input type="password" id="ghToken" placeholder="github_pat_...">
        </div>

        <div class="field-group">
            <label class="field-label">REPOSITORY (用户名/仓库名)</label>
            <input type="text" id="ghRepo" placeholder="ShawnH0/AmazonAssets">
        </div>

        <div style="display: flex; gap: 10px; margin-top: 24px;">
            <button class="btn btn-black" style="flex: 1;" onclick="saveConfig()">锁定配置</button>
            <button class="btn" style="flex: 1; background: #eee;" onclick="toggleModal(false)">取消</button>
        </div>
        <p style="font-size: 11px; color: #86868b; margin-top: 15px;">* 配置将保存在浏览器本地，不会上传至任何服务器。</p>
    </div>
</div>

<script>
    let results = [];

    window.onload = () => {
        const config = JSON.parse(localStorage.getItem('gh_config_shawn') || '{}');
        if (config.token) document.getElementById('ghToken').value = config.token;
        if (config.repo) document.getElementById('ghRepo').value = config.repo;
        checkConfigStatus();
    };

    function toggleModal(show) {
        document.getElementById('modalOverlay').style.display = show ? 'flex' : 'none';
    }

    function saveConfig() {
        const token = document.getElementById('ghToken').value.trim();
        const repo = document.getElementById('ghRepo').value.trim();
        
        if (!token || !repo) return alert("请完整填写 Token 和 仓库名");
        
        localStorage.setItem('gh_config_shawn', JSON.stringify({ token, repo }));
        toggleModal(false);
        checkConfigStatus();
        alert("✅ 配置已锁定！");
    }

    function checkConfigStatus() {
        const config = JSON.parse(localStorage.getItem('gh_config_shawn') || '{}');
        const pill = document.getElementById('statusPill');
        if (config.token && config.repo) {
            pill.innerText = "配置就绪，请上传图片";
            pill.style.color = "var(--apple-blue)";
        } else {
            pill.innerText = "⚠️ 请先点击右上角设置 GitHub 配置";
            pill.style.color = "var(--apple-red)";
        }
    }

    function handleSelect() {
        const count = document.getElementById('fileInput').files.length;
        if(count > 0) {
            document.getElementById('fileInfo').innerText = `已准备好 ${count} 张待处理图片`;
            document.getElementById('uploadBtn').disabled = false;
        }
    }

    async function startUpload() {
        const config = JSON.parse(localStorage.getItem('gh_config_shawn') || '{}');
        const files = document.getElementById('fileInput').files;
        const pill = document.getElementById('statusPill');
        const uploadBtn = document.getElementById('uploadBtn');

        if(!config.token || !config.repo) return toggleModal(true);

        uploadBtn.disabled = true;
        pill.style.background = "rgba(0,102,204,0.1)";

        for(let i=0; i<files.length; i++) {
            const file = files[i];
            pill.innerText = `正在处理 ${i+1}/${files.length}`;

            try {
                const base64 = await toBase64(file);
                const content = base64.split(',')[1];
                const timestamp = Date.now();
                const path = `assets/${timestamp}_${file.name.replace(/[^a-zA-Z0-9\.]/g, '_')}`;

                const resp = await fetch(`https://api.github.com/repos/${config.repo}/contents/${path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${config.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Upload asset: ${file.name}`,
                        content: content
                    })
                });

                if(resp.ok) {
                    const rawUrl = `https://raw.githubusercontent.com/${config.repo}/main/${path}`;
                    results.push({ "文件名": file.name, "图片链接": rawUrl });
                    renderRow(base64, file.name, rawUrl);
                } else {
                    console.error("上传失败", await resp.text());
                }
            } catch (e) { console.error(e); }
        }

        pill.innerText = "全部任务完成";
        pill.style.background = "rgba(52,199,89,0.1)";
        pill.style.color = "#34c759";
        document.getElementById('exportBtn').disabled = false;
        uploadBtn.disabled = false;
    }

    const toBase64 = file => new Promise((res, rej) => {
        const r = new FileReader();
        r.readAsDataURL(file);
        r.onload = () => res(r.result);
        r.onerror = e => rej(e);
    });

    function renderRow(img, name, url) {
        const row = `
            <tr>
                <td><img src="${img}" class="thumb"></td>
                <td style="color:#86868b">${name}</td>
                <td><a href="${url}" target="_blank" class="link-url">${url}</a></td>
            </tr>
        `;
        document.getElementById('resultBody').insertAdjacentHTML('afterbegin', row);
    }

    function exportToExcel() {
        const ws = XLSX.utils.json_to_sheet(results);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "AssetLinks");
        XLSX.writeFile(wb, `Amazon_Links_${Date.now()}.xlsx`);
    }
</script>

</body>
</html>
