<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub 图床 - Amazon 运营工具箱</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #1890ff; --bg: #f5f7fa; --success: #52c41a; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        /* 导航头部 */
        .nav-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; background: white; padding: 12px 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .back-btn { text-decoration: none; color: var(--primary); font-weight: bold; display: flex; align-items: center; gap: 5px; }

        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; }
        
        /* 配置区 */
        .config-section { display: flex; gap: 15px; align-items: flex-end; margin-bottom: 10px; padding: 15px; background: #fffbe6; border: 1px solid #ffe58f; border-radius: 8px; }
        .config-item { flex: 1; }
        .config-item label { display: block; font-size: 12px; margin-bottom: 5px; color: #856404; }
        .config-item input { width: 100%; padding: 8px; border: 1px solid #d9d9d9; border-radius: 4px; }

        /* 上传区 */
        .upload-dropzone { border: 2px dashed #d9d9d9; padding: 40px; border-radius: 8px; text-align: center; cursor: pointer; transition: 0.3s; background: #fafafa; margin-bottom: 20px; }
        .upload-dropzone:hover { border-color: var(--primary); background: #f0f7ff; }
        
        /* 操作按钮 */
        .btn-group { display: flex; gap: 12px; margin-bottom: 20px; }
        .btn { padding: 10px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn:disabled { background: #bfbfbf; cursor: not-allowed; }

        /* 结果列表 */
        table { width: 100%; border-collapse: collapse; }
        th { background: #fafafa; padding: 12px; text-align: left; border-bottom: 2px solid #f0f0f0; font-size: 14px; }
        td { padding: 12px; border-bottom: 1px solid #f0f0f0; font-size: 13px; word-break: break-all; }
        .preview-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; background: #eee; }
        .url-text { color: var(--primary); font-family: monospace; cursor: pointer; }
        .url-text:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-header">
        <a href="index.html" class="back-btn"><span>🏠</span> 返回首页</a>
        <div style="font-weight: bold;">批量图床上传工具 (GitHub API)</div>
    </div>

    <div class="config-section">
        <div class="config-item">
            <label>GitHub Token (已加密保存):</label>
            <input type="password" id="ghToken" placeholder="输入 github_pat_...">
        </div>
        <div class="config-item">
            <label>仓库路径:</label>
            <input type="text" id="ghRepo" value="ShawnH0/AmazonTools" placeholder="用户名/仓库名">
        </div>
        <button class="btn" style="background:#faad14; color:white;" onclick="saveConfig()">💾 保存配置</button>
    </div>

    <div class="card">
        <div class="upload-dropzone" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 40px;">📤</div>
            <p style="margin:10px 0; font-weight:bold;">点击选择图片或拖拽图片到此处</p>
            <p style="font-size:12px; color:#8c8c8c;">支持批量选择，图片将上传至 /images/ 文件夹</p>
            <input type="file" id="fileInput" hidden multiple accept="image/*">
        </div>

        <div id="status" style="text-align:center; margin-bottom:15px; color: var(--primary); font-weight:bold;"></div>

        <div class="btn-group">
            <button class="btn btn-primary" id="startBtn" onclick="batchUpload()">🚀 开始批量上传</button>
            <button class="btn btn-success" id="exportBtn" disabled onclick="exportExcel()">📊 导出 Excel 表格</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width:80px;">预览</th>
                    <th>原始文件名</th>
                    <th>生成图片URL (点击可预览)</th>
                </tr>
            </thead>
            <tbody id="resultBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    let uploadResults = [];

    // 页面加载时恢复配置
    window.onload = () => {
        if(localStorage.getItem('gh_token')) document.getElementById('ghToken').value = localStorage.getItem('gh_token');
        if(localStorage.getItem('gh_repo')) document.getElementById('ghRepo').value = localStorage.getItem('gh_repo');
    };

    function saveConfig() {
        localStorage.setItem('gh_token', document.getElementById('ghToken').value);
        localStorage.setItem('gh_repo', document.getElementById('ghRepo').value);
        alert('配置已安全保存在本地浏览器！');
    }

    async function batchUpload() {
        const token = document.getElementById('ghToken').value;
        const repo = document.getElementById('ghRepo').value;
        const files = document.getElementById('fileInput').files;
        const status = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');

        if (!token || !repo || files.length === 0) return alert("请确配置Token和仓库，并选择图片！");

        startBtn.disabled = true;
        let successCount = 0;

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            status.innerText = `正在上传第 (${i+1}/${files.length}) 张: ${file.name}`;
            
            try {
                const base64Content = await toBase64(file);
                const content = base64Content.split(',')[1];
                // 命名规则：时间戳_原文件名 (避免重复)
                const safeName = `${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
                const path = `images/${safeName}`;

                const response = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Upload image: ${file.name}`,
                        content: content
                    })
                });

                if (response.ok) {
                    // 生成 Raw 链接
                    const rawUrl = `https://raw.githubusercontent.com/${repo}/main/${path}`;
                    uploadResults.push({ filename: file.name, url: rawUrl });
                    appendRow(base64Content, file.name, rawUrl);
                    successCount++;
                } else {
                    console.error('上传失败:', await response.json());
                }
            } catch (err) {
                console.error('错误:', err);
            }
        }

        status.innerText = `✅ 上传完成！成功: ${successCount} 张`;
        document.getElementById('exportBtn').disabled = false;
        startBtn.disabled = false;
    }

    function toBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    function appendRow(preview, name, url) {
        const tbody = document.getElementById('resultBody');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><img src="${preview}" class="preview-thumb"></td>
            <td>${name}</td>
            <td><span class="url-text" onclick="window.open('${url}')">${url}</span></td>
        `;
        tbody.appendChild(tr);
    }

    function exportExcel() {
        const worksheet = XLSX.utils.json_to_sheet(uploadResults.map(item => ({
            "文件名": item.filename,
            "亚马逊可用图片链接 (URL)": item.url
        })));
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "图床链接");
        XLSX.writeFile(workbook, `Amazon_Images_${Date.now()}.xlsx`);
    }
</script>

</body>
</html>
