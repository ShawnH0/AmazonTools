<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极速图床 - Amazon 运营工具箱</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #1890ff; --bg: #f5f7fa; --success: #52c41a; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        .nav-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; background: white; padding: 12px 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .back-btn { text-decoration: none; color: var(--primary); font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .upload-dropzone { border: 2px dashed #d9d9d9; padding: 50px; border-radius: 8px; text-align: center; cursor: pointer; background: #fafafa; transition: 0.3s; }
        .upload-dropzone:hover { border-color: var(--primary); background: #f0f7ff; }
        .btn-group { display: flex; gap: 12px; margin: 20px 0; }
        .btn { padding: 12px 30px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 14px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn:disabled { background: #bfbfbf; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #fafafa; padding: 12px; text-align: left; border-bottom: 2px solid #f0f0f0; }
        td { padding: 12px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
        .preview-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .url-link { color: var(--primary); font-family: monospace; text-decoration: none; }
        .status-tag { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: #e6f7ff; color: #1890ff; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-header">
        <a href="index.html" class="back-btn"><span>🏠</span> 返回首页</a>
        <div style="font-weight: bold; color: #595959;">⚡ 极速批量图床 (自动配置已启用)</div>
    </div>

    <div class="card">
        <div style="display: none;">
            <input type="password" id="ghToken" value="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">
            <input type="text" id="ghRepo" value="ShawnH0/AmazonTools">
        </div>

        <div class="upload-dropzone" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 48px;">📸</div>
            <h3 style="margin: 15px 0 5px 0;">点击或拖拽图片到这里</h3>
            <p style="color: #8c8c8c; font-size: 14px;">已自动连接至仓库：ShawnH0/AmazonTools</p>
            <input type="file" id="fileInput" hidden multiple accept="image/*">
        </div>

        <div id="statusInfo" style="margin-top: 15px; text-align: center; min-height: 20px;"></div>

        <div class="btn-group">
            <button class="btn btn-primary" id="uploadBtn" onclick="doUpload()">🚀 一键批量上传</button>
            <button class="btn btn-success" id="exportBtn" disabled onclick="exportToExcel()">📊 导出 Excel 链接表</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 70px;">预览</th>
                    <th>文件名</th>
                    <th>GitHub Raw URL (亚马逊直接可用)</th>
                </tr>
            </thead>
            <tbody id="resultList"></tbody>
        </table>
    </div>
</div>

<script>
    let finalData = [];

    async function doUpload() {
        const token = document.getElementById('ghToken').value;
        const repo = document.getElementById('ghRepo').value;
        const files = document.getElementById('fileInput').files;
        const status = document.getElementById('statusInfo');
        const uploadBtn = document.getElementById('uploadBtn');

        if (files.length === 0) return alert("请先选择图片！");

        uploadBtn.disabled = true;
        status.style.color = "#1890ff";

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            status.innerText = `正在处理 (${i+1}/${files.length}): ${file.name}...`;

            try {
                const base64 = await toBase64(file);
                const content = base64.split(',')[1];
                // 命名规则：日期_原文件名
                const timestamp = new Date().getTime();
                const path = `images/${timestamp}_${file.name.replace(/\s+/g, '_')}`;

                const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Upload via Tool: ${file.name}`,
                        content: content
                    })
                });

                if (res.ok) {
                    const rawUrl = `https://raw.githubusercontent.com/${repo}/main/${path}`;
                    finalData.push({ name: file.name, url: rawUrl });
                    addTableRow(base64, file.name, rawUrl);
                }
            } catch (e) {
                console.error(e);
            }
        }

        status.innerText = `✅ 全部上传完成！共 ${finalData.length} 张图片。`;
        status.style.color = "#52c41a";
        document.getElementById('exportBtn').disabled = false;
        uploadBtn.disabled = false;
    }

    function toBase64(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
        });
    }

    function addTableRow(img, name, url) {
        const tbody = document.getElementById('resultList');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><img src="${img}" class="preview-thumb"></td>
            <td>${name} <span class="status-tag">已同步</span></td>
            <td><a href="${url}" target="_blank" class="url-link">${url}</a></td>
        `;
        tbody.prepend(tr); // 最新的排在最上面
    }

    function exportToExcel() {
        const ws = XLSX.utils.json_to_sheet(finalData.map(item => ({
            "文件名": item.name,
            "图片链接(亚马逊模版直用)": item.url
        })));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "URL_Results");
        XLSX.writeFile(wb, `Amazon_Links_${new Date().getTime()}.xlsx`);
    }
</script>

</body>
</html>
