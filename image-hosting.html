<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图床大师 - 开发者生产力工具</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-blue: #0066cc;
            --apple-purple: #5e5ce6;
            --apple-card: #ffffff;
            --apple-text: #1d1d1f;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--apple-bg); margin: 0; color: var(--apple-text);
            -webkit-font-smoothing: antialiased;
        }

        /* 导航头 */
        .nav-header {
            height: 52px; background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; border-bottom: 1px solid rgba(0,0,0,0.05);
            position: sticky; top: 0; z-index: 100;
        }

        .home-logo {
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; background: #fff; border: 1px solid #e5e5e7;
            color: #1d1d1f; text-decoration: none;
        }

        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }

        /* 配置区：毛玻璃效果 */
        .config-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 16px; padding: 16px 24px;
            margin-bottom: 24px; border: 1px solid rgba(0,0,0,0.05);
            display: flex; align-items: center; gap: 15px;
        }

        .config-card input {
            flex: 1; background: rgba(255,255,255,0.8);
            border: 1px solid #d2d2d7; border-radius: 8px;
            padding: 8px 12px; font-size: 13px; outline: none;
            transition: 0.2s;
        }
        .config-card input:focus { border-color: var(--apple-blue); box-shadow: 0 0 0 3px rgba(0,102,204,0.1); }

        /* 主操作区 */
        .card { background: var(--apple-card); border-radius: 24px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); }

        .drop-zone {
            border: 2px dashed #d2d2d7; border-radius: 20px; padding: 60px 20px;
            background: #fafafa; cursor: pointer; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }
        .drop-zone:hover { border-color: var(--apple-blue); background: #fff; }
        .drop-zone.drag-over { transform: scale(1.02); background: rgba(0,102,204,0.05); border-color: var(--apple-blue); }

        .status-pill {
            display: inline-block; padding: 6px 16px; border-radius: 20px;
            font-size: 13px; font-weight: 600; margin: 20px 0;
            background: #f5f5f7; color: #86868b;
        }

        .btn-group { display: flex; justify-content: center; gap: 12px; }
        .btn {
            padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 600;
            border: none; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; gap: 8px;
        }
        .btn-primary { background: var(--apple-purple); color: white; }
        .btn-success { background: #34c759; color: white; }
        .btn:disabled { background: #e5e5e7; color: #86868b; cursor: not-allowed; }
        .btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.1); }

        /* 表格设计 */
        .table-container { margin-top: 40px; border-top: 1px solid #f2f2f2; }
        .result-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .result-table th { text-align: left; font-size: 12px; color: #86868b; padding: 12px; border-bottom: 1px solid #f2f2f2; }
        .result-table td { padding: 16px 12px; border-bottom: 1px solid #f2f2f2; font-size: 13px; }

        .thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .link-url { font-family: 'SF Mono', monospace; color: var(--apple-blue); background: rgba(0,102,204,0.05); padding: 4px 8px; border-radius: 4px; font-size: 11px; text-decoration: none; }
    </style>
</head>
<body>

<div class="nav-header">
    <a href="index.html" class="home-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
    </a>
    <div style="font-weight: 600;">Automation Image Hub</div>
    <div style="width: 32px;"></div>
</div>

<div class="container">
    <div class="config-card">
        <span style="font-size: 12px; font-weight: 600; color: #faad14;">GITHUB TOKEN</span>
        <input type="password" id="ghToken" placeholder="github_pat_...">
        <button class="btn" style="padding: 6px 12px; font-size: 12px; background: #1d1d1f; color: white;" onclick="saveToken()">锁定本地</button>
    </div>

    <div class="card">
        <div id="dropZone" class="drop-zone" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 48px; margin-bottom: 16px;">☁️</div>
            <div style="font-size: 18px; font-weight: 600;">投放或点击上传图片</div>
            <div style="color: #86868b; font-size: 13px; margin-top: 8px;" id="fileInfo">将自动生成 GitHub 直连链接</div>
            <input type="file" id="fileInput" hidden multiple accept="image/*" onchange="handleSelect()">
        </div>

        <div style="text-align: center;">
            <div id="statusPill" class="status-pill">等待任务</div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" id="uploadBtn" onclick="startUpload()" disabled>⚡ 开始自动化部署</button>
            <button class="btn btn-success" id="exportBtn" onclick="exportToExcel()" disabled>📊 导出 Excel 链接表</button>
        </div>

        <div class="table-container">
            <table class="result-table">
                <thead>
                    <tr>
                        <th width="60">预览</th>
                        <th>文件名</th>
                        <th>Amazon 直连链接</th>
                    </tr>
                </thead>
                <tbody id="resultBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    window.onload = () => {
        const token = localStorage.getItem('gh_token_shawn');
        if(token) document.getElementById('ghToken').value = token;
    };

    function saveToken() {
        const val = document.getElementById('ghToken').value.trim();
        if(val) {
            localStorage.setItem('gh_token_shawn', val);
            alert("🔐 密钥已存储在当前浏览器本地。");
        }
    }

    function handleSelect() {
        const count = document.getElementById('fileInput').files.length;
        if(count > 0) {
            document.getElementById('fileInfo').innerText = `已准备好 ${count} 张待处理图片`;
            document.getElementById('uploadBtn').disabled = false;
            document.getElementById('statusPill').innerText = "就绪";
        }
    }

    let results = [];

    async function startUpload() {
        const token = localStorage.getItem('gh_token_shawn') || document.getElementById('ghToken').value.trim();
        const repo = "ShawnH0/AmazonTools"; // 替换为你的仓库
        const files = document.getElementById('fileInput').files;
        const pill = document.getElementById('statusPill');
        const uploadBtn = document.getElementById('uploadBtn');

        if(!token) return alert("请先输入 GitHub Token");

        uploadBtn.disabled = true;
        pill.style.background = "rgba(0,102,204,0.1)";
        pill.style.color = "var(--apple-blue)";

        for(let i=0; i<files.length; i++) {
            const file = files[i];
            pill.innerText = `正在处理 ${i+1}/${files.length}`;

            try {
                const base64 = await toBase64(file);
                const content = base64.split(',')[1];
                
                // 开发者技巧：文件名哈希处理，防止重名导致 409 报错
                const timestamp = Date.now();
                const randomHash = Math.random().toString(36).substring(7);
                const safeName = file.name.replace(/[^a-zA-Z0-9\.]/g, '_');
                const path = `images/${timestamp}_${randomHash}_${safeName}`;

                const resp = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `🚀 Auto-Upload: ${file.name}`,
                        content: content
                    })
                });

                if(resp.ok) {
                    const rawUrl = `https://raw.githubusercontent.com/${repo}/main/${path}`;
                    results.push({ "文件名": file.name, "图片链接": rawUrl });
                    renderRow(base64, file.name, rawUrl);
                }
            } catch (e) {
                console.error(e);
            }
        }

        pill.innerText = "任务完成";
        pill.style.background = "rgba(52,199,89,0.1)";
        pill.style.color = "#34c759";
        document.getElementById('exportBtn').disabled = false;
        uploadBtn.disabled = false;
    }

    const toBase64 = file => new Promise((res, rej) => {
        const r = new FileReader();
        r.readAsDataURL(file);
        r.onload = () => res(r.result);
        r.onerror = e => rej(e);
    });

    function renderRow(img, name, url) {
        const tbody = document.getElementById('resultBody');
        const row = `
            <tr>
                <td><img src="${img}" class="thumb"></td>
                <td style="color:#86868b">${name}</td>
                <td><a href="${url}" target="_blank" class="link-url">${url}</a></td>
            </tr>
        `;
        tbody.insertAdjacentHTML('afterbegin', row);
    }

    function exportToExcel() {
        const ws = XLSX.utils.json_to_sheet(results);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Links");
        XLSX.writeFile(wb, `Amazon_Assets_${Date.now()}.xlsx`);
    }
</script>

</body>
</html>
