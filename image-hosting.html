<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>极速图床 - Amazon 运营工具箱</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #1890ff; --bg: #f5f7fa; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .config-bar { background: #fffbe6; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ffe58f; display: flex; gap: 10px; align-items: center; }
        .upload-zone { border: 2px dashed #d9d9d9; padding: 40px; border-radius: 8px; text-align: center; cursor: pointer; background: #fafafa; }
        .btn { padding: 10px 25px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .btn-process { background: #722ed1; color: white; margin-top: 20px; width: 100%; font-size: 16px; }
        .btn-process:disabled { background: #bfbfbf; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        td, th { padding: 12px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
        .preview-img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="config-bar" id="configBar">
        <span style="font-size: 12px; color: #856404;">🔑 请输入新 Token (仅存本地):</span>
        <input type="password" id="ghToken" style="flex: 1; padding: 5px;">
        <button onclick="saveConfig()" style="background: #faad14; color: white; border: none; padding: 5px 15px; border-radius: 4px; cursor: pointer;">保存并锁定</button>
    </div>

    <div class="card">
        <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 40px;">📁</div>
            <p id="fileInfo">点击选择图片 (已连接: ShawnH0/AmazonTools)</p>
            <input type="file" id="fileInput" hidden multiple accept="image/*" onchange="updateInfo()">
        </div>

        <div id="status" style="text-align: center; margin-top: 15px; font-weight: bold;"></div>

        <button class="btn btn-process" id="startBtn" onclick="runUpload()" disabled>🚀 开始处理上传</button>

        <table>
            <tbody id="resultList"></tbody>
        </table>
        
        <button class="btn" style="background: #52c41a; color: white; width: 100%; margin-top: 10px;" id="expBtn" disabled onclick="exportExcel()">📊 导出 Excel</button>
    </div>
</div>

<script>
    // 页面加载时尝试读取本地存储
    window.onload = () => {
        const savedToken = localStorage.getItem('my_gh_token');
        if (savedToken) {
            document.getElementById('ghToken').value = savedToken;
            document.getElementById('configBar').style.opacity = "0.5";
        }
    };

    function saveConfig() {
        const token = document.getElementById('ghToken').value;
        if (token) {
            localStorage.setItem('my_gh_token', token);
            alert("Token 已加密存入浏览器。由于 GitHub 政策，请勿将包含 Token 的代码推送到公库。");
            document.getElementById('configBar').style.opacity = "0.5";
        }
    }

    function updateInfo() {
        const files = document.getElementById('fileInput').files;
        if (files.length > 0) {
            document.getElementById('fileInfo').innerText = `已选 ${files.length} 张图片，准备就绪`;
            document.getElementById('startBtn').disabled = false;
        }
    }

    let results = [];
    async function runUpload() {
        const token = localStorage.getItem('my_gh_token') || document.getElementById('ghToken').value;
        const repo = "ShawnH0/AmazonTools";
        const files = document.getElementById('fileInput').files;
        const status = document.getElementById('status');

        if (!token) return alert("请先输入并保存 Token！");

        document.getElementById('startBtn').disabled = true;
        
        for (let file of files) {
            status.innerText = `正在同步: ${file.name}...`;
            try {
                const base64 = await toBase64(file);
                const content = base64.split(',')[1];
                const path = `images/${Date.now()}_${file.name.replace(/\s+/g, '_')}`;

                const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: 'upload', content: content })
                });

                if (res.ok) {
                    const url = `https://raw.githubusercontent.com/${repo}/main/${path}`;
                    results.push({ name: file.name, url: url });
                    addCell(base64, file.name, url);
                } else {
                    const errorData = await res.json();
                    status.innerText = `❌ 失败: ${errorData.message}`;
                    status.style.color = "red";
                    break;
                }
            } catch (e) { console.error(e); }
        }
        status.innerText = `✅ 成功完成 ${results.length} 张！`;
        document.getElementById('expBtn').disabled = false;
    }

    function toBase64(file) {
        return new Promise(r => { const reader = new FileReader(); reader.readAsDataURL(file); reader.onload = () => r(reader.result); });
    }

    function addCell(img, name, url) {
        const row = `<tr><td><img src="${img}" class="preview-img"></td><td>${name}</td><td>${url}</td></tr>`;
        document.getElementById('resultList').insertAdjacentHTML('afterbegin', row);
    }

    function exportExcel() {
        const ws = XLSX.utils.json_to_sheet(results);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Links");
        XLSX.writeFile(wb, "Amazon_Images.xlsx");
    }
</script>
</body>
</html>
