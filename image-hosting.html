<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极速图床 - Amazon 运营工具箱</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #1890ff; --bg: #f5f7fa; --success: #52c41a; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        .nav-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; background: white; padding: 12px 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .back-btn { text-decoration: none; color: var(--primary); font-weight: bold; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        
        /* 上传区域 */
        .upload-zone { border: 2px dashed #d9d9d9; padding: 40px; border-radius: 8px; text-align: center; cursor: pointer; background: #fafafa; transition: 0.3s; }
        .upload-zone:hover { border-color: var(--primary); background: #f0f7ff; }
        .file-list-info { margin-top: 10px; font-size: 14px; color: #666; }

        /* 按钮组 */
        .action-bar { display: flex; gap: 12px; margin: 25px 0; justify-content: center; }
        .btn { padding: 12px 35px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 15px; display: flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-process { background: #722ed1; color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn:disabled { background: #bfbfbf; cursor: not-allowed; opacity: 0.7; }

        /* 结果列表 */
        .table-container { margin-top: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #fafafa; padding: 12px; text-align: left; border-bottom: 2px solid #f0f0f0; }
        td { padding: 12px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
        .preview-img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; border: 1px solid #eee; }
        .link-url { color: var(--primary); text-decoration: none; word-break: break-all; font-family: monospace; }
        
        /* 进度提示 */
        #statusMsg { text-align: center; margin-bottom: 10px; font-weight: bold; min-height: 24px; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-header">
        <a href="index.html" class="back-btn">🏠 返回首页</a>
        <div style="font-weight: bold;">🚀 批量图床自动化系统</div>
    </div>

    <div class="card">
        <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 50px;">📂</div>
            <h3 style="margin: 10px 0;">第一步：选择或拖拽图片</h3>
            <p id="fileCountInfo" style="color: #8c8c8c;">支持多选批量上传 (已自动连接仓库)</p>
            <input type="file" id="fileInput" hidden multiple accept="image/*" onchange="showFileCount()">
        </div>

        <div id="statusMsg"></div>

        <div class="action-bar">
            <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">🔍 重新选图</button>
            <button class="btn btn-process" id="processBtn" onclick="startProcessing()" disabled>⚙️ 开始处理上传</button>
            <button class="btn btn-success" id="exportBtn" onclick="exportData()" disabled>📊 导出链接表格</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 70px;">预览</th>
                        <th>文件名</th>
                        <th>GitHub 原始链接 (Amazon 直接可用)</th>
                    </tr>
                </thead>
                <tbody id="resultBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // --- 自动配置区 (已隐藏) ---
    const GITHUB_TOKEN = "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"; 
    const GITHUB_REPO = "ShawnH0/AmazonTools";
    // -------------------------

    let finalData = [];

    function showFileCount() {
        const files = document.getElementById('fileInput').files;
        const info = document.getElementById('fileCountInfo');
        const processBtn = document.getElementById('processBtn');
        
        if (files.length > 0) {
            info.innerHTML = `<b style="color: #1890ff;">已选择 ${files.length} 张图片</b>，点击下方按钮开始上传。`;
            processBtn.disabled = false;
        }
    }

    async function startProcessing() {
        const files = document.getElementById('fileInput').files;
        const status = document.getElementById('statusMsg');
        const processBtn = document.getElementById('processBtn');
        
        if (files.length === 0) return;

        processBtn.disabled = true;
        status.style.color = "#1890ff";
        
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            status.innerText = `正在上传 (${i + 1}/${files.length}): ${file.name}...`;

            try {
                const base64Content = await toBase64(file);
                const cleanBase64 = base64Content.split(',')[1];
                
                // 自动创建 images/ 目录并命名：时间戳_文件名
                const fileName = `images/${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
                
                const response = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${fileName}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Upload ${file.name} via tool`,
                        content: cleanBase64
                    })
                });

                if (response.ok) {
                    const rawUrl = `https://raw.githubusercontent.com/${GITHUB_REPO}/main/${fileName}`;
                    finalData.push({ name: file.name, url: rawUrl });
                    addResultRow(base64Content, file.name, rawUrl);
                } else {
                    const err = await response.json();
                    console.error("上传出错:", err);
                    status.innerText = `❌ ${file.name} 上传失败: ${err.message}`;
                    status.style.color = "red";
                }
            } catch (error) {
                console.error("网络错误:", error);
            }
        }

        status.innerText = `✅ 处理完成！共上传 ${finalData.length} 张图片。`;
        status.style.color = "#52c41a";
        document.getElementById('exportBtn').disabled = false;
        processBtn.disabled = false;
    }

    function toBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    function addResultRow(img, name, url) {
        const tbody = document.getElementById('resultBody');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><img src="${img}" class="preview-img"></td>
            <td>${name}</td>
            <td><a href="${url}" target="_blank" class="link-url">${url}</a></td>
        `;
        tbody.prepend(tr);
    }

    function exportData() {
        if (finalData.length === 0) return;
        const worksheet = XLSX.utils.json_to_sheet(finalData.map(item => ({
            "文件名": item.name,
            "图片直连URL": item.url
        })));
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Sheet1");
        XLSX.writeFile(workbook, `Amazon_Images_Links_${Date.now()}.xlsx`);
    }
</script>

</body>
</html>
